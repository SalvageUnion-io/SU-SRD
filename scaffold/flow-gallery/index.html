<!doctype html>
<!--
  THROWAWAY DEV SCAFFOLD — Slice H (#239).
  Standalone static screenshot-gallery for the captured ITUN flows.
  Vanilla JS + a generated manifest.json. NOT part of the monorepo build.
  >>> REMOVAL NOTE (delete before #239 merges): delete scaffold/flow-gallery/.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ITUN Flow Gallery (throwaway)</title>
    <style>
      :root {
        --bg: #14141a;
        --panel: #1e1e27;
        --border: #34343f;
        --text: #e7e7ee;
        --muted: #9a9aab;
        --accent: #e85aa0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      header .tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #000;
        background: var(--accent);
        padding: 2px 8px;
        border-radius: 999px;
        font-weight: 700;
      }
      header .meta {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
      }
      main {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .flow {
        margin-bottom: 40px;
      }
      .flow > h2 {
        font-size: 20px;
        margin: 0 0 4px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 6px;
      }
      .step {
        margin: 20px 0;
      }
      .step h3 {
        font-size: 14px;
        margin: 0 0 8px;
        color: var(--text);
      }
      .shots {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      figure button.thumb {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: #0b0b10;
        cursor: zoom-in;
      }
      figure img {
        display: block;
        width: 100%;
        height: 200px;
        object-fit: cover;
        object-position: top center;
      }
      figcaption {
        padding: 8px 10px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      figcaption .vp {
        color: var(--accent);
        font-weight: 600;
        white-space: nowrap;
      }
      #empty {
        max-width: 640px;
        line-height: 1.6;
      }
      #empty code {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 13px;
      }
      #empty pre {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 13px;
      }

      /* Lightbox */
      #lb {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 50;
      }
      #lb.open {
        display: flex;
      }
      #lb img {
        max-width: 94vw;
        max-height: 82vh;
        object-fit: contain;
        border: 1px solid var(--border);
        background: #0b0b10;
      }
      #lb .cap {
        margin-top: 12px;
        color: var(--text);
        font-size: 14px;
        text-align: center;
      }
      #lb .cap .vp {
        color: var(--accent);
        font-weight: 600;
      }
      #lb .counter {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      #lb button.nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(30, 30, 39, 0.85);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 28px;
        width: 52px;
        height: 64px;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
      }
      #lb button.prev {
        left: 16px;
      }
      #lb button.next {
        right: 16px;
      }
      #lb button.close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(30, 30, 39, 0.85);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 18px;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        cursor: pointer;
      }
      #lb button:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ITUN Flow Gallery</h1>
      <span class="tag">throwaway</span>
      <span class="meta" id="meta"></span>
    </header>
    <main id="main">
      <p id="loading">Loading manifest…</p>
    </main>

    <div id="lb" role="dialog" aria-modal="true" aria-label="Screenshot viewer">
      <button class="close" id="lb-close" aria-label="Close">✕</button>
      <button class="nav prev" id="lb-prev" aria-label="Previous">‹</button>
      <button class="nav next" id="lb-next" aria-label="Next">›</button>
      <img id="lb-img" alt="" />
      <div class="cap" id="lb-cap"></div>
      <div class="counter" id="lb-counter"></div>
    </div>

    <script>
      // Flat ordered list of every shot, used for lightbox prev/next.
      let FLAT = []
      let lbIndex = 0

      const lb = document.getElementById('lb')
      const lbImg = document.getElementById('lb-img')
      const lbCap = document.getElementById('lb-cap')
      const lbCounter = document.getElementById('lb-counter')

      function openLightbox(i) {
        lbIndex = i
        renderLightbox()
        lb.classList.add('open')
      }
      function closeLightbox() {
        lb.classList.remove('open')
      }
      function step(delta) {
        lbIndex = (lbIndex + delta + FLAT.length) % FLAT.length
        renderLightbox()
      }
      function renderLightbox() {
        const s = FLAT[lbIndex]
        if (!s) return
        lbImg.src = s.file
        lbImg.alt = `${s.flow} — ${s.label} — ${s.viewportLabel}`
        lbCap.innerHTML = `<strong>${s.flow}</strong> · ${s.label} · <span class="vp">${s.viewportLabel}</span>`
        lbCounter.textContent = `${lbIndex + 1} / ${FLAT.length}`
      }

      document.getElementById('lb-close').addEventListener('click', closeLightbox)
      document.getElementById('lb-prev').addEventListener('click', () => step(-1))
      document.getElementById('lb-next').addEventListener('click', () => step(1))
      lb.addEventListener('click', (e) => {
        if (e.target === lb) closeLightbox()
      })
      document.addEventListener('keydown', (e) => {
        if (!lb.classList.contains('open')) return
        if (e.key === 'Escape') closeLightbox()
        else if (e.key === 'ArrowLeft') step(-1)
        else if (e.key === 'ArrowRight') step(1)
      })

      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
        )
      }

      function render(manifest) {
        const main = document.getElementById('main')
        main.innerHTML = ''
        FLAT = []

        document.getElementById('meta').textContent =
          `${manifest.totalShots} shots · ${manifest.flows.length} flows · generated ${new Date(
            manifest.generatedAt
          ).toLocaleString()}`

        for (const flow of manifest.flows) {
          const sec = document.createElement('section')
          sec.className = 'flow'
          sec.innerHTML = `<h2>${esc(flow.flow)}</h2>`
          for (const stepEntry of flow.steps) {
            const stepEl = document.createElement('div')
            stepEl.className = 'step'
            stepEl.innerHTML = `<h3>${esc(stepEntry.label)}</h3>`
            const shotsEl = document.createElement('div')
            shotsEl.className = 'shots'
            for (const shot of stepEntry.shots) {
              const flat = {
                file: shot.file,
                viewport: shot.viewport,
                viewportLabel: shot.viewportLabel,
                flow: flow.flow,
                label: stepEntry.label,
              }
              const idx = FLAT.push(flat) - 1
              const fig = document.createElement('figure')
              fig.innerHTML =
                `<button class="thumb" data-idx="${idx}" aria-label="Zoom ${esc(flow.flow)} ${esc(
                  stepEntry.label
                )} ${esc(shot.viewportLabel)}">` +
                `<img loading="lazy" src="${esc(shot.file)}" alt="${esc(flow.flow)} ${esc(
                  stepEntry.label
                )} ${esc(shot.viewportLabel)}" /></button>` +
                `<figcaption><span>${esc(stepEntry.label)}</span><span class="vp">${esc(
                  shot.viewportLabel
                )}</span></figcaption>`
              shotsEl.appendChild(fig)
            }
            stepEl.appendChild(shotsEl)
            sec.appendChild(stepEl)
          }
          main.appendChild(sec)
        }

        main.addEventListener('click', (e) => {
          const btn = e.target.closest('button.thumb')
          if (btn) openLightbox(Number(btn.dataset.idx))
        })
      }

      function renderEmpty(detail) {
        document.getElementById('main').innerHTML =
          `<div id="empty">` +
          `<h2>No manifest found</h2>` +
          `<p>${esc(detail)}</p>` +
          `<p>Copy the slice-G capture output into <code>shots/</code> and generate the manifest:</p>` +
          `<pre>cp ../../apps/in-the-union-now/.tmp-shots/flow-gallery/*.png shots/\nnode gen-manifest.mjs</pre>` +
          `<p>Then reload this page.</p>` +
          `</div>`
      }

      fetch('manifest.json', { cache: 'no-store' })
        .then((r) => {
          if (!r.ok) throw new Error(`manifest.json returned ${r.status}`)
          return r.json()
        })
        .then((m) => {
          if (!m.flows || m.totalShots === 0) renderEmpty('manifest.json has no shots.')
          else render(m)
        })
        .catch((err) => renderEmpty(err.message))
    </script>
  </body>
</html>
