# Netlify configuration for in-the-union-now (character builder + snapshot backend)
#
# Netlify site base directory is the repo root (unchanged from pre-revamp).
# All paths in this file are root-relative.
#
# Snapshot endpoints are Netlify Functions (TypeScript, ESM).
# The /api/snapshots/* path family is mapped to the two handlers.
# See docs/adrs/ADR-004-snapshot-netlify-functions.md.

[build]
  command = "bun install --frozen-lockfile && bun --filter in-the-union-now build"
  publish = "apps/in-the-union-now/dist"
  functions = "apps/in-the-union-now/netlify/functions"
  # Skip the build when nothing affecting ITUN changed since the last published
  # deploy. `git diff --quiet` exits 0 (→ Netlify cancels the build) when none of
  # these paths differ, and 1 (→ build proceeds) when they do. Paths: this app
  # (SPA + snapshot Functions) + the shared packages it consumes (suref-react,
  # which itself depends on salvageunion-reference) + the root build inputs
  # (lockfile, root scripts/config). Applies to every context: production (main),
  # branch deploys, and deploy previews.
  #
  # The leading guard FORCES a build (exit 1) whenever the comparison base is
  # degenerate, so a `git diff` against the wrong/empty base can never silently
  # cancel a real deploy:
  #   - $CACHED_COMMIT_REF empty   → first deploy, nothing to compare against.
  #   - == $COMMIT_REF             → Netlify handed us HEAD as the base; diffing a
  #                                  commit against itself is always empty, which
  #                                  would wrongly cancel (this wedged suref-web's
  #                                  production after #318 — see that netlify.toml).
  #   - unreachable in the (shallow) clone → can't diff it reliably.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] || ! git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/in-the-union-now packages/suref-react packages/salvageunion-reference bun.lock package.json bunfig.toml tsconfig.json'

[build.environment]
  BUN_VERSION = "1.3.14" # keep in sync with .bun-version (checked by tools/check-bun-version.ts)
  NODE_ENV = "production"

# ---------------------------------------------------------------------------
# Snapshot API routing
# ---------------------------------------------------------------------------

# POST /api/snapshots  →  snapshot-publish function
[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshot-publish"
  status = 200
  force = true
  conditions = { Method = ["POST"] }

# PATCH/PUT/DELETE /api/snapshots  →  snapshot-publish function (returns 405)
[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshot-publish"
  status = 200
  force = true

# GET /api/snapshots/:id  →  snapshot-retrieve function
[[redirects]]
  from = "/api/snapshots/:id"
  to = "/.netlify/functions/snapshot-retrieve"
  status = 200
  force = true

# SPA fallback — serve index.html for all unmatched paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Mirrors suref-web's proven CSP. connect-src allows the same-origin snapshot
    # API ('self') plus the Netlify RUM endpoint; no 'unsafe-eval'. If a future
    # feature needs another origin, widen the relevant directive here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net;"
    X-DNS-Prefetch-Control = "on"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
