# Netlify configuration for in-the-union-now (character builder + snapshot backend)
#
# Snapshot endpoints are Netlify Functions (TypeScript, ESM).
# The /api/snapshots/* path family is mapped to the two handlers.
# See docs/adrs/ADR-010-snapshot-backend.md.

[build]
  command = "bun install --frozen-lockfile && cd ../.. && bun run build:package && bun --filter in-the-union-now build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  BUN_VERSION = "1.3.14"
  NODE_ENV = "production"

# ---------------------------------------------------------------------------
# Snapshot API routing
# ---------------------------------------------------------------------------

# POST /api/snapshots  →  snapshot-publish function
[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshot-publish"
  status = 200
  force = true
  conditions = { Method = ["POST"] }

# PATCH/PUT/DELETE /api/snapshots  →  snapshot-publish function (returns 405)
[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshot-publish"
  status = 200
  force = true

# GET /api/snapshots/:id  →  snapshot-retrieve function
[[redirects]]
  from = "/api/snapshots/:id"
  to = "/.netlify/functions/snapshot-retrieve"
  status = 200
  force = true

# SPA fallback — serve index.html for all unmatched paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
