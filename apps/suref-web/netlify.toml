# Netlify configuration for suref-web (Astro static site)

[build]
  # Provision the headless browser that scripts/og-screenshots.ts drives to
  # render each entity's 1:1 og:image card (chained into the suref-web build).
  # Use the `og:install-browser` package script — NOT `bunx playwright …` —
  # so the install resolves suref-web's pinned `playwright` and downloads the
  # exact browser build its imported `playwright-core` expects (`bunx` resolves
  # a registry copy, which installed a mismatched build). If the Netlify image
  # ever lacks chromium's shared libs, add `--with-deps` to that script.
  # PUBLIC_COMMIT_REF is exported from Netlify's own build-shell COMMIT_REF so
  # the client bundle can tag Sentry events with a release (see
  # src/lib/observability.ts and src/env.d.ts).
  command = "bun install --frozen-lockfile && bun --filter suref-web og:install-browser && PUBLIC_COMMIT_REF=\"$COMMIT_REF\" bun --filter suref-web build"
  publish = "apps/suref-web/dist"
  # Skip the build when nothing affecting suref-web changed since the last
  # published deploy. `git diff --quiet` exits 0 (→ Netlify cancels the build)
  # when none of these paths differ, and 1 (→ build proceeds) when they do.
  # Paths: this app + the shared packages it consumes (suref-react, which itself
  # depends on salvageunion-reference) + the root build inputs (lockfile, root
  # scripts/config). Applies to every context: production (main), branch
  # deploys, and deploy previews.
  #
  # The leading guard FORCES a build (exit 1) whenever the comparison base is
  # degenerate, so a `git diff` against the wrong/empty base can never silently
  # cancel a real deploy:
  #   - $CACHED_COMMIT_REF empty   → first deploy, nothing to compare against.
  #   - == $COMMIT_REF             → Netlify handed us HEAD as the base; diffing a
  #                                  commit against itself is always empty, which
  #                                  would wrongly cancel. This wedged production:
  #                                  every post-#318 main deploy cancelled with
  #                                  "no content change", freezing the site.
  #   - unreachable in the (shallow) clone → can't diff it reliably.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] || ! git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/suref-web packages/suref-react packages/salvageunion-reference bun.lock package.json bunfig.toml tsconfig.json'

[build.environment]
  BUN_VERSION = "1.3.14" # keep in sync with .bun-version (checked by tools/check-bun-version.ts)
  BUN_FLAGS = "--no-optional --ignore-scripts"
  NODE_ENV = "production"

# Skip Netlify post-processing entirely — Astro/Vite already bundles and
# minifies, and the build's artifacts (including the pre-rendered 1200x630
# og-screenshot PNGs) are final; legacy Netlify processing must not rewrite
# them. skip_processing=true supersedes the old per-type false flags, which
# contradicted this comment while leaving image compression enabled.
[build.processing]
  skip_processing = true

# Sitemap redirect (Astro generates sitemap-index.xml, not sitemap.xml)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net;"
    X-DNS-Prefetch-Control = "on"

# Astro hashed assets - immutable cache
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image caching
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG caching (favicon)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
