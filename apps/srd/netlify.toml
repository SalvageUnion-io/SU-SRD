# Netlify configuration for srd (Astro static site)

[build]
  # PUBLIC_COMMIT_REF is exported from Netlify's own build-shell COMMIT_REF so
  # the client bundle can tag Sentry events with a release (see
  # src/lib/observability.ts and src/env.d.ts).
  #
  # No headless browser is provisioned here any more. The build used to chain
  # `og:install-browser` + `scripts/og-screenshots.ts`, which drove chromium over
  # every entity (~1.5k) to render per-entity og:image cards. The PNG cache lives
  # in node_modules, so a cold Netlify builder re-rendered all of them and the
  # deploy reliably exceeded the build limit ("Command did not finish") — every
  # srd deploy was failing. Entity pages now use the site-wide default og:image.
  command = "bun install --frozen-lockfile && PUBLIC_COMMIT_REF=\"$COMMIT_REF\" bun --filter srd build"
  # Netlify resolves `publish` RELATIVE TO the site's base directory, which for
  # this site is `apps/srd` — so this must be base-relative, not root-relative.
  # It read `apps/srd/dist` and resolved to `apps/srd/apps/srd/dist`, failing
  # every deploy with "Deploy directory does not exist" (exit code 2) even
  # though the build itself succeeded. (ITUN's site differs: its base is the
  # repo root, so its netlify.toml paths are root-relative.)
  publish = "dist"
  # Skip the build when nothing affecting srd changed since the last
  # published deploy. `git diff --quiet` exits 0 (→ Netlify cancels the build)
  # when none of these paths differ, and 1 (→ build proceeds) when they do.
  # Paths: this app + the shared packages it consumes (component-lib, which itself
  # depends on salvageunion-reference) + the root build inputs (lockfile, root
  # scripts/config). Applies to every context: production (main), branch
  # deploys, and deploy previews.
  #
  # The leading guard FORCES a build (exit 1) whenever the comparison base is
  # degenerate, so a `git diff` against the wrong/empty base can never silently
  # cancel a real deploy:
  #   - $CACHED_COMMIT_REF empty   → first deploy, nothing to compare against.
  #   - == $COMMIT_REF             → Netlify handed us HEAD as the base; diffing a
  #                                  commit against itself is always empty, which
  #                                  would wrongly cancel. This wedged production:
  #                                  every post-#318 main deploy cancelled with
  #                                  "no content change", freezing the site.
  #   - unreachable in the (shallow) clone → can't diff it reliably.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] || ! git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/srd packages/component-lib packages/salvageunion-reference bun.lock package.json bunfig.toml tsconfig.json'

[build.environment]
  BUN_VERSION = "1.3.14" # keep in sync with .bun-version (checked by tools/check-bun-version.ts)
  BUN_FLAGS = "--no-optional --ignore-scripts"
  NODE_ENV = "production"

# Skip Netlify post-processing entirely — Astro/Vite already bundles and
# minifies, and the build's artifacts (including the pre-rendered 1200x630
# og-screenshot PNGs) are final; legacy Netlify processing must not rewrite
# them. skip_processing=true supersedes the old per-type false flags, which
# contradicted this comment while leaving image compression enabled.
[build.processing]
  skip_processing = true

# Sitemap redirect (Astro generates sitemap-index.xml, not sitemap.xml)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://storage.ko-fi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net;"
    X-DNS-Prefetch-Control = "on"

# Astro hashed assets - immutable cache
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image caching
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG caching (favicon)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
