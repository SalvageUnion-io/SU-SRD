# Netlify configuration for srd (static site, built by the in-house SSG — ssg/build.ts)

[build]
  # PUBLIC_COMMIT_REF is exported from Netlify's own build-shell COMMIT_REF so
  # the client bundle can tag Sentry events with a release (see
  # src/lib/observability.ts and src/env.d.ts).
  #
  # A headless browser IS provisioned here, to render each entity's og:image as
  # a 1:1 screenshot of its Catalog tile (scripts/og-screenshots.ts).
  #
  # This previously broke every srd deploy (#482): the old pass rendered the FULL
  # entity card for ~1.5k entities with the PNG cache in node_modules, so a cold
  # builder re-rendered all of them and blew the build limit ("Command did not
  # finish"). Three things make it safe to run in the deploy now:
  #   1. It renders the CATALOG tile, which is far cheaper — a full cold run is
  #      ~70s of rendering for ~850 entities (measured), not tens of minutes.
  #   2. OG_SCREENSHOTS_BUDGET_MS caps the pass. Whatever hasn't rendered when
  #      the budget expires simply keeps the site-wide default og:image.
  #   3. The script NEVER fails the build — any error (chromium missing shared
  #      libs, a wedged render) is logged and the affected pages fall back to
  #      the default. Only pages whose PNG actually landed are pointed at it.
  # So the worst case is "some previews are generic", never a failed deploy.
  #
  # Use the `og:install-browser` package script — NOT `bunx playwright …` — so
  # the install resolves srd's pinned `playwright` and downloads the exact
  # browser build its imported `playwright-core` expects (`bunx` resolves a
  # registry copy, which installed a mismatched build). If the Netlify image
  # ever lacks chromium's shared libs, add `--with-deps` to that script.
  #
  # The chain itself is unchanged by the Astro -> in-house SSG migration: the
  # `og:generate` package script is the seam, and it now runs `bun ssg/build.ts`
  # instead of `astro build` before the screenshot pass. Nothing here needs to
  # know which builder produced `dist/`.
  command = "bun install --frozen-lockfile && bun --filter srd og:install-browser && PUBLIC_COMMIT_REF=\"$COMMIT_REF\" bun --filter srd og:generate"
  # Netlify resolves `publish` RELATIVE TO the site's base directory, which for
  # this site is `apps/srd` — so this must be base-relative, not root-relative.
  # It read `apps/srd/dist` and resolved to `apps/srd/apps/srd/dist`, failing
  # every deploy with "Deploy directory does not exist" (exit code 2) even
  # though the build itself succeeded. (ITUN's site differs: its base is the
  # repo root, so its netlify.toml paths are root-relative.)
  publish = "dist"
  # Skip the build when nothing affecting srd changed since the last
  # published deploy. `git diff --quiet` exits 0 (→ Netlify cancels the build)
  # when none of these paths differ, and 1 (→ build proceeds) when they do.
  # Paths: this app + the shared packages it consumes (component-lib, which itself
  # depends on salvageunion-reference) + the root build inputs (lockfile, root
  # scripts/config). Applies to every context: production (main), branch
  # deploys, and deploy previews.
  #
  # The leading guard FORCES a build (exit 1) whenever the comparison base is
  # degenerate, so a `git diff` against the wrong/empty base can never silently
  # cancel a real deploy:
  #   - $CACHED_COMMIT_REF empty   → first deploy, nothing to compare against.
  #   - == $COMMIT_REF             → Netlify handed us HEAD as the base; diffing a
  #                                  commit against itself is always empty, which
  #                                  would wrongly cancel. This wedged production:
  #                                  every post-#318 main deploy cancelled with
  #                                  "no content change", freezing the site.
  #   - unreachable in the (shallow) clone → can't diff it reliably.
  # Pathspecs are `:/`-anchored (repo root) because this site's base directory is
  # `apps/srd`, so the ignore command runs with that as cwd — plain `apps/srd …`
  # pathspecs resolved to `apps/srd/apps/srd` and matched nothing, so `git diff
  # --quiet` exited 0 and Netlify cancelled EVERY build ("no content change").
  # That stayed hidden while no deploy had ever succeeded (an unreachable
  # CACHED_COMMIT_REF hits the force-build guard below); the moment one landed,
  # the guard started cancelling real changes.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] || ! git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- :/apps/srd :/packages/component-lib :/packages/salvageunion-reference :/bun.lock :/package.json :/bunfig.toml :/tsconfig.json'

[build.environment]
  BUN_VERSION = "1.3.14" # keep in sync with .bun-version (checked by tools/check-bun-version.ts)
  BUN_FLAGS = "--no-optional --ignore-scripts"
  NODE_ENV = "production"
  # Hard ceiling on the og:image pass (see the note on `command`). Sized well
  # above the ~70s a full cold run measures locally, but far enough below
  # Netlify's build limit that the rest of the deploy always has room.
  OG_SCREENSHOTS_BUDGET_MS = "300000"

# Skip Netlify post-processing entirely — Vite already bundles and
# minifies, and the build's artifacts (including the pre-rendered 1200x630
# og-screenshot PNGs) are final; legacy Netlify processing must not rewrite
# them. skip_processing=true supersedes the old per-type false flags, which
# contradicted this comment while leaving image compression enabled.
[build.processing]
  skip_processing = true

# Sitemap redirect (the build emits sitemap-index.xml, not sitemap.xml)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # connect-src must list Sentry's ingest origin or the browser blocks every
    # event before it leaves the page — a DSN alone is not enough, and that
    # failure mode is silent AND looks healthy (zero errors reported). Kept in
    # lockstep with SENTRY_INGEST_HOST in tools/check-observability.ts, which
    # fails CI if this drifts. Wildcarded subdomain because the host encodes the
    # Sentry org id.
    #
    # `de`, not `us`: this org is in Sentry's EU data region. A DSN issued in
    # one region under a CSP written for the other is blocked in the browser and
    # the project reports nothing — identical, from the outside, to "no errors".
    # The nightly live probe now compares this against the DSN actually shipped.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://storage.ko-fi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net https://*.ingest.de.sentry.io;"
    X-DNS-Prefetch-Control = "on"

# Hashed assets - immutable cache.
#
# `/assets/*`, not the old `/_astro/*`: the in-house SSG emits the client bundle
# through Vite's default `assetsDir`, so every content-hashed JS chunk, CSS file
# and font now lands under `dist/assets/`. Left pointing at `/_astro/*` this rule
# would match nothing and silently stop caching the entire bundle. If
# `ssg/vite.config.ts` ever sets a different `build.assetsDir`, change this with it.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image caching
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG caching (favicon)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
