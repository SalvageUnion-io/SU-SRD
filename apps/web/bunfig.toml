[test]
preload = [
  # First: `NATIVE_FETCH_GLOBALS` must be captured before happy-dom replaces them.
  "./test/env.ts",
  "./test/happydom.ts",
  "./test/testing-library.ts",
  "../../packages/salvageunion-reference/tools/testPreload.ts",
  "./test/convexClientStub.ts",
  "./test/roomsStub.ts",
  "./test/cloudflareWorkers.ts",
]

# Coverage counts this workspace's own files, not the other workspaces'
# sources its tests load (tools/run-coverage.ts gates on this total).
coveragePathIgnorePatterns = ["../**"]
