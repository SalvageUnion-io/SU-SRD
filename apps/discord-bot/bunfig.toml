[test]
# `salvageunion-reference/tools/testPreload.ts` loads every schema once for the whole
# workspace, the same way web/salvageunion-reference do.
# No DOM preload here: the bot has no DOM.
preload = [
  "../../packages/salvageunion-reference/tools/testPreload.ts",
  # The relay's `WorkerEntrypoint` (`test/cloudflareWorkers.ts`).
  "./test/cloudflareWorkers.ts",
]

# Coverage counts this workspace's own files, not the other workspaces'
# sources its tests load (tools/run-coverage.ts gates on this total).
coveragePathIgnorePatterns = ["../**"]
