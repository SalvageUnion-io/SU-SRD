[test]
preload = [
  # First: `convex/auth.ts` reads the Discord client env at import, and
  # `NATIVE_FETCH_GLOBALS` must be captured before happy-dom replaces them.
  "./test/env.ts",
  "../../test/happydom.ts",
  "../../test/testing-library.ts",
  "../../test/reference-preload.ts",
  "fake-indexeddb/auto",
]

# Coverage counts this workspace's own files, not the other workspaces'
# sources its tests load (tools/run-coverage.ts gates on this total).
coveragePathIgnorePatterns = ["../**"]
