# Netlify configuration for itun (character builder + snapshot backend)
#
# Netlify site base directory is the repo root (unchanged from pre-revamp).
# All paths in this file are root-relative.
#
# Snapshot endpoints are Netlify Functions (TypeScript, ESM).
# The /api/snapshots/* path family is mapped to the two handlers.
# See docs/adrs/ADR-004-snapshot-netlify-functions.md.

[build]
  # VITE_COMMIT_REF is exported from Netlify's own build-shell COMMIT_REF so
  # the client bundle can tag Sentry events with a release (see
  # src/lib/observability.ts and src/vite-env.d.ts). SENTRY_AUTH_TOKEN /
  # SENTRY_ORG / SENTRY_PROJECT (set as Netlify site env vars, not here) turn
  # on sourcemap upload for that same release in vite.config.ts.
  #
  # When CONVEX_DEPLOY_KEY is present the Convex backend (schema + functions in
  # apps/itun/convex) is pushed FIRST, and `--cmd` then runs the site build with
  # VITE_CONVEX_URL set to the deployment that was just pushed to. Doing it in
  # that order is what keeps the shipped client and the backend it talks to in
  # agreement: a build that compiled against a URL whose schema had not been
  # deployed yet would fail at runtime, not at build time.
  #
  # Without the key the build is byte-for-byte what it was before accounts —
  # a plain Solo build (ADR-030 §1). That is the supported state for deploy
  # previews and branch deploys, which have no Convex deployment of their own,
  # and it means adding this step cannot break them.
  #
  # It is NOT a supported state for production, and the leading guard is what
  # says so. Until it existed, `if [ -n "$CONVEX_DEPLOY_KEY" ]` made a
  # *misconfiguration* indistinguishable from an *intended Solo build*: an
  # absent key silently took the else branch, the build went green, and the site
  # shipped a current client against a backend nobody had pushed. That is not a
  # hypothetical — production ran that way from 2026-08-06 to 2026-08-10. The
  # client called `entities:upsertSoftLink`, prod had no such function, every
  # soft-link write failed, and `byAppId` was still the pre-#705 version that
  # throws on a duplicate `appId`, so mirrored pilot and mech writes died with
  # an opaque `Server Error` while every surface kept rendering them as saved.
  # Nothing was red. The site was current; only the backend was four days stale.
  #
  # So in the production context an absent key is fatal, loudly, before anything
  # is built. A deploy that cannot push the backend must not ship the client
  # that expects it. `$CONTEXT` is Netlify's own — `production`,
  # `deploy-preview` or `branch-deploy` — so previews keep the Solo fallback
  # they legitimately need.
  #
  # tools/check-convex-parity.ts asserts this guard is still here (it runs in
  # `validate:all`, so on every PR). A guard nothing checks is a guard that gets
  # deleted in a cleanup six months from now.
  # The guard runs FIRST, before `bun install`, and the whole thing is one `&&`
  # chain. Both details are load-bearing. `;` between two `if` blocks ends the
  # AND-list, so a version of this that read `bun install && if <guard>; fi; if
  # <build>; fi` would skip the guard entirely when the install failed and run
  # the build branch anyway — the "fatal before anything is built" property
  # quietly not holding in exactly the situation where the build is already
  # going wrong. Putting the guard ahead of the install makes it unconditional
  # and makes it fail in seconds rather than after a full dependency fetch.
  command = 'if [ "$CONTEXT" = "production" ] && [ -z "$CONVEX_DEPLOY_KEY" ]; then echo "FATAL: production build with no CONVEX_DEPLOY_KEY. Refusing to ship a Solo client against an un-pushed Convex backend. Set it in Site settings > Environment variables (scope: builds, context: production)." >&2; exit 1; fi && bun install --frozen-lockfile && if [ -n "$CONVEX_DEPLOY_KEY" ]; then cd apps/itun && VITE_COMMIT_REF="$COMMIT_REF" bunx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd "bun run build"; else VITE_COMMIT_REF="$COMMIT_REF" bun --filter itun build; fi'
  publish = "apps/itun/dist"
  functions = "apps/itun/netlify/functions"
  # Skip the build when nothing affecting ITUN changed since the last published
  # deploy. `git diff --quiet` exits 0 (→ Netlify cancels the build) when none of
  # these paths differ, and 1 (→ build proceeds) when they do. Paths: this app
  # (SPA + snapshot Functions) + the shared packages it consumes (component-lib,
  # which itself depends on salvageunion-reference) + the root build inputs
  # (lockfile, root scripts/config). Applies to every context: production (main),
  # branch deploys, and deploy previews.
  #
  # The leading guard FORCES a build (exit 1) whenever the comparison base is
  # degenerate, so a `git diff` against the wrong/empty base can never silently
  # cancel a real deploy:
  #   - $CACHED_COMMIT_REF empty   → first deploy, nothing to compare against.
  #   - == $COMMIT_REF             → Netlify handed us HEAD as the base; diffing a
  #                                  commit against itself is always empty, which
  #                                  would wrongly cancel (this wedged srd's
  #                                  production after #318 — see that netlify.toml).
  #   - unreachable in the (shallow) clone → can't diff it reliably.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] || ! git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/itun packages/component-lib packages/salvageunion-reference bun.lock package.json bunfig.toml tsconfig.json'

[build.environment]
  BUN_VERSION = "1.3.14" # keep in sync with .bun-version (checked by tools/check-bun-version.ts)
  NODE_ENV = "production"

# ---------------------------------------------------------------------------
# Snapshot API routing
# ---------------------------------------------------------------------------

# POST /api/snapshots  →  snapshot-publish function
[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshot-publish"
  status = 200
  force = true
  conditions = { Method = ["POST"] }

# PATCH/PUT/DELETE /api/snapshots  →  snapshot-publish function (returns 405)
[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/snapshot-publish"
  status = 200
  force = true

# DELETE /api/snapshots/:id  →  snapshot-delete function (revoke/un-publish)
# MUST precede the unconditioned retrieve redirect below — first match wins, and
# that one has no Method condition, so it would otherwise swallow DELETE → 405.
[[redirects]]
  from = "/api/snapshots/:id"
  to = "/.netlify/functions/snapshot-delete"
  status = 200
  force = true
  conditions = { Method = ["DELETE"] }

# GET /api/snapshots/:id  →  snapshot-retrieve function
[[redirects]]
  from = "/api/snapshots/:id"
  to = "/.netlify/functions/snapshot-retrieve"
  status = 200
  force = true

# A build asset that does not exist must 404 — NOT fall through to the SPA.
#
# Verified against production before this rule existed:
#
#   $ curl -D- https://intheunionnow.com/assets/index-DEADBEEF.js
#   HTTP/2 200
#   content-type: text/html; charset=UTF-8
#   cache-control: public,max-age=31536000,immutable
#
# Every hashed chunk a deploy rotates away is requested by exactly one
# population: clients still running the previous build — which, because the
# PWA swaps its precache out from under a live page (`skipWaiting` +
# `clientsClaim` + `cleanupOutdatedCaches`), is the normal state for the
# seconds after a deploy. Those clients `import()` the old URL and got back an
# HTML document with a **200**, so the import rejected on MIME type ("Expected
# a JavaScript module script"), and the `/assets/*` header block below then
# pinned that HTML into the HTTP cache as `immutable` for a **year**, under the
# chunk's URL. The share surfaces are where this showed: `/s/:id` and
# `/p/:kind/:appId` are opened cold, once, from a link, on a device whose
# service worker is whatever build it last saw.
#
# `status = 404` is the entire point of this rule; the body is irrelevant
# (index.html is reused only to avoid shipping a second document). An honest
# 404 makes the failed import surface as `vite:preloadError`, which
# `src/lib/chunkRecovery.ts` recovers from with a single reload — and that reload
# fetches a current index.html naming current hashes, so the dead URL is never
# requested again whether or not the 404 itself got cached.
#
# TWO placement rules, both load-bearing:
#   - It MUST precede the SPA fallback below. First match wins, and that rule's
#     `/*` would otherwise swallow these.
#   - It MUST NOT set `force = true`. Netlify consults the redirect table only
#     after failing to find a file on disk, so as written this matches misses
#     only. Forcing it would shadow `dist/assets/` and 404 *every* chunk in the
#     build — i.e. take the whole site down.
#
# Measured on deploy-preview-759 with both rules in place:
#   /assets/index-C9pQFcVN.js  (real)     -> 200 application/javascript
#   /assets/index-DEADBEEF.js  (missing)  -> 404
#   /  /s/AAAAAAAA  /p/pilot/abc          -> 200 text/html
#
# KNOWN RESIDUE, deliberately not fought: the 404 still carries the `immutable`
# Cache-Control from the `/assets/*` header block below, because Netlify matches
# header rules on the REQUEST path and cannot condition them on response status.
# A browser may therefore cache that 404 for a year under a chunk URL. It does
# not matter in the forward direction — hashed URLs are never reissued, so the
# entry is simply never consulted again. It would matter on a ROLLBACK, which
# republishes a prior deploy and brings its hashes back. What covers that is the
# service worker: workbox precaches with `cache: 'reload'`, which bypasses the
# HTTP cache, and the precache glob covers every emitted chunk — so a
# rolled-back build repopulates from the network and is served out of Cache
# Storage rather than the poisoned HTTP entries. If a rollback ever does strand
# a client, a hard reload is the manual out.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# ---------------------------------------------------------------------------
# Retired URLs
# ---------------------------------------------------------------------------

# /sheet/:kind/:id/share → the sheet itself.
#
# The Share Snapshot screen was removed in #793 — sharing is now a dialog over
# the live sheet — so this is where a bookmark or a pasted builder link would
# otherwise dead-end on the SPA's not-found page.
#
# MUST precede the SPA fallback below: first match wins, and that rule has no
# method or path condition, so it would swallow this and answer 200 index.html.
#
# This rule is NOT sufficient on its own, and the app carries a matching
# client-side redirect route. The service worker registers a `NavigationRoute`
# bound to a precached `index.html`, so for anyone with the app installed or
# cached a navigation is answered from Cache Storage and never reaches Netlify.
# This covers first-time loads, crawlers and non-SW clients; the route covers
# everyone else. See apps/itun/src/routes/sheet/$kind/$id_.share.tsx.
#
# 301 rather than 302: the screen is not coming back.
[[redirects]]
  from = "/sheet/:kind/:id/share"
  to = "/sheet/:kind/:id"
  status = 301
  force = true

# SPA fallback — serve index.html for all unmatched paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Mirrors srd's proven CSP. connect-src allows the same-origin snapshot
    # API ('self'), the Netlify RUM endpoint and Sentry's ingest origin; no
    # 'unsafe-eval'. If a future feature needs another origin, widen the
    # relevant directive here.
    #
    # The Sentry entry is load-bearing: without it the browser blocks every
    # event before it leaves the page, so a provisioned DSN would report zero
    # errors and look healthy. Kept in lockstep with SENTRY_INGEST_HOST in
    # tools/check-observability.ts, which fails CI if this drifts. Wildcarded
    # subdomain because the host encodes the Sentry org id.
    #
    # `de`, not `us`: this org is in Sentry's EU data region. A DSN issued in
    # one region under a CSP written for the other is blocked in the browser and
    # the project reports nothing — identical, from the outside, to "no errors".
    # The nightly live probe now compares this against the DSN actually shipped.
    #
    # The Convex entries are load-bearing for the same reason, and fail the same
    # silent way. The accounts client (ADR-030) opens a WebSocket to the
    # deployment for its reactive queries and POSTs mutations over HTTPS, and
    # `@convex-dev/auth` exchanges tokens against the deployment's `.site`
    # origin. Omit these and every one of those is blocked by the browser before
    # it leaves the page: `VITE_CONVEX_URL` is set, the client constructs
    # happily, the app reports itself Connected — and nothing ever reaches the
    # server. Sign-in just never completes, with no error surface.
    #
    # Wildcarded per deployment name, like the Sentry host above, because the
    # deployment differs by context: production is `exuberant-porpoise-183`,
    # while a branch deploy or a local `convex dev` points somewhere else. A
    # hardcoded host would work in production and silently break everywhere
    # else. Both schemes are required — `wss:` does NOT inherit from `https:`.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://storage.ko-fi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://ingesteer.services-prod.nsvcs.net https://*.ingest.de.sentry.io https://*.convex.cloud wss://*.convex.cloud https://*.convex.site;"
    X-DNS-Prefetch-Control = "on"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
