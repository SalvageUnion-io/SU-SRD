<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282019" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>In The Union Now</title>

    <!--
      Sitewide metadata defaults.

      This head previously held charset, viewport, theme-color, two icons and a
      title — and nothing else. No description, no Open Graph, no Twitter card.
      Every link to this app, anywhere, unfurled as the bare string "In The
      Union Now" with no summary and no image.

      That undercut a feature salvageunion.io actively promotes: "sheets can be
      shared into Discord as snapshot links". Confirmed with a `Discordbot/2.0`
      user agent against the live site — the root and both share-route shapes
      returned this same shell with no `og:*` at all.

      These are DEFAULTS. The app is client-rendered and a crawler runs no
      JavaScript, so anything a route sets at runtime is invisible to an
      unfurl; per-sheet values have to be injected server-side, which is the
      Worker's job. Until then every share reads as the app itself, which is
      still far better than a bare string.

      No `<link rel="canonical">` on purpose. A fixed canonical in a SPA shell
      claims every client route is the homepage, which is worse than none —
      it asks search engines to collapse the whole site into one URL. A
      per-route canonical belongs with the per-route metadata, injected by the
      Worker that knows which route was requested.
    -->
    <meta
      name="description"
      content="Build and run Salvage Union pilots, mechs and Union Crawlers. Character sheets, roster management and shareable snapshot links for the post-apocalyptic mech TTRPG."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="In The Union Now" />
    <meta property="og:title" content="In The Union Now" />
    <meta
      property="og:description"
      content="Build and run Salvage Union pilots, mechs and Union Crawlers. Character sheets, roster management and shareable snapshot links."
    />
    <meta property="og:url" content="https://intheunionnow.com/" />
    <meta property="og:image" content="https://intheunionnow.com/icon-512.png" />
    <meta property="og:image:alt" content="In The Union Now" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="In The Union Now" />
    <meta
      name="twitter:description"
      content="Build and run Salvage Union pilots, mechs and Union Crawlers. Character sheets, roster management and shareable snapshot links."
    />
    <meta name="twitter:image" content="https://intheunionnow.com/icon-512.png" />

    <!-- Barlow superfamily is self-hosted via @fontsource (imported in src/routes/__root.tsx) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
