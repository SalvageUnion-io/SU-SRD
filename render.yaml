services:
  - type: worker
    name: suref-discord-bot
    runtime: node
    region: oregon
    plan: starter
    # Command registration is intentionally NOT part of the deploy build.
    # Global slash commands are registered manually (an explicit step) only
    # when the command shape changes — see apps/discord-bot/README.md.
    buildCommand: 'bun install --ignore-scripts && bun run build:bot'
    startCommand: 'node apps/discord-bot/dist/index.js'
    # Without this, every commit to main rebuilds and redeploys the bot —
    # including srd/itun/component-lib work and release-please chores that it
    # cannot possibly depend on. Measured over the 71 commits between
    # 2026-07-14 and 2026-07-28: only 32 touched anything the bot bundles, and
    # only 4 touched the bot itself, so ~55% of builds were pure waste. Each
    # one re-downloads a 614MB build cache and bounces the worker off Discord,
    # and together they exhausted the workspace's build-pipeline minutes on
    # 2026-07-28 (13 consecutive builds cancelled, bot stuck on a stale
    # deploy).
    #
    # The bot bundles its own source plus salvageunion-reference and nothing
    # else — it deliberately does not depend on component-lib (see
    # apps/discord-bot/CLAUDE.md). `package.json` is the root one, which is
    # where the `build:bot` script this service runs is defined.
    buildFilter:
      paths:
        - apps/discord-bot/**
        - packages/salvageunion-reference/**
        - bun.lock
        - package.json
        - render.yaml
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      # Sentry error tracking — set the value in the Render dashboard.
      - key: SENTRY_DSN
        sync: false
      # In The Union Now (ADR-030 Phase 6). BOTH are needed together, and with
      # either missing the bot runs in Solo mode: rolling, checking and lookup
      # work exactly as they always have, and the Game commands answer "this
      # server isn't connected". That is a deliberate default, not a failure —
      # a deploy with no credentials degrades instead of crashing at startup.
      #
      # ITUN_CONVEX_SITE_URL is the Convex HTTP-ACTIONS origin (.convex.site),
      # not the client URL (.convex.cloud) and not the web origin. Getting it
      # wrong presents as every Game command reporting the deployment
      # unreachable, which points at the network rather than at the typo.
      #
      # ITUN_BOT_SECRET must match `bunx convex env set ITUN_BOT_SECRET` on the
      # deployment. It is a bearer credential — whoever holds it can act as any
      # Discord user who has linked an account (bounded: it cannot invent a
      # membership, reach an unlinked account, read somebody's shelf, or see
      # encounterNpcs). Set it in the dashboard, never here.
      - key: ITUN_CONVEX_SITE_URL
        sync: false
      - key: ITUN_BOT_SECRET
        sync: false
      # NOT declared here on purpose: RENDER_GIT_COMMIT (the deployed commit
      # SHA) is a Render "reserved" env var Render injects automatically into
      # every service's environment — it can't be set via envVars and needs no
      # provisioning. apps/discord-bot/src/observability.ts reads it to tag
      # Sentry events with a release. Verify the exact var name in the Render
      # dashboard's "Environment" tab for this service if release tags don't
      # show up — Render's reserved-var set has changed name before.
