services:
  - type: worker
    name: suref-discord-bot
    runtime: node
    region: oregon
    plan: starter
    buildCommand: 'bun install --ignore-scripts && bun run build:bot && bun run --filter @suref/discord-bot deploy-commands:global'
    startCommand: 'node apps/discord-bot/dist/index.js'
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      # Sentry error tracking — set the value in the Render dashboard.
      - key: SENTRY_DSN
        sync: false
