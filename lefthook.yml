# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint-fix:
      glob: '*.{ts,tsx,js,jsx}'
      run: bun run lint -- --fix
      stage_fixed: true

    format:
      # No astro in the glob: the repo has no prettier-plugin-astro, and
      # prettier hard-errors when handed an explicit file it cannot parse.
      glob: '*.{ts,tsx,js,jsx,json,md,css,yml,yaml}'
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck

    test:
      run: bun run test

    validate:
      run: bun run validate:all

    knip:
      run: bun run knip
