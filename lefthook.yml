# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    biome-check:
      # Staged files only; pre-push and CI run the full check.
      # --no-errors-on-unmatched is required: Biome exits 1 when every staged
      # file is outside files.includes.
      glob: '*.{ts,tsx,js,jsx,json,css}'
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    checks:
      # Every gate except the test suite, from the ONE registry in
      # tools/check.ts — the same list `bun run check` and CI's static-checks
      # job run, with a different profile. Do not add a gate here: add it to
      # that registry, and every path picks it up. `pre-push` = the fast profile
      # plus generated-file drift, the likeliest avoidable CI bounce. No tests:
      # beside these checks they timed out on 8-core machines, and CI's
      # `coverage` job runs every suite with its floors in about a minute.
      run: bun tools/check.ts --profile=pre-push
