# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    biome-check:
      # Staged files only — linting the whole monorepo on every commit was
      # too slow (~60s); pre-push/CI still run the full check. Biome combines
      # lint + format in one pass (`check --write`), applying only SAFE
      # fixes. biome.jsonc's `files.includes` scopes this to apps/**,
      # packages/**, tools/** and excludes .md/.yml/.yaml/data/** — staged
      # files outside that scope (e.g. root docs/*.md, or a root-level config
      # like package.json/knip.json) are silently skipped when mixed with
      # in-scope files, so this glob can stay broad.
      # --no-errors-on-unmatched is required, not cosmetic: Biome hard-errors
      # (exit 1) rather than silently skipping when EVERY staged file in the
      # glob is out of scope (verified — a commit touching only a root-level
      # config file failed pre-commit without this flag).
      glob: '*.{ts,tsx,js,jsx,json,css}'
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # There is deliberately no Markdown/YAML formatting step. Prettier was
    # removed (Biome is the single formatter) and Biome still does not parse
    # either language — verified against 2.5.7, which returns .md/.yaml stdin
    # untouched. Those files are therefore unformatted by tooling; keep them
    # tidy by hand. Add a step back here if Biome ships the formatters.

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck

    test:
      # Runs only the test files the push can actually affect, via Bun's
      # `--changed`, which walks the MODULE GRAPH rather than matching paths —
      # editing packages/component-lib/src/components/shared/displayMode.ts
      # selects 37 of component-lib's 84 test files (2.3s), and a push touching
      # only config or docs selects none at all instead of paying the full ~32s.
      #
      # The base is the merge-base with origin/main, i.e. everything this branch
      # is about to push, not just the last commit. On a long-lived branch that
      # selects MORE, which is the safe direction to be wrong in.
      #
      # This is a local fast path, NOT a narrowing of the gate: CI still runs
      # the whole suite (`bun run test`) on every PR, and that is what merge
      # protection depends on. Run `bun run test` by hand any time you want the
      # full sweep locally.
      #
      # Falls back to the full suite when there is no origin/main to diff
      # against (fresh clone, renamed trunk) — a missing base must never mean
      # "nothing to test".
      run: |
        base=$(git merge-base HEAD origin/main 2>/dev/null || true)
        if [ -z "$base" ]; then
          echo "pre-push: no origin/main to diff against — running the full suite"
          bun run test
        else
          bun --filter "*" test --changed="$base" && bun test ./tools --changed="$base"
        fi

    lint:
      # Pre-commit lints STAGED FILES ONLY, so a lint error can still reach the
      # remote two ways it never sees: a merge/rebase conflict resolution, and
      # anything committed with `--no-verify`. A full-tree lint is 0.45s — far
      # cheaper than a CI round-trip to learn the same thing.
      run: bun run lint

    schemas:
      # The likeliest avoidable CI bounce: `salvageunion-reference`'s generated
      # artifacts (registry, JSON schemas, API report) are committed, and CI
      # fails on drift. Nothing checked that locally, so the failure was only
      # ever discoverable after a push. 2.4s here, minutes there.
      run: bun run check:schemas

    validate:
      run: bun run validate:all

    knip:
      run: bun run knip

    design-tokens:
      # Guards the closed colour set / token scales (ruleset §3–§4). Belongs on
      # pre-push rather than pre-commit for the same reason as typecheck — but
      # it is load-bearing here in a way lint is not: these are Tailwind v4
      # `@theme` tokens, so an off-system or deleted token does NOT fail
      # typecheck. The utility simply stops being generated and the element
      # renders unstyled. This check is the only mechanical backstop for that.
      run: bun run check:tokens

    styling-ownership:
      # Guards the source-of-truth property: component-lib owns all shared
      # styling. Catches app-local `@theme` tokens, dead app CSS, and breaks in
      # the dashboard `pc-*` class contract (used-but-undefined / defined-but-
      # unused). Like design-tokens, none of these fail typecheck — a stray app
      # token or a className referencing an undefined class renders unstyled with
      # no compiler error. Ratchets downward from a committed baseline.
      run: bun run check:styling
