# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint-fix:
      glob: "*.{ts,tsx,js,jsx}"
      run: bun run lint -- --fix
      stage_fixed: true

    format:
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml}"
      run: bun run format
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck

    test:
      run: bun run test

    validate:
      run: bun run validate:all

    knip:
      run: bun run knip
