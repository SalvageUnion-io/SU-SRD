# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    biome-check:
      # Staged files only — linting the whole monorepo on every commit was
      # too slow (~60s); pre-push/CI still run the full check. Biome combines
      # lint + format in one pass (`check --write`), applying only SAFE
      # fixes. biome.jsonc's `files.includes` scopes this to apps/**,
      # packages/**, tools/** and excludes .md/.yml/.yaml/data/** — staged
      # files outside that scope (e.g. root docs/*.md, or a root-level config
      # like package.json/knip.json) are silently skipped when mixed with
      # in-scope files, so this glob can stay broad.
      # --no-errors-on-unmatched is required, not cosmetic: Biome hard-errors
      # (exit 1) rather than silently skipping when EVERY staged file in the
      # glob is out of scope (verified — a commit touching only a root-level
      # config file failed pre-commit without this flag).
      glob: '*.{ts,tsx,js,jsx,json,css}'
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # There is deliberately no Markdown/YAML formatting step. Prettier was
    # removed (Biome is the single formatter) and Biome still does not parse
    # either language — verified against 2.5.7, which returns .md/.yaml stdin
    # untouched. Those files are therefore unformatted by tooling; keep them
    # tidy by hand. Add a step back here if Biome ships the formatters.

pre-push:
  parallel: true
  commands:
    checks:
      # Every gate except the test suite, from the ONE registry in
      # tools/check.ts — the same list `bun run check` and CI's static-checks
      # job run, with a different profile. Do not add a gate here: add it to
      # that registry, and every path picks it up. (This file used to keep its
      # own list of eight commands, and it had quietly never run the
      # CI-aggregator gate.) `pre-push` = the fast profile plus generated-file
      # drift, the likeliest avoidable CI bounce.
      run: bun tools/check.ts --profile=pre-push

    test:
      # Runs only the test files the push can affect, via Bun's `--changed`,
      # which selects by module graph rather than by path: editing
      # packages/component-lib/src/components/shared/displayMode.ts selects 37 of
      # component-lib's 84 test files (2.3s), and a push touching only docs
      # selects none at all instead of paying the full ~32s.
      #
      # CRITICAL: `--changed` DOES NOT CROSS WORKSPACE BOUNDARIES, so it cannot
      # be used alone here. Measured: edit
      # packages/salvageunion-reference/lib/utilities.ts (since split into
      # per-concern modules) and
      # `bun --filter salvageunion-reference test --changed` correctly selects
      # 27/49 — while `bun --filter component-lib test --changed` reports "no
      # test files are affected" and runs ZERO, even though component-lib
      # consumes that module. Relying on it for a shared-package edit would skip
      # exactly the cross-app regressions this repo tells you to go looking for.
      #
      # So the shared surface is diffed FIRST and forces the full suite. The list
      # mirrors ci.yml's `shared` path filter (which treats these as affecting
      # everything) plus `apps/*/package.json`, since a dependency change in one
      # app can still move the resolved tree for all of them. Only a change
      # confined to app source takes the fast path.
      #
      # The base is the merge-base with origin/main — everything this branch is
      # about to push, not just the last commit. On a long-lived branch that
      # over-selects, which is the safe direction.
      #
      # Even so this is a local fast path, NOT a narrowing of the gate: CI runs
      # the full suite (`test:coverage` + `test:tools`) on every code PR and
      # that is what branch protection requires. Falls back to the full suite
      # when there is no origin/main to diff against — a missing base must
      # never mean "nothing to test".
      run: |
        base=$(git merge-base HEAD origin/main 2>/dev/null || true)
        if [ -z "$base" ]; then
          echo "pre-push: no origin/main to diff against — running the full suite"
          bun run test
        elif git diff --name-only "$base" -- packages test bunfig.toml package.json bun.lock 'apps/*/package.json' | grep -q .; then
          echo "pre-push: shared code or dependency manifests changed — running the full suite"
          echo "          (bun test --changed does not cross workspace boundaries)"
          bun run test
        else
          bun --filter "*" test --changed="$base" && bun test ./tools --changed="$base"
        fi
