# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint-fix:
      glob: "*.{ts,tsx,js,jsx}"
      run: bun run lint -- --fix
      stage_fixed: true
    
    format:
      glob: "*.{ts,tsx,js,jsx,json,md,yml,yaml}"
      run: bun run format
      stage_fixed: true
    
    typecheck:
      run: bun run typecheck

# Optional: Run tests on pre-push instead of pre-commit for speed
pre-push:
  parallel: true
  commands:
    test:
      run: bun run test
    
    validate:
      run: bun run validate:all
