# Dependabot configuration (issue #29).
#
# Two ecosystems: the Bun/npm workspace and the GitHub Actions used by the
# workflows in this directory. Weekly schedule, grouped to avoid PR spam.
#
# BUN CAVEAT: `package-ecosystem: bun` went GA in Feb 2025 and keeps the
# package.json ranges up to date, but Dependabot's bun support is known to be
# unreliable at regenerating a single root `bun.lock` across a workspace
# (dependabot/dependabot-core#11602, #14223). Expect the manifest ranges to be
# bumped; a maintainer may need to run `bun install` locally to refresh
# bun.lock before merging. CI's `bun install --frozen-lockfile` will surface any
# drift.
#
# GROUPING STRATEGY: this repo intentionally rides bleeding-edge majors
# (TypeScript 7, Biome 2, Vite 8, React 19). Minor/patch bumps are grouped
# (one PR for dev-deps, one for prod-deps) to keep churn manageable. MAJOR bumps
# are consolidated into a SINGLE `major-updates` PR rather than one-per-dep-per-
# directory: the same dependency (e.g. Vite) lives in several workspace
# package.json files, so ungrouped majors opened a separate PR for each — a
# flood of a dozen PRs on the first run. Majors are still held for deliberate
# review (never a "just merge it"); they just arrive as one reviewable batch.
#
# CATALOGUED DEPS ARE NOT DEPENDABOT'S ANY MORE. The 19 dependencies shared by
# two or more workspaces now live once in the root `workspaces.catalog` and are
# referenced as `catalog:`, which Dependabot cannot read — dependabot-core
# #14320 (open) means it will not update them, and #12522 (open) means it may
# strip the `catalog` field outright from a package.json it rewrites.
# `.github/workflows/catalog-update.yml` covers those deps instead; everything
# below still owns per-workspace deps and GitHub Actions.
#
# #12522 FAILS CLOSED, so watch for it rather than fearing it: deleting the
# catalog makes every `catalog:` reference unresolvable, so
# `bun install --frozen-lockfile` fails in CI and the PR cannot merge. If a
# Dependabot PR here fails with an unresolvable `catalog:` specifier, that is
# this bug — restore the `workspaces.catalog` block, do not "fix" the reference
# by inlining a version.
version: 2
updates:
  # ------------------------------------------------------------------ Bun / npm
  - package-ecosystem: 'bun'
    # Root manifest + every workspace manifest (single root lockfile). The glob
    # `directories` form lets Dependabot surface updates declared in each
    # workspace's package.json, not just the root.
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # All major bumps (any dependency, any workspace) land in ONE PR instead
      # of a separate per-directory PR each. Held for deliberate review.
      major-updates:
        patterns:
          - '*'
        update-types:
          - 'major'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'

  # ------------------------------------------------------------- GitHub Actions
  - package-ecosystem: 'github-actions'
    # `directory: '/'` only scans .github/workflows — it does NOT descend into
    # composite actions, so .github/actions/setup-bun/action.yml sat outside
    # Dependabot's scope and stalled on actions/cache@v4 while every workflow
    # moved to @v6. The `directories:` glob form covers both.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
