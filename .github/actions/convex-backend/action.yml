name: Throwaway Convex backend
description: Start a self-hosted Convex backend, push the app's functions to it and build the site against it

# The backend a CI job builds the site against when it must not touch production:
# ci.yml's `build-web` (the PR browser gate) and `perf`, e2e-nightly.yml's
# `e2e` (the signed-in suite) and gallery.yml's `shoot`. The build is
# the one `bun run build` (the reference pages, then the app into `dist/build/`), which
# needs a Convex URL for the app. The backend dies with
# the runner, holds no data and needs no credentials, so a job using it
# requests no secrets.
#
# `test-auth: 'true'` builds the variant with the test sign-in seam: it sets
# every half the seam needs to line up, `TEST_AUTH` on the deployment and
# in the Worker's `.dev.vars`, and `VITE_TEST_AUTH` in the build. Left off, the build is the signed-out
# production variant. `build-web` and the nightly `e2e` set it; neither `dist`
# ever deploys (deploy-cloudflare.yml builds its own against production).
#
# The backend writes its log to `$RUNNER_TEMP/convex-backend.log`; a job reads
# it on failure with `cat "$RUNNER_TEMP/convex-backend.log"`.
inputs:
  test-auth:
    description: "'true' to provision the test sign-in on the backend and build the app with its seam"
    required: false
    default: 'false'
outputs:
  url:
    description: The backend's client URL (VITE_CONVEX_URL, CONVEX_SELF_HOSTED_URL)
    value: http://127.0.0.1:3210
  admin-key:
    description: The admin key `bunx convex` needs to push to it (masked)
    value: ${{ steps.adminkey.outputs.key }}
runs:
  using: composite
  steps:
    # The precompiled release binary, not the `ghcr.io/get-convex/convex-backend`
    # image: since 2026-10-16 GHCR refuses anonymous pulls of that image (the
    # token endpoint answers DENIED for get-convex/* while other public images
    # pull fine), so every job that started it failed before a test ran. The
    # binary is the same `convex-local-backend` the image wraps, and the one
    # `convex dev --local` downloads, from the repo's GitHub releases.
    #
    # Pinned by release tag AND checksum, not `version.convex.dev`'s latest:
    # a mutable "latest" in CI is an unreviewed fetch, and the pinning gate
    # cannot see a `curl` to catch it. To move it, take the version from
    # https://version.convex.dev/v1/local_backend_version and the zip's sha256.
    - name: Start a self-hosted Convex backend
      shell: bash
      env:
        CONVEX_BACKEND_VERSION: precompiled-2026-10-06-a3538c6
        CONVEX_BACKEND_SHA256: eba2eeab62632e0c153e83f9f1c5ada9e98834e2db3386e32f825a3a97f8c093
      run: |
        dir="$RUNNER_TEMP/convex-backend"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/backend.zip" \
          "https://github.com/get-convex/convex-backend/releases/download/$CONVEX_BACKEND_VERSION/convex-local-backend-x86_64-unknown-linux-gnu.zip"
        echo "$CONVEX_BACKEND_SHA256  $dir/backend.zip" | sha256sum -c -
        unzip -oq "$dir/backend.zip" -d "$dir"
        chmod +x "$dir/convex-local-backend"

        # A fresh secret per run: the backend dies with the runner, so nothing
        # needs to know it beyond the admin key minted from it below. It goes
        # to a file the next step reads, not to GITHUB_ENV (zizmor: github-env).
        secret="$(openssl rand -hex 32)"
        echo "::add-mask::$secret"
        (umask 077 && printf '%s' "$secret" > "$dir/instance-secret")

        # --convex-origin / --convex-site are NOT optional. Left unset, the
        # backend accepts an empty origin ("so you can start up a self-hosted
        # backend without knowing its url yet"), and CONVEX_SITE_URL, which
        # HTTP actions and links read, is then an empty string.
        nohup "$dir/convex-local-backend" \
          --port 3210 --site-proxy-port 3211 \
          --instance-name e2e --instance-secret "$secret" \
          --convex-origin http://127.0.0.1:3210 \
          --convex-site http://127.0.0.1:3211 \
          --local-storage "$dir/storage" \
          --disable-beacon \
          "$dir/convex_local_backend.sqlite3" \
          > "$RUNNER_TEMP/convex-backend.log" 2>&1 &
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:3210/version >/dev/null 2>&1; then
            echo "backend ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Convex backend did not become ready within 60s"
        cat "$RUNNER_TEMP/convex-backend.log" || true
        exit 1

    - name: Generate an admin key
      id: adminkey
      shell: bash
      run: |
        KEY="$("$RUNNER_TEMP/convex-backend/convex-local-backend" keygen admin-key \
          --instance-name e2e --instance-secret "$(cat "$RUNNER_TEMP/convex-backend/instance-secret")" | tail -n1 | tr -d '\r')"
        if [ -z "$KEY" ]; then
          echo "::error::keygen produced no admin key"
          cat "$RUNNER_TEMP/convex-backend.log" || true
          exit 1
        fi
        echo "::add-mask::$KEY"
        printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

    # Sign-in is the Worker's (apps/web/src/worker/auth/): `wrangler dev`
    # (Playwright's CI server) signs tokens with a fresh key from `.dev.vars`,
    # and the backend accepts them through AUTH_JWKS, the key's public half.
    # Every variant sets it: `convex/auth.config.ts` reads it, and a push
    # refuses a config whose variable is unset. TEST_AUTH on both opens the
    # test seam; this backend dies with the runner.
    - name: Provision the sign-in's key
      shell: bash
      working-directory: apps/web
      env:
        CONVEX_SELF_HOSTED_URL: http://127.0.0.1:3210
        CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ steps.adminkey.outputs.key }}
        TEST_AUTH: ${{ inputs.test-auth }}
      run: |
        key="$RUNNER_TEMP/auth-key.json"
        bunx convex env set AUTH_JWKS "$(bun scripts/authKeys.ts "$key")"
        # The Worker's half: wrangler dev reads `.dev.vars`, and its Convex is this backend.
        (umask 077 && printf "CONVEX_URL=http://127.0.0.1:3210\nAUTH_SIGNING_KEY='%s'\n" "$(cat "$key")" > .dev.vars)
        if [ "$TEST_AUTH" = 'true' ]; then
          # `convex/accountLink.ts` links a test account only on the exact 'true'.
          bunx convex env set TEST_AUTH true
          echo 'TEST_AUTH=true' >> .dev.vars
        fi

    # `build` does not typecheck: ci.yml's static-checks typechecks every
    # workspace, and nothing here is a type gate.
    # `--cmd` builds with VITE_CONVEX_URL injected. Playwright's CI webServer
    # reuses an existing `apps/web/dist`, so this build is what the browser
    # actually receives.
    - name: Push functions and build the site against the backend
      shell: bash
      working-directory: apps/web
      env:
        CONVEX_SELF_HOSTED_URL: http://127.0.0.1:3210
        CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ steps.adminkey.outputs.key }}
        VITE_TEST_AUTH: ${{ inputs.test-auth }}
      run: bunx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd "bun run build"
