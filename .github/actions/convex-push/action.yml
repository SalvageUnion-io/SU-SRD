name: Push Convex
description: Push the Cantina's Convex functions once the deploy key is confirmed to name the URL the site was built against

# The backend push of deploy-cloudflare.yml (`push-convex`, production) and
# deploy-preview.yml (`ship`, the staging backend). The caller checks out and
# sets up Bun, and runs this only once the build is green.
#
# `--cmd` runs BEFORE the push, with the canonical URL for the deploy key in
# CANONICAL_CONVEX_URL, so it is used as a guard: if the key names a
# deployment other than the one the site was compiled against, the command
# fails, `convex deploy` stops before pushing, and nothing ships.
#
# The backend's SITE_URL is the caller's step: production's is a constant,
# a Preview's is the URL wrangler reports once it ships.
inputs:
  deploy-key:
    description: The Convex deploy key (CONVEX_DEPLOY_KEY)
    required: true
  expected-url:
    description: The Convex client URL the site was built against
    required: true
runs:
  using: composite
  steps:
    - name: Push Convex (after confirming the URL the site was built against)
      shell: bash
      working-directory: apps/web
      env:
        CONVEX_DEPLOY_KEY: ${{ inputs.deploy-key }}
        EXPECTED_CONVEX_URL: ${{ inputs.expected-url }}
        # Run by `convex deploy` itself, in its own shell, with
        # CANONICAL_CONVEX_URL set — so it lives here as data rather than as
        # a quoted string the step's shell would have to leave unexpanded.
        URL_GUARD: >-
          [ "$CANONICAL_CONVEX_URL" = "$EXPECTED_CONVEX_URL" ] || {
          echo "FATAL: the deploy key resolves to $CANONICAL_CONVEX_URL but the site was built
          against $EXPECTED_CONVEX_URL. Update the calling workflow's Convex URL (for
          production, CANTINA_CONVEX_URL and docs/ARCHITECTURE.md)." >&2; exit 1; }
      run: bunx convex deploy --cmd-url-env-var-name CANONICAL_CONVEX_URL --cmd "$URL_GUARD"
