name: Render srd OG images
description: Provision Chromium and render srd's per-entity OG images into apps/srd/dist

# The one OG pass, run by the `build-srd` jobs of deploy-cloudflare.yml
# (production) and deploy-preview.yml (a PR's Worker Preview) after their
# build, with `continue-on-error`. The caller has built srd into
# apps/srd/dist and uploads the result. The render never fails: a missing
# browser or a wedged page keeps the default og:image.
runs:
  using: composite
  steps:
    # The same cache as ci.yml's, so either workflow's save serves both.
    - name: Set up Playwright
      uses: ./.github/actions/playwright

    # Each cached PNG is keyed on its entity's JSON and the render key: a hash
    # of the built bytes that draw the card (the og-card page, its CSS and
    # fonts, the OgCardIsland chunk graph, never the data chunks), the script
    # and the Playwright and sharp versions. A commit that changes none of those
    # restores every card; an unknowable key falls back to the commit, which
    # restores nothing and renders all of them.
    - name: Key the OG cache
      id: og-key
      shell: bash
      working-directory: apps/srd
      env:
        DATA: ${{ hashFiles('packages/salvageunion-reference/data/**') }}
      run: |
        render=$(bun scripts/og-screenshots.ts --fingerprint) || render=""
        [[ "$render" =~ ^[0-9a-f]{64}$ ]] || render=""
        echo "render=${render:-commit-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        echo "data=$DATA" >> "$GITHUB_OUTPUT"

    - name: Cache the OG renders
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apps/srd/node_modules/.cache/srd-og
        key: srd-og-${{ steps.og-key.outputs.render }}-${{ steps.og-key.outputs.data }}
        restore-keys: srd-og-${{ steps.og-key.outputs.render }}-

    - name: Render srd OG images
      shell: bash
      working-directory: apps/srd
      env:
        OG_SCREENSHOTS: '1'
        OG_SCREENSHOTS_BUDGET_MS: '300000'
      run: bun scripts/og-screenshots.ts
