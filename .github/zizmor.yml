# zizmor configuration — read by `tools/lint-workflows.sh` (`bun run
# lint:workflows`), which runs in CI's static-checks job.
rules:
  # The same line `tools/check-action-pinning.ts` draws: GitHub's own actions
  # may ride a major tag, everything third-party is SHA-pinned. zizmor's
  # default would demand SHAs for `actions/*` too, and a rule that flags every
  # `actions/checkout@v7` in the repo gets switched off.
  unpinned-uses:
    config:
      policies:
        'actions/*': ref-pin
        'github/*': ref-pin
        '*': hash-pin

  # bunfig.toml refuses npm versions younger than 3 days, so Dependabot waits
  # the same 3 days (`cooldown.default-days` in dependabot.yml). zizmor's
  # default of 7 would make the two disagree.
  dependabot-cooldown:
    config:
      days: 3

  # Suggests the `$/` self-repository syntax for local actions. Every
  # `./.github/actions/setup-bun` reference would change, and the two repo
  # guards that parse workflows (check-action-pinning, the Dependabot
  # `directories:` glob) are written against `./`. Advisory-only upstream.
  self-repository:
    disable: true
