# zizmor configuration — read by `tools/lint-workflows.sh` (the `actionlint`
# check in tools/check.ts), which runs in CI's static-checks job.
rules:
  # GitHub's own actions may ride a major tag; everything third-party is
  # SHA-pinned. zizmor's default would demand SHAs for `actions/*` too, and a
  # rule that flags every `actions/checkout@v7` in the repo gets switched off.
  unpinned-uses:
    config:
      policies:
        'actions/*': ref-pin
        'github/*': ref-pin
        '*': hash-pin

  # Suggests the `$/` self-repository syntax for local actions. Every
  # `./.github/actions/setup-bun` reference would change, and check-workflows'
  # bun-version check is written against `./`. Advisory-only upstream.
  self-repository:
    disable: true
