name: PR gallery pages

# Publishes the PR galleries (`pr-gallery.yml`'s `pr-gallery-<n>` artifacts) to
# GitHub Pages after every PR gallery run, and keeps one comment on the PR
# linking its gallery.
#
# A `workflow_run` workflow runs MAIN's copy of this file and of
# tools/gallery-pages.ts, never the PR's, so the `pages: write` and
# `pull-requests: write` token never meets PR code. The PR's artifact is data:
# gallery-pages.ts unpacks it only for an open PR from a branch of this
# repository (never a fork's HTML on this origin) and only if its
# gallery.json names that PR.
#
# Pages serves one site, so each run rebuilds all of it from every open PR's
# newest artifact: a closed PR's gallery drops out at the next deploy.
#
# Owner setup, once: Settings → Pages → Source: GitHub Actions. The
# `github-pages` Environment's branch policy is main (tools/environments.ts),
# which a `workflow_run` deploy satisfies.
#
# zizmor's dangerous-triggers is suppressed for the reasons above: no PR code
# runs, the artifact is only unpacked and served, and a fork's never is.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [PR gallery]
    types: [completed]

permissions: {}

concurrency:
  group: pr-gallery-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the PR galleries
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Assemble every open PR's gallery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/gallery-pages.ts site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Link the gallery from the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests?.[0]?.number
            if (!pr) return core.info('No pull request on this run; nothing to link.')
            const marker = '<!-- pr-gallery -->'
            const url = `${process.env.PAGE_URL.replace(/\/$/, '')}/${pr}/`
            const body = [
              marker,
              `**PR gallery:** ${url}`,
              '',
              `Desktop and phone screenshots of this PR's srd and ITUN builds, with each page's link preview, from ${process.env.HEAD_SHA.slice(0, 7)} ([run](${process.env.RUN_URL})). Rebuilt on every push.`,
              '',
              '---',
              '_Generated by the PR gallery workflow_',
            ].join('\n')
            const { owner, repo } = context.repo
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr,
              per_page: 100,
            })
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body })
