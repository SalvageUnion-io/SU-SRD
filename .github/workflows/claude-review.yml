name: Claude review

# Claude Code reviews every pull request, on open and on each push. Its job is
# red when it finds something that should block a merge, green when it finds
# nothing, so "every check green" includes "the review is clean". AGENTS.md
# (Merging) says when a thread may merge on that alone.
#
# It is its own workflow, not a ci.yml job: it is not in `CI Success` and not
# in the `main` ruleset, so a review that is wrong never blocks a merge the
# owner wants. A fork's PR gets no secrets on `pull_request`, so it is skipped
# rather than run without its token; the owner reviews those by hand.
#
# The token is CLAUDE_CODE_OAUTH_TOKEN (`/install-github-app` or
# `claude setup-token`), the one repository-level secret
# (tools/environments.ts, REPOSITORY_SECRETS): every PR from any branch needs
# it, and it reaches no deploy. Without it the job fails and says so, rather
# than passing having reviewed nothing.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The action trades the run's OIDC token for its GitHub App token.
      id-token: write
    steps:
      - name: Refuse to run without the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN repository secret: nothing was reviewed. Run \`claude setup-token\`, then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        id: review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff (`gh pr diff`) against the repository's
            own rules: AGENTS.md, CLAUDE.md, the `.claude/rules/` files whose
            `paths:` match the changed files, and the docs they point to. Read
            those rules and every changed file in full before you judge: a
            verdict from the diff alone is not a review.

            Report only what should block a merge:
            - a correctness bug, with the input or state that triggers it;
            - a security problem;
            - a broken rule from AGENTS.md or a matching rule file (name it);
            - a change to game data (`packages/salvageunion-reference/data/`)
              that is not display or meta;
            - a skipped, disabled or weakened test, or a lowered coverage floor.
            Leave style, naming and taste alone: Biome and the gates own them.

            Do not post anything: the workflow posts your verdict. Return each
            finding with its file, line and what is wrong, `read` as the files
            you read, and `clean` true only when there are no findings.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"clean":{"type":"boolean"},"read":{"type":"array","items":{"type":"string"}},"findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"problem":{"type":"string"}},"required":["file","problem"]}}},"required":["clean","read","findings"]}'

      # The verdict is posted here, from the structured output, so a failing
      # review always says why: one comment, edited on each run, plus an
      # annotation on each finding's line.
      - name: Post the verdict
        if: always() && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$VERDICT" ]; then
            body="**Claude review: not reviewed.** The action returned no verdict (a PR that edits this workflow is skipped until it is on main)."
          elif [ "$(printf '%s' "$VERDICT" | jq -r '.clean')" = "true" ] && [ "$(printf '%s' "$VERDICT" | jq '.findings | length')" = "0" ]; then
            body=$(printf '%s' "$VERDICT" | jq -r '"**Claude review: clean.** Read \(.read | length) file(s): " + (.read | map("`" + . + "`") | join(", "))')
          else
            body=$(printf '%s' "$VERDICT" | jq -r '"**Claude review: \(.findings | length) finding(s).**\n\n" + (.findings | map("- `\(.file)\(if .line then ":\(.line)" else "" end)`: \(.problem)") | join("\n"))')
            printf '%s' "$VERDICT" | jq -r '.findings[] | "::error file=\(.file),line=\(.line // 1)::\(.problem | gsub("\n"; " "))"'
          fi
          printf '%s\n' "$body" > "$RUNNER_TEMP/verdict.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/verdict.md" --edit-last --create-if-none

      - name: Fail on findings
        env:
          VERDICT: ${{ steps.review.outputs.structured_output }}
        run: |
          clean=$(printf '%s' "$VERDICT" | jq -r '.clean // false')
          findings=$(printf '%s' "$VERDICT" | jq -r '.findings | length // "?"')
          if [ "$clean" != "true" ] || [ "$findings" != "0" ]; then
            echo "::error::Claude review: not clean ($findings finding(s)); see its comment on the PR."
            exit 1
          fi
          echo "Claude review: clean."
