name: E2E (nightly)

# Browser end-to-end suites run here on a daily schedule against `main`, NOT as
# per-PR gates. They are slow and (for the Netlify deploy-preview variant)
# flaky against cold previews, so gating every PR on them stalled merges. This
# job keeps full e2e coverage — it just runs it once a day against the merged
# main branch instead. They do not block PR merges.
#
# Failures are surfaced two ways: the Actions tab (as always), and a tracking
# GitHub Issue (notify-failure/notify-recovery below) opened/commented on
# failure and closed on the next green run — GitHub-native, no external
# notification service or webhook secret.
#
# Trigger manually any time via the "Run workflow" button (workflow_dispatch).

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e-itun:
    # ITUN Playwright suite against a self-contained static build (no deploy
    # preview on main): Playwright's webServer builds the bundle and serves it
    # with `vite preview`. The snapshot publish path soft-skips (no Functions
    # backend); that round-trip is covered by the snapshot unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/in-the-union-now
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/in-the-union-now
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-itun
          path: apps/in-the-union-now/playwright-report/
          retention-days: 7

  e2e-suref-web:
    # suref-web Playwright smoke suite: builds the Astro static bundle and
    # serves it with `astro preview` via Playwright's webServer.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        # Run from the app dir so bunx resolves suref-web's exact Playwright
        # version and installs the matching browser revision.
        working-directory: apps/suref-web
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/suref-web
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-suref-web
          path: apps/suref-web/playwright-report/
          retention-days: 7

  visual-regression:
    # Visual-regression snapshots of the suref-react Ladle stories (issue #30)
    # via Playwright's toHaveScreenshot. Requires committed per-OS baselines
    # under packages/suref-react/visual/__screenshots__ (generate with
    # `bun --filter suref-react ladle:build && test:visual:update` on a Linux
    # runner). Until baselines land this job reports "no baseline" — nightly is
    # the right home for it (informational, non-blocking).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Build Ladle
        run: bun --filter suref-react ladle:build

      - name: Run visual regression
        working-directory: packages/suref-react
        run: bunx playwright test --config playwright.visual.config.ts

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: packages/suref-react/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Notification — GitHub-native, no external service or webhook secret. On
  # any suite failure, open (or comment on) a single tracking issue labeled
  # `nightly-e2e-failure`; on the next all-green run, comment + close it. Uses
  # the default GITHUB_TOKEN (issues: write, scoped to just these two jobs) —
  # nothing to provision.
  #
  # NOTE: visual-regression currently has no committed Playwright baselines
  # (see that job's comment above), and Playwright fails a toHaveScreenshot
  # assertion the first time a baseline is missing rather than passing. Until
  # baselines are generated and committed, this job fails every night and
  # notify-failure will re-fire every night — expected noise, not a bug in the
  # notification wiring. Generate baselines to quiet it.
  # ---------------------------------------------------------------------------
  notify-failure:
    needs: [e2e-itun, e2e-suref-web, visual-regression]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-e2e-failure tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-e2e-failure'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `Nightly E2E (\`e2e-nightly.yml\`) failed on \`${context.ref}\`.`,
              '',
              `Run: ${runUrl}`,
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Nightly E2E failing',
                body,
                labels: [label],
              })
            }

  notify-recovery:
    needs: [e2e-itun, e2e-suref-web, visual-regression]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open nightly-e2e-failure tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-e2e-failure'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Nightly E2E passed again on \`${context.ref}\` — closing. Run: ${runUrl}`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              })
            }
