name: E2E (nightly)

# Browser end-to-end suites run here on a daily schedule against `main`, NOT as
# per-PR gates. They are slow, so gating every PR on them stalled merges. This
# job keeps full e2e coverage — it just runs it once a day against the merged
# main branch instead. They do not block PR merges.
#
# Failures are surfaced two ways: the Actions tab (as always), and a tracking
# GitHub Issue (the `notify` job below) opened/commented on
# failure and closed on the next green run — GitHub-native, no external
# notification service or webhook secret.
#
# `production-smoke` re-runs deploy-cloudflare.yml's post-deploy smoke list
# (tools/smoke-production.sh) against the live hostnames, so drift between
# deploys opens the same tracking issue. `audit` runs `bun run audit` against
# the unchanged tree, so a newly published advisory does too.
#
# Trigger manually any time via the "Run workflow" button (workflow_dispatch).

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

# Per ref, so a branch dispatch cannot cancel the scheduled run on `main`.
concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # The whole Playwright suite but the performance budget (ci.yml's `perf`
    # measures it on a quiet runner), the Cantina's specs SIGNED IN, against a
    # THROWAWAY self-hosted Convex backend and a production bundle built
    # against it. The PR tier (ci.yml's `build-web`) runs the specs that need
    # no account; here they run again beside the ones that do.
    #
    # Why signed in: signed out, the Cantina is read-only (#1113, #1117), so a spec
    # that builds something and reads it back is by definition a test of the
    # signed-in path. `apps/web/e2e/fixtures.ts` signs each such spec up with a
    # fresh account through the `TestAuthBridge` seam; the specs about what a
    # signed-out visitor sees opt out with `account: 'anonymous'`.
    #
    # Why a throwaway backend: enabling `TEST_AUTH` on production would put
    # a password auth provider on the live app. A container destroyed with the
    # runner cannot do that and needs no credentials, which is why this job
    # requests no secrets at all.
    #
    # `a11y-signed-in.e2e.ts` runs here too: the axe scan of the pages only an
    # account reaches (Shelves, the wizards, the sheets, the Game, and Play's
    # landing, player and Mediator screens), which the PR tier's signed-out
    # scan cannot. Play's flows and layout gates (`play-*.e2e.ts` and
    # `sibling-heights.e2e.ts`'s Play lines) run here again: the PR tier
    # (ci.yml's `build-web`) builds with the seam too and runs them on every
    # PR, so they gate merges (#1632).
    #
    # One job, one backend, one build: the sign-in hand-off spec
    # (`signin-save.e2e.ts`) and the specs that depend on its seam cannot
    # disagree about how the build was made.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Start a throwaway Convex backend and build the site against it
        uses: ./.github/actions/convex-backend
        with:
          test-auth: 'true'

      - name: Set up Playwright
        uses: ./.github/actions/playwright

      # E2E_EXPECT_AUTH_SEAM is what keeps this honest. Without it a spec
      # that needs an account SKIPS when the seam is missing (the right call in
      # an ordinary build); with it, a missing seam THROWS — so a regression in
      # the seam or a lost build variable fails the run instead of turning the
      # whole suite green-because-it-did-nothing.
      - name: Run E2E tests
        working-directory: apps/web
        env:
          E2E_EXPECT_AUTH_SEAM: '1'
        run: bunx playwright test --grep-invert perf-budget

      - name: Backend logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/convex-backend.log" || true

      # Ephemeral runners discard this anyway; a self-hosted one would fail the
      # next run with the backend's ports already in use.
      - name: Stop the backend
        if: always()
        run: pkill -f convex-local-backend || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: apps/web/playwright-report/
          retention-days: 7

  production-smoke:
    # The post-deploy smoke list from deploy-cloudflare.yml, re-run daily. A
    # deploy only proves production answered at the moment it shipped; a DNS
    # record, a Redirect Rule or a rotated bot token can break it between
    # deploys with nothing in the repo changing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke every production surface
        run: bash tools/smoke-production.sh

  audit:
    # The `audit` check runs only on a PR that moves bun.lock or a manifest, so
    # an advisory published against a tree nobody touched surfaces here. The
    # same root script, so the same suppressions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit the dependency tree
        run: bun run audit

  environments:
    # The live half of `secrets-env` (tools/check-workflows.ts): the GitHub
    # Environments and the `main` ruleset as configured match
    # tools/environments.ts — the settings half, which no gate can see
    # because a gate can only read YAML.
    #
    # GITHUB_TOKEN can read Environments and branch policies but cannot list
    # secrets, so this job is also the SENTINEL for that half: it maps the
    # Environment secrets while declaring NO environment, and a job outside an
    # Environment can only read a repository- or organisation-level copy. Any
    # non-empty value is drift; the tool never prints one. `secrets-env`
    # exempts this job alone and fails if it ever gains an `environment:`.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The Environment and deployment-branch-policy endpoints read as Actions.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Compare live Environments and the main ruleset against tools/environments.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: bun tools/environments.ts --secrets-from-env

  # ONE notifier: on any result that is not `success` it opens (or comments
  # on) a single tracking issue labeled `nightly-e2e-failure`; on the next
  # all-green run it comments and closes it, with the default GITHUB_TOKEN.
  # The verdict is derived from `toJSON(needs)`, so a job added to `needs:`
  # is reported and judged with no second list to update.
  #
  # Verdict per job: anything but `success` is broken. `cancelled` is how a
  # timed-out job reports, so it counts as broken. `skipped` is broken too: no
  # judged job has an `if:`, so only a broken upstream can skip one.
  # `!cancelled()` still exempts a genuine cancellation of the whole run, which
  # is a human action rather than a regression.
  #
  # Only `main` reports: the tracking issue is about `main`, and a branch
  # dispatch (blocked by the production environment's main-only policy, so red
  # with zero steps) would otherwise open a false alarm or close a real one.
  notify:
    needs: [e2e, production-smoke, audit, environments]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two REST calls. A wedged notifier is the worst one to leave unbounded —
    # it is the thing that tells you the rest broke.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly-e2e-failure tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const label = 'nightly-e2e-failure'
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`

            const needs = JSON.parse(process.env.NEEDS)
            const results = Object.entries(needs).map(([job, { result }]) => [job, result])
            const broken = results.filter(([, result]) => result !== 'success')

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
            })

            if (broken.length === 0) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Nightly E2E passed again on \`${context.ref}\` — closing. Run: ${runUrl}`,
                })
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
              }
              return
            }

            // Every job gets a line. An issue that names no cause is the failure
            // this list exists to prevent.
            const body = [
              `Nightly E2E (\`e2e-nightly.yml\`) did not pass on \`${context.ref}\`.`,
              '',
              ...results.map(
                ([job, result]) =>
                  `- \`${job}\`: **${result}**${result === 'cancelled' ? ' (hit `timeout-minutes` — likely a hang, not an assertion failure)' : ''}`
              ),
              '',
              `Run: ${runUrl}`,
            ].join('\n')

            if (open.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Nightly E2E failing', body, labels: [label] })
            }
