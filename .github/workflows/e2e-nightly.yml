name: E2E (nightly)

# Browser end-to-end suites run here on a daily schedule against `main`, NOT as
# per-PR gates. They are slow, so gating every PR on them stalled merges. This
# job keeps full e2e coverage — it just runs it once a day against the merged
# main branch instead. They do not block PR merges.
#
# Failures are surfaced two ways: the Actions tab (as always), and a tracking
# GitHub Issue (the `notify` job below) opened/commented on
# failure and closed on the next green run — GitHub-native, no external
# notification service or webhook secret.
#
# The `a11y-srd` job also lives here (rather than in ci.yml) because this
# workflow already builds and serves hermetic static bundles for Playwright, so
# the scan gets its server for free. It is ADVISORY — see the job's own notes.
#
# `production-smoke` re-runs deploy-cloudflare.yml's post-deploy smoke list
# (tools/smoke-production.sh) against the live hostnames, so drift between
# deploys opens the same tracking issue.
#
# Trigger manually any time via the "Run workflow" button (workflow_dispatch).

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e-itun:
    # ITUN Playwright suite against a self-contained static build (no deploy
    # preview on main): Playwright's webServer builds the bundle and serves it
    # with `vite preview`. The snapshot publish path soft-skips (no Functions
    # backend); that round-trip is covered by the snapshot unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/itun
        run: bunx playwright install chromium

      - name: Run E2E tests
        working-directory: apps/itun
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-itun
          path: apps/itun/playwright-report/
          retention-days: 7

  e2e-itun-signin:
    # The anonymous-build → sign-in → save hand-off, against a THROWAWAY
    # self-hosted Convex backend.
    #
    # Why this job exists at all: `apps/itun/e2e/signin-save.e2e.ts` had never
    # executed anywhere. It needs a reachable deployment with the test-only
    # password provider enabled; no workflow set any of its three variables, so
    # its `test.skip` fired in every environment including this one — a spec
    # that was written, correct, and permanently silent.
    #
    # Why not an existing deployment: enabling `ITUN_TEST_AUTH` on production
    # would put a password auth provider on the live app, and the dev
    # deployment is shared — this spec mints a fresh account per run and would
    # fill it with junk. A container destroyed with the runner has neither
    # problem and needs no credentials, which is why this job requests no
    # secrets at all.
    #
    # Kept OUT of `e2e-itun` deliberately. That job is the working coverage; if
    # the backend spin-up below needs iteration it must not take the rest of
    # the suite down with it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # `docker run`, not a `services:` block: the admin key has to be produced
      # by exec-ing into the container after it starts, and `services:` gives no
      # predictable name to exec into.
      - name: Start a self-hosted Convex backend
        run: |
          # CONVEX_CLOUD_ORIGIN / CONVEX_SITE_ORIGIN are NOT optional here.
          # `run_backend.sh` passes `--convex-origin "$CONVEX_CLOUD_ORIGIN"
          # --convex-site "$CONVEX_SITE_ORIGIN"` unconditionally, so leaving
          # them unset supplies EMPTY STRING arguments rather than omitting the
          # flags — and the backend deliberately accepts an empty origin ("so
          # you can start up a self-hosted backend without knowing its url
          # yet"), which means the built-in defaults never fire. Upstream's
          # defaults live in their docker-compose.yml, which a bare `docker run`
          # skips.
          #
          # Downstream that lands exactly where this job is meant to be immune:
          # `convex/auth.config.ts` is `domain: process.env.CONVEX_SITE_URL`,
          # and @convex-dev/auth signs tokens with `setIssuer(requireEnv(...))`,
          # whose guard rejects only `undefined` — so an empty string is signed
          # in as the issuer and sign-in fails for a reason nothing names.
          #
          # Pinned by digest, not `:latest`. This stack's whole argument is that
          # a mutable tag in CI is an unreviewed fetch; shipping one in the job
          # that makes the argument would be a poor look, and the pinning gate
          # cannot see `docker run` to catch it.
          docker run -d --name convex-e2e \
            -p 3210:3210 -p 3211:3211 \
            -e INSTANCE_NAME=e2e \
            -e CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 \
            -e CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            -e DISABLE_BEACON=true \
            ghcr.io/get-convex/convex-backend@sha256:1f2044e3eac463ac78973b136c0baf72d4ada602611d853d6f99f280e29e0a98
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/version >/dev/null 2>&1; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Convex backend did not become ready within 60s"
          docker logs convex-e2e || true
          exit 1

      - name: Generate an admin key
        id: adminkey
        run: |
          KEY="$(docker exec convex-e2e ./generate_admin_key.sh | tail -n1 | tr -d '\r')"
          if [ -z "$KEY" ]; then
            echo "::error::generate_admin_key.sh produced no key"
            docker logs convex-e2e || true
            exit 1
          fi
          echo "::add-mask::$KEY"
          printf 'key=%s\n' "$KEY" >> "$GITHUB_OUTPUT"

      # Auth needs a JWT keypair ON the deployment. Without it the JWKS endpoint
      # 500s and sign-in fails with nothing pointing at the cause — this repo
      # has already lost a week to exactly that, so it is provisioned explicitly
      # rather than assumed.
      - name: Provision auth keys and deployment env
        working-directory: apps/itun
        env:
          CONVEX_SELF_HOSTED_URL: http://127.0.0.1:3210
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ steps.adminkey.outputs.key }}
        run: |
          # The keypair is generated inline rather than by `bunx @convex-dev/auth`.
          # That CLI has no `--variant` flag (verified against the pinned 0.0.94:
          # its options are --variables/--skip-git-check/--web-server-url/--prod/
          # --preview-name/--deployment-name), and it is interactive, so in a
          # runner it would either error or block. This is deterministic, needs
          # no network, and is the same pair the CLI would have set.
          bun -e '
            const { generateKeyPairSync } = await import("node:crypto")
            const { privateKey, publicKey } = generateKeyPairSync("rsa", { modulusLength: 2048 })
            const jwk = publicKey.export({ format: "jwk" })
            await Bun.write("jwt.key", privateKey.export({ type: "pkcs8", format: "pem" }))
            await Bun.write("jwks.json", JSON.stringify({ keys: [{ ...jwk, use: "sig", alg: "RS256" }] }))
          '
          # `--from-file` rather than an inline value: JWT_PRIVATE_KEY is a
          # multi-line PEM, and it is the documented form for exactly this.
          bunx convex env set JWT_PRIVATE_KEY --from-file jwt.key
          bunx convex env set JWKS --from-file jwks.json
          rm -f jwt.key jwks.json
          # `convex/auth.ts` gates the password provider on the exact string
          # 'true'; anything else leaves the provider absent and the seam gone.
          bunx convex env set ITUN_TEST_AUTH true
          # SITE_URL is the FRONTEND origin, not the Convex site URL. Nothing
          # prompts for it, and omitting it fails as an opaque 500.
          bunx convex env set SITE_URL http://localhost:5173

      # `--cmd` builds with VITE_CONVEX_URL injected — the same shape
      # deploy-cloudflare.yml uses. Playwright's CI webServer reuses an existing
      # `apps/itun/dist`, so this build is what the browser actually receives.
      - name: Push functions and build itun against the backend
        working-directory: apps/itun
        env:
          CONVEX_SELF_HOSTED_URL: http://127.0.0.1:3210
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ steps.adminkey.outputs.key }}
          VITE_TEST_AUTH: 'true'
        run: bunx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd "bun run build"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/itun
        run: bunx playwright install chromium

      # ITUN_E2E_EXPECT_AUTH_SEAM is the point of the whole job. With it set the
      # spec THROWS when the seam is absent instead of skipping, so this can
      # never rejoin the pile of green-because-it-did-nothing runs it came from.
      - name: Run the sign-in/save spec
        working-directory: apps/itun
        env:
          ITUN_E2E_EXPECT_AUTH_SEAM: '1'
        run: bunx playwright test signin-save.e2e.ts

      - name: Backend logs on failure
        if: failure()
        run: docker logs convex-e2e || true

      # Ephemeral runners discard this anyway; a self-hosted one would fail the
      # next run with "name already in use".
      - name: Remove the backend container
        if: always()
        run: docker rm -f convex-e2e || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-itun-signin
          path: apps/itun/playwright-report/
          retention-days: 7

  e2e-srd:
    # srd Playwright smoke suite: builds the static bundle with the in-house
    # SSG and serves it with `ssg/preview.ts` via Playwright's webServer.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        # Run from the app dir so bunx resolves srd's exact Playwright
        # version and installs the matching browser revision.
        working-directory: apps/srd
        run: bunx playwright install chromium

      - name: Run E2E tests
        working-directory: apps/srd
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-srd
          path: apps/srd/playwright-report/
          retention-days: 7

  a11y-srd:
    # WCAG 2.1 AA scan (axe-core via Playwright, `tools/a11y-scan.ts`) over a
    # representative slice of the srd static build. `docs/architecture/
    # seo-accessibility.md` asserts AA compliance; until this job existed that
    # claim was verified by nothing on a schedule.
    #
    # BLOCKING. It was advisory — `continue-on-error: true`, and absent from the
    # notify `needs:` — so a violation could neither redden a run nor open the
    # tracking issue. That is how the 2026-08 audit's findings survived: a
    # 1.42:1 focus ring, no skip link on any page, one heading per page, and 96
    # roll tables that rendered nothing without JavaScript. Every one of them
    # was reachable by this scan and none of them ever turned anything red.
    #
    # Fixing them without closing that gap only resets the clock, so steps 1-4
    # of the promotion path this comment used to describe are now done:
    #
    #   1. `tools/a11y-baseline.json` records the accepted ids per page, with
    #      the reason for each in its `$rationale` block. Exactly one id is
    #      tolerated — `color-contrast` — and the entry says why: the entity
    #      card's footer puts 12px light text on a book-derived entity TONE, and
    #      even full-opacity paper fails on 6 of the 10 tones. Making it pass is
    #      a palette decision, not a code fix.
    #   2. `--baseline <file>` diffs a run against it. A rule id NOT in the
    #      baseline is a regression and exits 1. So is a STALE entry — an id
    #      that no longer fires, or a page no longer scanned — because a
    #      baseline nobody prunes decays into a blanket exemption.
    #   3. `continue-on-error` is gone.
    #   4. `a11y-srd` is in the notify `needs:` below.
    #
    # A crashed scan reports `violations: -1` and the differ treats that as a
    # regression, never as "no violations found".
    #
    # STILL NOT a PR gate: it needs a full srd build plus a browser, and it has
    # not yet run long enough here to know its flake rate. Moving it into
    # ci.yml behind the `web` path filter is the remaining step.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The scanner drives Chromium with Playwright, which resolves its own
      # browser — the same one the e2e jobs install and cache, so this pulls
      # nothing extra. (A "Resolve the Chromium binary" step used to sit here,
      # exporting CHROME_PATH for puppeteer-core, which ships no browser of its
      # own. The scanner is on Playwright now, so it finds Chromium itself.)
      - name: Install Playwright browsers (Chromium)
        working-directory: apps/srd
        run: bunx playwright install chromium

      # Same static-preview approach as e2e-srd's Playwright webServer: the SSG
      # build (`ssg/build.ts` directly, not the `og:generate` script, which
      # chains the slow OG-screenshot pass) served by `ssg/preview.ts` on 4321.
      - name: Build srd static bundle
        working-directory: apps/srd
        run: bun ssg/build.ts

      - name: Serve the build and run the a11y scan
        run: |
          set -euo pipefail
          (cd apps/srd && bun ssg/preview.ts --port 4321) &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:4321/; then break; fi
            sleep 2
          done
          curl -sfo /dev/null http://localhost:4321/
          # The pages scanned are the baseline's own keys — one list, shared
          # with the PR-blocking scan in ci.yml's build-srd job.
          bun tools/a11y-scan.ts \
            --baseline tools/a11y-baseline.json \
            http://localhost:4321 \
            > a11y-report.json

      - name: Summarise violations
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s a11y-report.json ]; then
            {
              echo "### Accessibility scan — srd"
              echo ""
              echo "The scanner produced no report; see the step log above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Accessibility scan — srd"
            echo ""
            echo "| Page | Violations | Passes | Incomplete |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.[] | "| `\(.page)` | \(.violations) | \(.passes) | \(.incomplete) |"' a11y-report.json
            echo ""
            echo "Total violations: **$(jq '[.[].violations | select(. > 0)] | add // 0' a11y-report.json)**"
            echo "(a \`-1\` in the table means that page failed to scan, not that it is clean.)"
            echo ""
            echo "Rule ids per page — full node-level detail is in the \`a11y-report-srd\` artifact:"
            echo ""
            echo '```json'
            jq -c '[.[] | {page, rules: [.details[].id]}]' a11y-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report-srd
          path: a11y-report.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Notification — GitHub-native, no external service or webhook secret. On
  # any suite result that is not `success` — failed assertions OR a job that ran
  # out its `timeout-minutes` (which reports as `cancelled`) — open (or comment
  # on) a single tracking issue labeled `nightly-e2e-failure`; on the next
  # all-green run, comment + close it. Uses
  # the default GITHUB_TOKEN (issues: write, scoped to just these two jobs) —
  # nothing to provision. `a11y-srd` IS in `needs:` — it was advisory and is now
  # blocking, so an accessibility regression opens and holds the tracking issue
  # like any other suite. It gates on new violations only; accepted debt lives
  # in `tools/a11y-baseline.json`.
  # ---------------------------------------------------------------------------
  observability-probe:
    # The one observability check CI structurally CANNOT do on a PR: whether the
    # Sentry DSN actually reached the production builds. The repo can only
    # prove the wiring (tools/check-observability.ts, run by `bun run check` on
    # every PR); whether the deploy env carries the DSN is invisible until you
    # look at what production actually serves. This fetches both sites and
    # asserts the SDK is really in the bytes being sent to users.
    #
    # This is the check whose absence let a fully-built, unit-tested, release-
    # tagged Sentry stack sit dark in production with zero events ever captured:
    # with no DSN the guard folds to false at build time and the SDK is
    # tree-shaken out, so the app looks identical to a working one.
    #
    # Gated on the `OBSERVABILITY_PROBE` repo variable so it stays inert until
    # the DSN is provisioned. An alarm that rings every night for a thing that
    # does not exist yet is exactly the broken window this nightly suite already
    # suffered from — the failure mode is that you stop reading it. Flip it on
    # (repo → Settings → Secrets and variables → Actions → Variables →
    # OBSERVABILITY_PROBE = on) the moment the DSN lands, and a production that
    # goes dark again opens the tracking issue like any other nightly failure.
    if: vars.OBSERVABILITY_PROBE == 'on'
    runs-on: ubuntu-latest
    # Must EXCEED the probe's own PROBE_BUDGET_MS (120s in
    # tools/check-observability.ts), so the tool always loses the race and
    # reports a real reason. It was 5 minutes, and the arithmetic never worked:
    # the probe crawls ~134 chunks and its retry ladder costs up to 7s each, so
    # a bad-weather run could spend ~938s — 3x the job timeout. Every nightly
    # from 2026-08-05 died at exactly 5m having printed NOTHING, which read as
    # "cancelled" in the run list and told nobody anything. The probe itself was
    # healthy the whole time (3-21s locally, DSN present on both sites).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Probe production for the Sentry SDK
        run: bun run check:observability:live

  convex-parity:
    # The other thing CI structurally cannot do on a PR: know what is actually
    # deployed. ITUN ships from two mechanisms — wrangler publishes the client,
    # `convex deploy` pushes the backend — and only the deploy job ties them to the
    # same commit. When they came apart, nothing was red: the site served the
    # current commit and the backend was four days stale, so the published
    # bundle called `entities:upsertSoftLink` against a deployment that had no
    # such function. Every soft-link write failed, mirrored pilot and mech
    # writes died on the pre-#705 `byAppId`, and the UI rendered all of it as
    # saved. The only trace was a Convex log stream nobody tails.
    #
    # The static half of this check (the deploy-cloudflare.yml guard that makes
    # an absent CONVEX_DEPLOY_KEY fatal in production) runs on every PR via
    # `check-workflows.ts` (convex-guard). This is the half that needs the deployment.
    #
    # Gated on the CONVEX_PARITY_PROBE repo variable for the same reason
    # observability-probe is: an alarm that rings nightly for a credential that
    # has not been provisioned is a broken window, and the failure mode is that
    # you stop reading it. Provision `CONVEX_DEPLOY_KEY` (repo → Settings →
    # Secrets and variables → Actions → Secrets — a Convex *production* deploy
    # key from the Convex dashboard), then set CONVEX_PARITY_PROBE = on.
    if: vars.CONVEX_PARITY_PROBE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Compare the deployed function set against this commit
        env:
          # With the key present the Convex CLI resolves its own target, so no
          # deployment name is passed and none can be wrong.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bun run check:convex-parity:live

  production-smoke:
    # The post-deploy smoke list from deploy-cloudflare.yml, re-run daily. A
    # deploy only proves production answered at the moment it shipped; a DNS
    # record, a Redirect Rule or a rotated bot token can break it between
    # deploys with nothing in the repo changing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Smoke every production surface
        run: bash tools/smoke-production.sh

  # ONE notifier, computed from `needs` rather than restated in two inverted
  # `if:` expressions. The two-job version drifted twice: convex-parity and
  # e2e-itun-signin were each added to `needs:` and to one condition but not
  # the other, so a red run could fail to open the issue — or CLOSE it.
  # Deriving the verdict from `toJSON(needs)` means a job added to `needs:`
  # is reported and judged with no second list to update.
  #
  # Verdict per job: `failure` or `cancelled` is broken. `cancelled` is how a
  # job that hit `timeout-minutes` reports, and treating it as anything else is
  # how this suite once broke silently for days. `skipped` is fine for the
  # variable-gated probes (their switch is off) but NOT for a job in
  # ALWAYS_RUNS, which has no `if:` and so can only be skipped by a broken
  # upstream. `!cancelled()` still exempts a genuine cancellation of the whole
  # run, which is a human action rather than a regression.
  notify:
    needs: [e2e-itun, e2e-itun-signin, e2e-srd, observability-probe, convex-parity, a11y-srd, production-smoke]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # Two REST calls. A wedged notifier is the worst one to leave unbounded —
    # it is the thing that tells you the rest broke.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly-e2e-failure tracking issue
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const ALWAYS_RUNS = new Set(['e2e-itun', 'e2e-srd', 'e2e-itun-signin', 'production-smoke'])
            const label = 'nightly-e2e-failure'
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`

            const needs = JSON.parse(process.env.NEEDS)
            const results = Object.entries(needs).map(([job, { result }]) => [job, result])
            const broken = results.filter(
              ([job, result]) =>
                result === 'failure' ||
                result === 'cancelled' ||
                (ALWAYS_RUNS.has(job) && result !== 'success')
            )

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
            })

            if (broken.length === 0) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Nightly E2E passed again on \`${context.ref}\` — closing. Run: ${runUrl}`,
                })
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
              }
              return
            }

            // Every job that ran gets a line — a skipped probe is omitted, so the
            // report never lists a job that did not run. An issue that names no
            // cause is the failure this list exists to prevent.
            const body = [
              `Nightly E2E (\`e2e-nightly.yml\`) did not pass on \`${context.ref}\`.`,
              '',
              ...results
                .filter(([job, result]) => result !== 'skipped' || ALWAYS_RUNS.has(job))
                .map(
                  ([job, result]) =>
                    `- \`${job}\`: **${result}**${result === 'cancelled' ? ' (hit `timeout-minutes` — likely a hang, not an assertion failure)' : ''}`
                ),
              '',
              `Run: ${runUrl}`,
            ].join('\n')

            if (open.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Nightly E2E failing', body, labels: [label] })
            }
