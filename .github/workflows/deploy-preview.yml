name: Deploy preview (Cloudflare)

# A Cloudflare Worker Preview per pull request into `main` or a `su-io-*`
# release branch, once it carries the `preview` label: one su-srd Preview, as
# production is one su-srd Worker.
#
#   site     https://pr-<n>-su-srd.alxjrvs.workers.dev
#   App      https://pr-<n>-su-srd.alxjrvs.workers.dev/build, its rooms its
#            own and its shared database the Previews' (su-shared-preview)
#
# Adding the label builds and ships the PR; each later push to it ships again;
# closing it deletes the Preview. The run's summary and one PR comment carry
# the URLs. docs/ARCHITECTURE.md#previews has the trade-offs.
#
# IT CANNOT MOVE PRODUCTION. `wrangler preview` makes a Preview, which is
# neither a version nor a deployment of the production Worker: its traffic,
# vars and secrets are its own (each wrangler.jsonc's `previews` block), and
# plain `wrangler secret put` on the production Worker keeps working.
#
# THE GATE IS THE LABEL. Only a labelled PR from this repository ships (a
# fork's run gets no secrets and is skipped), so the `preview` Environment
# admits every branch and has no required reviewer: adding the label is the
# approval (owner's call, 2026-10-13). The accepted risk is that a labelled
# branch's code, the workflow file included, holds the Cloudflare token, which
# can deploy any Worker on the account (ADR-033 §Credentials). Only `ship` and
# `teardown` name the Environment, and `ship` only after every build is green.
#
# ONE SHARED DATABASE. Every Preview reads and writes su-shared-preview, and
# each run applies its PR's migrations there: two labelled PRs with different
# migrations collide. Each Preview's rooms are its own.
#
# THE BUILD HOLDS NO SECRET. It is deploy-cloudflare.yml's build
# (.github/actions/build-site). A
# Preview's browser posts its errors to its own Preview Worker, and its Workers
# log them for Workers Issues like production's, under the Preview's version.

on:
  pull_request:
    branches: [main, 'su-io-*']
    types: [labeled, synchronize, reopened, closed]

# One run per PR at a time. Never cancelled mid-upload; GitHub keeps one
# pending run per PR, so the newest push replaces any queued one.
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  # The Preview's address, known before it exists: `<name>-<worker>.<account
  # subdomain>`. The build takes it as the site's origin, so every absolute
  # address a Preview prints names this PR's Preview, never production:
  # canonicals, og: tags, the Discord Component Embed, the sitemap. Links
  # between the two apps are relative, so they need none. A Preview answers
  # noindex, so search never sees it. `ship` fails if wrangler reports any
  # other address.
  PREVIEW_ORIGIN: https://pr-${{ github.event.pull_request.number }}-su-srd.alxjrvs.workers.dev

jobs:
  # The site's one build, as production builds it, for the Preview's origin.
  build-web:
    # A labelled PR from this repository, on the push or the label that asks
    # for it; a fork's run gets no secrets, and another label is no request.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog page is `main`'s history (ADR-041); a shallow clone
          # would render one commit of it.
          fetch-depth: 0

      # The OG render inside it is best-effort, as in production: a failed
      # render keeps the default og:image.
      - name: Build the site, render its OG images and upload it
        uses: ./.github/actions/build-site
        with:
          commit-ref: ${{ github.event.pull_request.head.sha }}
          site-origin: ${{ env.PREVIEW_ORIGIN }}
          retention-days: '1'

  # Ship su-srd, with the app in its `dist/build/`, as a Preview, only after
  # the build is green.
  ship:
    needs: [build-web]
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      url: ${{ steps.preview.outputs.url }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Refuse to ship without a Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: no CLOUDFLARE_API_TOKEN in the preview Environment." >&2
            exit 1
          fi

      - name: Download the site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist

      # The Previews' own shared database before the Preview that reads it
      # (tools/d1-migrate.ts); production's is never touched from here.
      - name: Migrate the Previews' shared database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun tools/d1-migrate.ts su-shared-preview

      # A Preview, never a version or a deployment of the production Worker.
      # Its vars are wrangler.jsonc's `previews` block. Its URL is read back
      # from wrangler's output file, never guessed: `--json` still prints the
      # asset upload's progress on stdout around the JSON.
      - name: Ship su-srd as a Preview
        id: preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/preview.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$out" bunx wrangler preview \
            --name "$PREVIEW_NAME" \
            --message "$PREVIEW_NAME@${SHA:0:12}"
          url=$(jq -rs '[.[] | select(.type == "preview")] | last | .preview_urls[0]
            | if type == "object" then .url else . end // empty' "$out")
          if [ -z "$url" ]; then
            echo "FATAL: the Preview has no URL." >&2
            exit 1
          fi
          # The build baked in the address this Preview was predicted at.
          if [ "${url%/}" != "$PREVIEW_ORIGIN" ]; then
            echo "FATAL: the Preview is at ${url%/}, but its links were built for $PREVIEW_ORIGIN." >&2
            echo "Fix PREVIEW_ORIGIN in this workflow." >&2
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          {
            echo "### \`$PREVIEW_NAME\` now serves \`$SHA\`"
            echo
            echo "- site: $PREVIEW_URL"
            echo "- the app: $PREVIEW_URL/build"
          } >> "$GITHUB_STEP_SUMMARY"

  # One comment per PR carrying the URLs, edited in place on every ship. Its own
  # job: the only one that can write to the PR, and it holds no deploy secret.
  comment:
    needs: ship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the Preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.ship.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- deploy-preview -->'
          body=$(printf '%s\n**Preview** of %s\n\n- site: %s\n- the app: %s/build (the Previews' shared database)\n' \
            "$marker" "${SHA:0:12}" "$PREVIEW_URL" "$PREVIEW_URL")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # A closed PR's Preview goes if it ever had the label.
  teardown:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The config names an assets directory, absent without a build. A
      # Preview that never shipped (a failed first run) is no failure here.
      - name: Delete the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p apps/web/dist
          (cd apps/web && bunx wrangler preview delete --name "$PREVIEW_NAME" -y) ||
            echo "::warning::no $PREVIEW_NAME Preview to delete"
