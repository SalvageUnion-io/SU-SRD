name: Deploy preview (Cloudflare)

# A Cloudflare Worker Preview per pull request into `main`, once it carries the
# `preview` label:
#
#   srd   https://pr-<n>-su-srd.alxjrvs.workers.dev
#   itun  https://pr-<n>-su-itun.alxjrvs.workers.dev/build, against the
#         staging Convex deployment perfect-donkey-72
#
# Adding the label builds and ships the PR; each later push to it ships again;
# closing it deletes both Previews. The run's summary and one PR comment carry
# the URLs. docs/ARCHITECTURE.md#previews has the trade-offs.
#
# IT CANNOT MOVE PRODUCTION. `wrangler preview` makes a Preview, which is
# neither a version nor a deployment of the production Worker: its traffic,
# vars and secrets are its own (each wrangler.jsonc's `previews` block), and
# plain `wrangler secret put` on the production Worker keeps working. The
# Convex push takes a deploy key that the `ship` job refuses unless it is the
# dev key for perfect-donkey-72, so a production key stored here by mistake
# fails the run before anything is pushed.
#
# THE GATE IS THE LABEL. Only a labelled PR from this repository ships (a
# fork's run gets no secrets and is skipped), so the `preview` Environment
# admits every branch and has no required reviewer: adding the label is the
# approval (owner's call, 2026-10-13). The accepted risk is that a labelled
# branch's code, the workflow file included, holds the Cloudflare token, which
# can deploy any Worker on the account (ADR-033 §Credentials). Only `ship` and
# `teardown` name the Environment, and `ship` only after every build is green.
#
# ONE STAGING BACKEND. Every Preview's itun talks to perfect-donkey-72, and each
# run pushes its PR's Convex functions and schema there and points its
# SITE_URL (the sign-in callback) at its own Preview: the last PR shipped wins
# both, so two labelled PRs with different schemas, or a sign-in on an older
# one, collide.
#
# THE BUILDS HOLD NO SECRET. They are deploy-cloudflare.yml's builds minus
# Sentry: the browser bundles carry no DSN (a preview's errors would otherwise
# land in the production projects as `environment: production`) and upload no
# source maps. The Workers report as SENTRY_ENVIRONMENT=preview when the
# Preview base config holds a SENTRY_DSN; without one their SDK is off.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened, closed]

# One run per PR at a time. Never cancelled mid-upload; GitHub keeps one
# pending run per PR, so the newest push replaces any queued one.
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  # The staging backend: the project's cloud dev deployment. Public, like
  # production's (docs/ARCHITECTURE.md#previews).
  STAGING_CONVEX_DEPLOYMENT: perfect-donkey-72
  STAGING_CONVEX_URL: https://perfect-donkey-72.convex.cloud
  # Each Preview's address, known before it exists: `<name>-<worker>.<account
  # subdomain>`. Both builds take both, so a Preview's links into the other app
  # and its link previews (og:url, og:image, the Discord Component Embed) name
  # this PR's Previews, never production. `ship` fails if wrangler reports any
  # other address. Canonical tags stay production's.
  PREVIEW_SRD_ORIGIN: https://pr-${{ github.event.pull_request.number }}-su-srd.alxjrvs.workers.dev
  PREVIEW_ITUN_ORIGIN: https://pr-${{ github.event.pull_request.number }}-su-itun.alxjrvs.workers.dev

jobs:
  build-srd:
    # A labelled PR from this repository, on the push or the label that asks
    # for it; a fork's run gets no secrets, and another label is no request.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog page is `main`'s history (ADR-041); a shallow clone
          # would render one commit of it.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build srd
        env:
          VITE_COMMIT_REF: ${{ github.event.pull_request.head.sha }}
          VITE_SRD_ORIGIN: ${{ env.PREVIEW_SRD_ORIGIN }}
          VITE_ITUN_ORIGIN: ${{ env.PREVIEW_ITUN_ORIGIN }}
        run: bun --filter srd build

      - name: Upload the srd build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srd-build
          path: apps/srd/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  og-srd:
    needs: build-srd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download the srd build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srd-build
          path: apps/srd/dist

      - name: Render srd OG images
        uses: ./.github/actions/srd-og

      - name: Upload the srd artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srd-dist
          path: apps/srd/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-itun:
    # A labelled PR from this repository, on the push or the label that asks
    # for it; a fork's run gets no secrets, and another label is no request.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Against the staging URL as a constant, as production builds against
      # ITUN_CONVEX_URL: `ship` checks the deploy key resolves to it before it
      # pushes anything.
      - name: Build itun
        working-directory: apps/itun
        env:
          VITE_CONVEX_URL: ${{ env.STAGING_CONVEX_URL }}
          VITE_COMMIT_REF: ${{ github.event.pull_request.head.sha }}
          VITE_SRD_ORIGIN: ${{ env.PREVIEW_SRD_ORIGIN }}
          VITE_ITUN_ORIGIN: ${{ env.PREVIEW_ITUN_ORIGIN }}
        run: bun run build

      - name: Upload the itun artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itun-dist
          path: apps/itun/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Push the staging backend, then ship both Workers as Previews, only after
  # both builds are green.
  ship:
    needs: [og-srd, build-itun]
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      srd: ${{ steps.preview.outputs.srd }}
      itun: ${{ steps.preview.outputs.itun }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # A dev deploy key reads `dev:<deployment>|<token>`. Matched by prefix,
      # never printed. A production or preview key, or one for another
      # deployment, stops the run here.
      - name: Refuse any key but perfect-donkey-72's dev key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            "dev:$STAGING_CONVEX_DEPLOYMENT|"?*) ;;
            "")
              echo "FATAL: no CONVEX_PREVIEW_DEPLOY_KEY in the preview Environment." >&2
              exit 1 ;;
            *)
              echo "FATAL: CONVEX_PREVIEW_DEPLOY_KEY is not the dev deploy key for $STAGING_CONVEX_DEPLOYMENT." >&2
              echo "Refusing to push: it could name production." >&2
              exit 1 ;;
          esac
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: no CLOUDFLARE_API_TOKEN in the preview Environment." >&2
            exit 1
          fi

      # Previews are public. With ITUN_TEST_AUTH on, anyone could sign up a
      # password account against it (convex/auth.ts); production never has it.
      - name: Refuse a staging backend with the test sign-in on
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          if [ "$(bunx convex env get ITUN_TEST_AUTH | tr -d '[:space:]')" = "true" ]; then
            echo "FATAL: ITUN_TEST_AUTH=true on $STAGING_CONVEX_DEPLOYMENT, which the preview serves publicly." >&2
            echo "Unset it: bunx convex env remove ITUN_TEST_AUTH --deployment $STAGING_CONVEX_DEPLOYMENT" >&2
            exit 1
          fi

      - name: Push Convex (after confirming the URL itun was built against)
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          URL_GUARD: >-
            [ "$CANONICAL_CONVEX_URL" = "$STAGING_CONVEX_URL" ] || {
            echo "FATAL: the deploy key resolves to $CANONICAL_CONVEX_URL but itun was built
            against $STAGING_CONVEX_URL." >&2; exit 1; }
        run: bunx convex deploy --cmd-url-env-var-name CANONICAL_CONVEX_URL --cmd "$URL_GUARD"

      - name: Download the srd artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srd-dist
          path: apps/srd/dist

      - name: Download the itun artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: itun-dist
          path: apps/itun/dist

      # A Preview, never a version or a deployment of the production Worker.
      # Its vars are each wrangler.jsonc's `previews` block plus these. Its URL
      # is read back from wrangler's output file, never guessed: `--json`
      # still prints the asset upload's progress on stdout around the JSON.
      - name: Ship both Workers as Previews
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for app in srd itun; do
            out="$RUNNER_TEMP/$app.ndjson"
            (cd "apps/$app" && WRANGLER_OUTPUT_FILE_PATH="$out" bunx wrangler preview \
              --name "$PREVIEW_NAME" \
              --message "$PREVIEW_NAME@${SHA:0:12}" \
              --var "SENTRY_RELEASE:$SHA" \
              --var "SENTRY_ENVIRONMENT:preview")
            url=$(jq -rs '[.[] | select(.type == "preview")] | last | .preview_urls[0]
              | if type == "object" then .url else . end // empty' "$out")
            if [ -z "$url" ]; then
              echo "FATAL: the $app Preview has no URL." >&2
              exit 1
            fi
            # The builds baked in the address this Preview was predicted at.
            if [ "$app" = srd ]; then expected="$PREVIEW_SRD_ORIGIN"; else expected="$PREVIEW_ITUN_ORIGIN"; fi
            if [ "${url%/}" != "$expected" ]; then
              echo "FATAL: the $app Preview is at ${url%/}, but its links were built for $expected." >&2
              echo "Fix PREVIEW_SRD_ORIGIN / PREVIEW_ITUN_ORIGIN in this workflow." >&2
              exit 1
            fi
            echo "$app=${url%/}" >> "$GITHUB_OUTPUT"
          done

      # Every run: the OAuth callback redirects to SITE_URL, which must be the
      # Preview's address, base included. Not a secret.
      - name: Point the staging backend's SITE_URL at this Preview
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          ITUN_URL: ${{ steps.preview.outputs.itun }}
        run: bunx convex env set SITE_URL "$ITUN_URL/build"

      - name: Summary
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          SRD_URL: ${{ steps.preview.outputs.srd }}
          ITUN_URL: ${{ steps.preview.outputs.itun }}
        run: |
          {
            echo "### \`$PREVIEW_NAME\` now serves \`$SHA\`"
            echo
            echo "- srd: $SRD_URL"
            echo "- itun: $ITUN_URL/build (Convex \`$STAGING_CONVEX_DEPLOYMENT\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # One comment per PR carrying the URLs, edited in place on every ship. Its own
  # job: the only one that can write to the PR, and it holds no deploy secret.
  comment:
    needs: ship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the Preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SRD_URL: ${{ needs.ship.outputs.srd }}
          ITUN_URL: ${{ needs.ship.outputs.itun }}
        run: |
          set -euo pipefail
          marker='<!-- deploy-preview -->'
          body=$(printf '%s\n**Preview** of %s\n\n- srd: %s\n- itun: %s/build (staging Convex, shared by every Preview)\n' \
            "$marker" "${SHA:0:12}" "$SRD_URL" "$ITUN_URL")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # A closed PR's Previews go, both Workers, if it ever had the label.
  teardown:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Each config names an assets directory, absent without a build. A
      # Preview that never shipped (a failed first run) is no failure here.
      - name: Delete both Previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          for app in srd itun; do
            mkdir -p "apps/$app/dist"
            (cd "apps/$app" && bunx wrangler preview delete --name "$PREVIEW_NAME" -y) ||
              echo "::warning::no $PREVIEW_NAME Preview of $app to delete"
          done
