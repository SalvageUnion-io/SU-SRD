name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build package
        run: bun run build:package

      - name: Verify generated schemas are up to date
        run: |
          if ! git diff --quiet -- packages/salvageunion-reference/schemas; then
            echo "::error::Generated JSON schemas are out of date. Run 'bun run build:package' locally and commit the result."
            git --no-pager diff --stat -- packages/salvageunion-reference/schemas
            git --no-pager diff -- packages/salvageunion-reference/schemas
            exit 1
          fi

      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/
          retention-days: 1

  knip:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Test
        run: bun run test

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  build-suref-web:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build suref-web
        run: bun --filter suref-web build

  build-itun:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build in-the-union-now
        run: bun --filter in-the-union-now build

  build-discord-bot:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build discord-bot
        run: bun --filter @suref/discord-bot build
