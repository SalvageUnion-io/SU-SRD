name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build package
        run: bun run build:package

      - name: Verify generated schemas are up to date
        # build:package regenerates packages/salvageunion-reference/schemas/*.schema.json
        # from the Zod sources. If the committed artifacts drift from the
        # generator output, fail here so stale schemas never ship (as a stale
        # crawler-bays.schema.json once did on main).
        run: |
          if ! git diff --exit-code -- packages/salvageunion-reference/schemas; then
            echo "::error::Committed JSON schemas are stale. Run 'bun run build:package' and commit packages/salvageunion-reference/schemas/." >&2
            exit 1
          fi

      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/
          retention-days: 1

  knip:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Test
        run: bun run test

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  audit:
    # Dependency vulnerability scan against the resolved lockfile. Fails on
    # high/critical advisories so a vulnerable dependency blocks merge; lower
    # severities are reported by `bun audit` locally but do not gate CI.
    #
    # Most high/critical advisories were remediated by forcing patched
    # transitive versions in the root package.json `overrides` block. The six
    # GHSA IDs ignored below are the irreducible remainder: minimatch,
    # picomatch, and fast-uri appear at MULTIPLE incompatible majors across the
    # dev/build toolchain (eslint, vite/astro, *-plugin-pwa), so no single
    # global override can patch them without breaking a consumer. They are all
    # dev/build-time (not shipped runtime) ReDoS / host-confusion issues.
    # Re-audit and prune this list whenever deps are bumped:
    #   - minimatch: GHSA-23c5-xmqv-rm74, GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj
    #   - picomatch: GHSA-c2c7-rcm5-vvqj
    #   - fast-uri:  GHSA-q3j6-qgpj-74h6, GHSA-v39h-62p7-jpjc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit dependencies
        run: |
          bun audit --audit-level=high \
            --ignore GHSA-23c5-xmqv-rm74 \
            --ignore GHSA-3ppc-4f35-3m26 \
            --ignore GHSA-7r86-cg39-jmmj \
            --ignore GHSA-c2c7-rcm5-vvqj \
            --ignore GHSA-q3j6-qgpj-74h6 \
            --ignore GHSA-v39h-62p7-jpjc

  build-suref-web:
    needs: [lint, typecheck, test, validate, knip, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build suref-web
        run: bun --filter suref-web build

  build-itun:
    needs: [lint, typecheck, test, validate, knip, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build in-the-union-now
        run: bun --filter in-the-union-now build

  build-discord-bot:
    needs: [lint, typecheck, test, validate, knip, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build discord-bot
        run: bun --filter @suref/discord-bot build

  e2e-itun:
    # End-to-end Playwright suite against ITUN — runs the full e2e/ suite
    # against a production-built preview server (vite build + vite preview)
    # in a real Chromium session. The data-hydration race that previously
    # plagued the flow specs is fixed by a root-level `GameDataReady`
    # Suspense barrier that preloads salvageunion-reference and sets a
    # `body[data-game-data-ready]` marker the test helper waits on.
    #
    # Fail-fast: gate this 30-min job behind the cheap checks (lint, typecheck,
    # test, validate, knip, audit) and the package build so a PR that already
    # broke one of those never burns an e2e runner. build-package is included
    # both for the dist artifact and so the schema-freshness check gates e2e too.
    needs: [build-package, lint, typecheck, test, validate, knip, audit]
    runs-on: ubuntu-latest
    # Serial Playwright suite (workers:1) over ~32 specs against a freshly-built
    # preview server runs ~12 min on a GHA runner; the prior 20 min cap killed
    # the run mid-suite. 30 min leaves headroom for the build + occasional retry.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/in-the-union-now
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/in-the-union-now
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/in-the-union-now/playwright-report/
          retention-days: 7
