name: CI

# The reasoning behind every non-obvious choice in this file is in
# docs/ARCHITECTURE.md#ci-and-deploy (the incidents behind them are in git history). Read it
# before changing a trigger, a path filter, a `needs:` edge or the aggregate
# gate. Comments here say WHAT a step guards; the doc says WHY.

on:
  # No `branches:` filter: it matches the PR's BASE, so it would give stacked
  # PRs no checks at all — and `CI Success` is required (ARCHITECTURE.md#ci-triggers).
  # CI runs on PRs only: the ruleset requires `CI Success` on a branch that is
  # up to date with `main`, so a merged tree has already passed.
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: read

# A new push supersedes the in-flight run of the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# EVERY job declares `timeout-minutes`; GitHub's default is six hours.
jobs:
  # ---------------------------------------------------------------------------
  # Which areas a change touches. `shared` affects everything; `docs` is prose
  # and agent config only. See ARCHITECTURE.md#ci-path-filters before adding a path.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      itun: ${{ steps.filter.outputs.itun }}
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      assets: ${{ steps.filter.outputs.assets }}
      ladle: ${{ steps.filter.outputs.ladle }}
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              # a `workspace:*` dependency of all four apps; asserted from the
              # manifests by tools/check-workflows.ts (path-filters)
              - 'packages/observability/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - 'biome.jsonc'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
              # every workspace's test preloads and linker config
              - 'test/**'
              - 'bunfig.toml'
              # root prose rendered by srd + itun and asserted on by
              # component-lib tests — the #731 incident (ARCHITECTURE.md#ci-path-filters)
              - 'ABOUT_JRVS.md'
              - 'LLM_STATEMENT.md'
              - 'SPECIAL_THANKS.md'
            itun:
              - *shared
              - 'apps/itun/**'
              - 'packages/component-lib/**'
              # the build job's axe spec and the debt it accepts
              - 'tools/lib/a11y*.ts'
              - 'tools/a11y-baseline-itun.json'
            web:
              - *shared
              - 'apps/srd/**'
              - 'packages/component-lib/**'
              - 'tools/lib/a11y*.ts'
              - 'tools/a11y-baseline.json'
            bot:
              - *shared
              - 'apps/discord-bot/**'
              # the bot's wire types are imported (`import type`) from here —
              # apps/discord-bot/src/itun/types.ts
              - 'apps/itun/convex/model/botWire.ts'
            ladle:
              - *shared
              - 'packages/component-lib/**'
              # App-owned components whose stories the catalog serves
              # (packages/component-lib/.ladle/config.mjs).
              - 'apps/itun/src/components/**'
              - 'apps/srd/src/components/**'
            assets:
              - *shared
              - 'apps/su-assets/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              # the hook scripts are exercised by tools/__tests__/claude-hooks.test.ts
              - '.claude/hooks/**'
              # the agent workflow scripts, by tools/__tests__/claude-workflows.test.ts
              - '.claude/workflows/**'
              # zizmor.yml and dependabot.yml, read only by the actionlint check
              - '.github/*.yml'
            # Prose and agent config. Runs the repo-invariant checks (doc
            # drift, observability) but not the test suite or the typecheck —
            # nothing compiles or tests these files (audit CI-11).
            docs:
              - 'docs/**'
              - 'CLAUDE.md'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - '.claude/**'
              - '.mcp.json'
            # What the dependency audit reads: a PR that moves neither cannot
            # change its verdict.
            deps:
              - 'bun.lock'
              - '**/package.json'

  static-checks:
    # Every run reports; each check gates itself by area.
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Every gate except the test suite and the srd build (their own jobs
      # below), from the ONE registry in tools/check.ts — the same list
      # `bun run check` and pre-push run. Add a gate THERE, never as a step
      # here. The areas decide which checks a diff needs: always-on checks
      # (Biome, styling) run on every PR; repo invariants (doc drift, data, …)
      # on code OR docs; typecheck, knip, generated-file drift, workflows and
      # actionlint/zizmor on code; the audit on deps. Every check runs even
      # after one fails, and the log ends in a pass/fail table.
      - name: Run checks
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          DEPS: ${{ needs.changes.outputs.deps }}
        run: |
          areas=""
          if [ "$CODE" = "true" ]; then areas="code"; fi
          if [ "$DOCS" = "true" ]; then areas="${areas:+$areas,}docs"; fi
          if [ "$DEPS" = "true" ]; then areas="${areas:+$areas,}deps"; fi
          bun tools/check.ts --profile=ci --areas="$areas"

  # THE test gate: every workspace (tools/ included) instrumented and held to
  # its line-coverage floor, concurrently (tools/run-coverage.ts). There is no
  # second, uninstrumented run.
  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Tests with coverage floors
        run: bun run test:coverage

  # The build jobs need only `changes`: they take no artifact from the check
  # jobs, and `CI Success` already fails on any of them (audit CI-02).
  build-srd:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build srd
        run: bun --filter srd build

      - name: Check printed examples against the built site
        run: bun --filter srd check:examples

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/srd
        run: bunx playwright install chromium

      # The PR-blocking browser tier, and srd's whole Playwright suite: there
      # is no nightly srd run. Add a spec to this line; do NOT add a job.
      # `a11y.e2e.ts` is WCAG 2.2 AA on the pages in tools/a11y-baseline.json,
      # at desktop and as a phone: it blocks on any violation the baseline does
      # not accept, and on a baseline entry that no longer fires.
      - name: Run smoke + bundle-budget + JSON API + a11y specs
        working-directory: apps/srd
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts json-api.e2e.ts a11y.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-web
          path: apps/srd/playwright-report/
          retention-days: 7

  build-itun:
    needs: [changes]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The variant production ships: compiled against a Convex URL, so the
      # specs and the scan below see the signed-out read-only UI players get.
      # The URL is a throwaway backend carrying this PR's own functions, not
      # production: a PR's client must run against the backend it ships with,
      # and a PR gate makes no production calls.
      - name: Start a throwaway Convex backend
        id: convex
        uses: ./.github/actions/convex-backend

      - name: Push functions and build itun against the backend
        working-directory: apps/itun
        env:
          CONVEX_SELF_HOSTED_URL: ${{ steps.convex.outputs.url }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ steps.convex.outputs.admin-key }}
        run: bunx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd "bun run build"

      # The build emits the assets; this bundles the Worker `main` that ships.
      - name: Bundle the Worker that actually deploys
        run: bun --filter itun worker:bundle --outdir /tmp/itun-worker

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/itun
        run: bunx playwright install chromium

      # The PR-blocking browser tier. Add a spec to this line; do NOT add a job.
      # `a11y.e2e.ts` is srd's scan, for ITUN: the routes in
      # tools/a11y-baseline-itun.json, signed out, at desktop and as a phone.
      - name: Run smoke + bundle-budget + a11y specs
        working-directory: apps/itun
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts a11y.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-itun
          path: apps/itun/playwright-report/
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: docker logs convex-e2e || true

  build-discord-bot:
    needs: [changes]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The bot has no build script; wrangler bundles `src/http/worker.ts`.
      - name: Bundle the Worker that actually deploys
        run: bun --filter discord-bot worker:bundle --outdir /tmp/bot-worker

  # The Ladle stories are component-lib's visual catalogue and the review
  # surface for the component-refresh loop. Nothing built them on a PR, so a
  # story that no longer compiled merged green and broke `bun run ladle`.
  build-ladle:
    needs: [changes]
    if: needs.changes.outputs.ladle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the Ladle stories
        run: bun --filter component-lib ladle:build

  build-su-assets:
    needs: [changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Bundle the Worker
        run: bun --filter su-assets worker:bundle --outdir /tmp/su-assets-worker

  # ---------------------------------------------------------------------------
  # The single required check. Fails if any job failed or was cancelled; a
  # path-filtered skip passes. EVERY job above must be in `needs:` —
  # tools/check-workflows.ts (aggregator) enforces it. CodeQL and the PR title
  # are required separately (ARCHITECTURE.md#ci-aggregate-gate).
  # ---------------------------------------------------------------------------
  quality-checks:
    name: CI Success
    if: always()
    needs:
      - changes
      - static-checks
      - coverage
      - build-srd
      - build-itun
      - build-discord-bot
      - build-su-assets
      - build-ladle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $RESULTS)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
