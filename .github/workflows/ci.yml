name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — decide which areas a change touches so we can skip heavy jobs
  # for unrelated PRs. The dependency graph is baked into each filter:
  #   salvageunion-reference + root config → affect EVERYTHING
  #   suref-react                          → affects suref-web + in-the-union-now
  # so an `itun`/`web` change is "itun/web OR suref-react OR reference OR root".
  # `code` = any source/config change (false only for docs-only PRs).
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      itun: ${{ steps.filter.outputs.itun }}
      itun_deploy: ${{ steps.filter.outputs.itun_deploy }}
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - '.bun-version'
              - 'eslint.config.*'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
            itun:
              - *shared
              - 'apps/in-the-union-now/**'
              - 'packages/suref-react/**'
            # Mirrors apps/in-the-union-now/netlify.toml's `ignore` paths — the
            # exact set that triggers an ITUN deploy preview. Deliberately does
            # NOT include `*shared` (.github, eslint, tsconfig*, etc.): a change
            # to those makes CI consider ITUN affected but does NOT cause Netlify
            # to build a preview. The preview-e2e gates on this so it only runs
            # when there is actually a preview to test (otherwise it waits for a
            # deploy that never comes and times out).
            itun_deploy:
              - 'apps/in-the-union-now/**'
              - 'packages/suref-react/**'
              - 'packages/salvageunion-reference/**'
              - 'bun.lock'
              - 'package.json'
              - 'bunfig.toml'
              - 'tsconfig.json'
            web:
              - *shared
              - 'apps/suref-web/**'
              - 'packages/suref-react/**'
            bot:
              - *shared
              - 'apps/discord-bot/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'

  lint:
    # Always runs — format:check covers docs (markdown/yaml) too.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The package ships TypeScript source (no dist; audit item 16) — this
      # job only guards the one remaining generated artifact: the committed
      # JSON schemas. If they drift from the Zod generator output, fail so
      # stale schemas never ship (as a stale crawler-bays.schema.json once
      # did on main).
      - name: Regenerate JSON schemas
        run: bun run build:package

      - name: Verify generated schemas are up to date
        run: |
          if ! git diff --exit-code -- packages/salvageunion-reference/schemas; then
            echo "::error::Committed JSON schemas are stale. Run 'bun run build:package' and commit packages/salvageunion-reference/schemas/." >&2
            exit 1
          fi

  knip:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test
        run: bun run test

  coverage:
    # Test coverage report (issue #28). Runs each workspace's `test:coverage`
    # (bun test --coverage) and surfaces the per-file summary in the job log and
    # the GitHub step summary.
    #
    # NON-BLOCKING BY DESIGN, but still listed in the quality-checks gate:
    #   - Bun 1.3 exposes no `--coverage-threshold` CLI flag (only the bunfig
    #     `[test] coverageThreshold` key), so we do NOT hard-gate on a percentage
    #     here — real test failures are already caught by the blocking `test`
    #     job, and picking a numeric floor blind would either be meaningless
    #     (too low) or flaky (too high).
    #   - The coverage run is wrapped in a `continue-on-error` step so a coverage
    #     *instrumentation* hiccup can never false-fail the merge gate.
    #
    # TO TURN THIS INTO A NON-REGRESSION GATE: add
    #     [test]
    #     coverageThreshold = <today's number>
    # to each workspace bunfig.toml (set to the CURRENT numbers reported below so
    # it cannot regress), then drop the `continue-on-error` on the run step.
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test with coverage
        id: cov
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:coverage 2>&1 | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Test coverage'
            echo ''
            echo '```'
            # Strip any ANSI escapes (none expected without a TTY, but be safe).
            sed -E 's/\x1b\[[0-9;]*m//g' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  audit:
    # Dependency vulnerability scan against the resolved lockfile. Fails on
    # high/critical advisories so a vulnerable dependency blocks merge; lower
    # severities are reported by `bun audit` locally but do not gate CI.
    #
    # The lockfile resolves every high/critical advisory to a patched version
    # on its own — NO package.json `overrides` are required. The one ignored
    # advisory is esbuild GHSA-gv7w-rqvm-qjhr: vite (^0.27) and astro (^0.27.3)
    # both pin esbuild below the patched 0.28.1, so it is unreachable without
    # forcing an out-of-range version or a major vite/astro bump. It is a Deno
    # install-time RCE (NPM_CONFIG_REGISTRY) that does not apply to our bun/npm
    # CI or shipped runtime. Drop this --ignore once vite/astro ship esbuild
    # >=0.28.1.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore GHSA-gv7w-rqvm-qjhr

  build-suref-web:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build suref-web
        # Skip the headless-chromium og:image pass here — this job only verifies
        # the build compiles. The real og:images are generated in the Netlify
        # deploy (which provisions chromium); see scripts/og-screenshots.ts.
        run: bun --filter suref-web build
        env:
          OG_SCREENSHOTS_SKIP: '1'

  build-itun:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build in-the-union-now
        run: bun --filter in-the-union-now build

  build-discord-bot:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build discord-bot
        run: bun --filter @suref/discord-bot build

  e2e-itun-preview:
    # On PRs, run the FULL Playwright suite against the live Netlify Deploy
    # Preview (https://deploy-preview-<PR#>--in-the-union-now.netlify.app),
    # which serves the real Netlify Functions + Blobs — so the snapshot
    # publish→retrieve round-trip is exercised end to end (no soft-skip).
    # No app build needed here: the specs hit the deployed URL directly.
    # Gated on `itun_deploy` (Netlify's actual preview-trigger paths), NOT the
    # broader `itun` — so this only runs when an ITUN preview is expected. That
    # path filter compares against the PR base, while Netlify's `ignore` compares
    # against the last preview, so the two can still disagree (e.g. a rebase that
    # absorbs only non-ITUN commits): Netlify cancels the incremental preview but
    # reports a *success* status. The wait step below detects that and skips the
    # suite rather than testing a stale/missing preview URL.
    needs: [changes, lint, typecheck, test]
    if: github.event_name == 'pull_request' && needs.changes.outputs.itun_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Wait for Netlify deploy preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CONTEXT="netlify/in-the-union-now/deploy-preview"
          echo "Waiting for the $CONTEXT status on $SHA…"
          for i in $(seq 1 60); do
            STATUS=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" \
              --jq "[.statuses[] | select(.context==\"$CONTEXT\")][0] // {}")
            STATE=$(echo "$STATUS" | jq -r '.state // "pending"')
            DESC=$(echo "$STATUS" | jq -r '.description // ""')
            echo "  [$i/60] $CONTEXT=$STATE ($DESC)"
            case "$STATE" in
              success)
                # Netlify's `ignore` command cancels a build when nothing
                # affecting ITUN changed since the last preview — but it still
                # reports a *success* commit status, with a description like
                # "Deploy Preview canceled." There is then NO fresh preview at
                # the deploy-preview-<PR>--… URL for THIS commit, so running the
                # suite would hit a stale or missing site (net::ERR_ABORTED /
                # timeouts). Mirror the deploy skip: skip the e2e run too.
                case "$DESC" in
                  *[Cc]ancel* | *[Ss]kip*)
                    echo "Deploy preview was skipped/canceled — no fresh preview to test; skipping e2e."
                    echo "skipped=true" >> "$GITHUB_OUTPUT"
                    exit 0 ;;
                  *)
                    echo "skipped=false" >> "$GITHUB_OUTPUT"
                    exit 0 ;;
                esac ;;
              failure | error) echo "::error::Netlify deploy preview failed"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Netlify deploy preview"; exit 1

      - name: Cache Playwright browsers
        if: steps.preview.outputs.skipped != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        if: steps.preview.outputs.skipped != 'true'
        working-directory: apps/in-the-union-now
        run: bunx playwright install --with-deps chromium

      - name: Run E2E against the deploy preview
        if: steps.preview.outputs.skipped != 'true'
        working-directory: apps/in-the-union-now
        env:
          E2E_BASE_URL: https://deploy-preview-${{ github.event.number }}--in-the-union-now.netlify.app
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure() && steps.preview.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: apps/in-the-union-now/playwright-report/
          retention-days: 7

  e2e-itun:
    # On pushes to main there is no deploy preview (main gets a production
    # deploy), so fall back to a self-contained run: build a static bundle and
    # serve it with `vite preview`. The snapshot publish step soft-skips here
    # (no Functions backend) — that path is covered by the PR preview run above
    # plus the snapshot unit tests.
    needs: [changes, build-package, lint, typecheck, test, knip, validate, audit]
    if: github.event_name == 'push' && needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/in-the-union-now
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/in-the-union-now
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/in-the-union-now/playwright-report/
          retention-days: 7

  e2e-suref-web:
    # Playwright smoke suite for the static suref-web reference site.
    #
    # Unlike ITUN there is NO Netlify PR deploy-preview counterpart for
    # suref-web, so a literal push-only mirror of `e2e-itun` would never run on
    # PRs — a real gap. The suite is self-contained (it builds the Astro static
    # bundle and serves it with `astro preview` via Playwright's `webServer`, the
    # same shape as ITUN's static-preview run), so it can and does run on BOTH
    # PRs and pushes to main. Gated on the `web` path filter.
    #
    # ASSUMPTION: apps/suref-web exposes a `test:e2e` script + a Playwright
    # config (added by the e2e worker). If that script is named differently,
    # update the run step below.
    needs: [changes, build-package, lint, typecheck, test, knip, validate, audit]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        # Run from the app dir so bunx resolves suref-web's exact Playwright
        # version and installs the matching browser revision (mirrors e2e-itun).
        working-directory: apps/suref-web
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/suref-web
        run: bunx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-suref-web
          path: apps/suref-web/playwright-report/
          retention-days: 7

  visual-regression:
    # Visual-regression snapshots of the suref-react Ladle stories (issue #30)
    # via Playwright's toHaveScreenshot. Builds the static Ladle bundle
    # (`ladle build`), serves it with `ladle preview`, then navigates every
    # story listed in build-ladle/meta.json and diffs against committed baselines
    # under packages/suref-react/visual/__screenshots__.
    #
    # ALLOWED TO FAIL / DELIBERATELY NOT in the quality-checks gate.
    # Baselines are rendered per-OS and CANNOT be produced in the authoring
    # environment, so none are committed yet — this job will fail ("no baseline")
    # until they exist, which is why it is not wired into the merge gate.
    #
    # TO ADOPT (one-time, run on a Linux runner / container to match CI):
    #   1. bun --filter suref-react ladle:build
    #   2. bun --filter suref-react test:visual:update   # writes CI baselines
    #   3. git add packages/suref-react/visual/__screenshots__ && commit
    #   4. add `visual-regression` to the quality-checks `needs:` list to make it
    #      a blocking gate.
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Build Ladle
        run: bun --filter suref-react ladle:build

      - name: Run visual regression
        working-directory: packages/suref-react
        run: bunx playwright test --config playwright.visual.config.ts

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: packages/suref-react/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Single aggregate gate. Always runs; fails if any job actually failed (a
  # path-filtered "skipped" job is fine). Branch protection should require just
  # this one check (`quality-checks`) so the per-area gating above never leaves
  # a required check stuck pending.
  # ---------------------------------------------------------------------------
  quality-checks:
    if: always()
    needs:
      - changes
      - lint
      - build-package
      - knip
      - typecheck
      - test
      - coverage
      - validate
      - audit
      - build-suref-web
      - build-itun
      - build-discord-bot
      - e2e-itun-preview
      - e2e-itun
      - e2e-suref-web
      # NOTE: `visual-regression` is intentionally omitted — it is allowed to
      # fail until baseline screenshots are committed (see that job). Add it here
      # once baselines land to make it a blocking gate.
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $results)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
