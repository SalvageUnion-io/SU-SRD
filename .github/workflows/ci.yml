name: CI

# The reasoning behind every non-obvious choice in this file — and the
# incidents that produced most of them — is in docs/architecture/ci.md. Read it
# before changing a trigger, a path filter, a `needs:` edge or the aggregate
# gate. Comments here say WHAT a step guards; the doc says WHY.

on:
  push:
    branches: ['main']
  # No `branches:` filter: it matches the PR's BASE, so it would give stacked
  # PRs no checks at all — and `CI Success` is required (ci.md, "Triggers").
  pull_request:
  # Dormant: no merge queue on `main` today, but this must be live BEFORE one
  # is enabled or the queue waits forever (ci.md, "Triggers").
  merge_group:

permissions:
  contents: read
  pull-requests: read
  statuses: read

# PRs: a new push supersedes the in-flight run. `main`: NEVER cancel — every
# commit gets its own group and runs to completion, because a cancelled run on
# main never fires the deploy workflow's `workflow_run` success (ci.md,
# "Concurrency"; audit CI-01).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# EVERY job declares `timeout-minutes`; GitHub's default is six hours.
jobs:
  # ---------------------------------------------------------------------------
  # Which areas a change touches. `shared` affects everything; `docs` is prose
  # and agent config only. See ci.md, "Path filters", before adding a path.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      itun: ${{ steps.filter.outputs.itun || steps.all.outputs.all }}
      web: ${{ steps.filter.outputs.web || steps.all.outputs.all }}
      bot: ${{ steps.filter.outputs.bot || steps.all.outputs.all }}
      assets: ${{ steps.filter.outputs.assets || steps.all.outputs.all }}
      ladle: ${{ steps.filter.outputs.ladle || steps.all.outputs.all }}
      code: ${{ steps.filter.outputs.code || steps.all.outputs.all }}
      docs: ${{ steps.filter.outputs.docs || steps.all.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # merge_group events have no diff base, and the queue is the last gate
      # before main — so every area is forced on.
      - name: Force-all on merge queue
        id: all
        if: github.event_name == 'merge_group'
        run: echo "all=true" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              # a `workspace:*` dependency of all four apps; asserted from the
              # manifests by tools/check-workflows.ts (path-filters)
              - 'packages/observability/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - '.bun-version'
              - 'biome.jsonc'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
              # every workspace's test preloads, linker config and patches
              - 'test/**'
              - 'bunfig.toml'
              - 'patches/**'
              - 'coverage-baseline.json'
              # root prose rendered by srd + itun and asserted on by
              # component-lib tests — the #731 incident (ci.md)
              - 'ABOUT_JRVS.md'
              - 'LLM_STATEMENT.md'
              - 'SPECIAL_THANKS.md'
            itun:
              - *shared
              - 'apps/itun/**'
              - 'packages/component-lib/**'
            web:
              - *shared
              - 'apps/srd/**'
              - 'packages/component-lib/**'
            bot:
              - *shared
              - 'apps/discord-bot/**'
            ladle:
              - *shared
              - 'packages/component-lib/**'
              # App-owned components whose stories the catalog serves
              # (packages/component-lib/.ladle/config.mjs).
              - 'apps/itun/src/components/**'
              - 'apps/srd/src/components/**'
            assets:
              - *shared
              - 'apps/su-assets/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              # the hook scripts are exercised by tools/__tests__/claude-hooks.test.ts
              - '.claude/hooks/**'
            # Prose and agent config. Runs the repo-invariant checks (doc
            # drift, architecture) but not the test suite or the typecheck —
            # nothing compiles or tests these files (audit CI-11).
            docs:
              - 'docs/**'
              - 'CLAUDE.md'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - '.claude/**'
              - '.mcp.json'

  static-checks:
    # No job-level `if:` — this job is an input to `CI Success` and must always
    # report. Its one step always runs; each check gates itself by area.
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Every gate except the test suite and the srd build (their own jobs
      # below), from the ONE registry in tools/check.ts — the same list
      # `bun run check` and pre-push run. Add a gate THERE, never as a step
      # here. The areas decide which checks a diff needs: always-on checks
      # (Biome, workflows, styling, actionlint/zizmor) run on every PR; repo
      # invariants (doc drift, data, …) on code OR docs; typecheck, knip,
      # generated-file drift and the audit on code only. Every check runs even
      # after one fails, and the log ends in a pass/fail table.
      - name: Run checks
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
        run: |
          areas=""
          if [ "$CODE" = "true" ]; then areas="code"; fi
          if [ "$DOCS" = "true" ]; then areas="${areas:+$areas,}docs"; fi
          bun tools/check.ts --profile=ci --areas="$areas"

  # THE test gate. One instrumented run of every workspace (with the #818
  # reporter-flake retry in run-coverage.ts), the coverage ratchet, and the
  # tools suite. There is no second, uninstrumented run (audit CI-03).
  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test with coverage
        run: bun run test:coverage

      # Not a workspace, so run-coverage.ts does not reach it.
      - name: Test tools
        if: ${{ !cancelled() }}
        run: bun run test:tools

      - name: Aggregate coverage report + ratchet
        if: always()
        run: bun tools/coverage-report.ts

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
          if-no-files-found: warn

  # The build jobs need only `changes`: they take no artifact from the check
  # jobs, and `CI Success` already fails on any of them (audit CI-02).
  build-srd:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build srd
        run: bun --filter srd build

      # `gate` = build + these two; split so the build runs once and the
      # Playwright tier below serves the same dist.
      - name: Check printed examples against the built site
        run: bun --filter srd check:examples

      - name: Check built output against the snapshot
        run: bun --filter srd snapshot

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/srd
        run: bunx playwright install chromium

      # The PR-blocking browser tier. Add a spec to this line; do NOT add a job.
      - name: Run smoke + bundle-budget specs
        working-directory: apps/srd
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts

      # WCAG 2.1 AA on the pages in tools/a11y-baseline.json, against the
      # dist built above. Blocks on any violation the baseline does not accept,
      # and on a baseline entry that no longer fires. It used to run only
      # nightly, so a regression merged green and surfaced the next morning.
      - name: Accessibility scan (axe-core)
        run: |
          set -euo pipefail
          (cd apps/srd && bun ssg/preview.ts --port 4399) &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sfo /dev/null http://localhost:4399/; then break; fi
            sleep 1
          done
          bun tools/a11y-scan.ts --baseline tools/a11y-baseline.json http://localhost:4399 \
            > a11y-report.json

      - name: Upload a11y report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report-srd
          path: a11y-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-web
          path: apps/srd/playwright-report/
          retention-days: 7

  build-itun:
    needs: [changes]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build itun
        run: bun --filter itun build

      # The build emits the assets; this bundles the Worker `main` that ships.
      - name: Bundle the Worker that actually deploys
        run: bun --filter itun worker:bundle --outdir /tmp/itun-worker

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/itun
        run: bunx playwright install chromium

      # The PR-blocking browser tier. Add a spec to this line; do NOT add a job.
      - name: Run smoke + bundle-budget specs
        working-directory: apps/itun
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-itun
          path: apps/itun/playwright-report/
          retention-days: 7

  build-discord-bot:
    needs: [changes]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The bot has no build script; wrangler bundles `src/http/worker.ts`.
      - name: Bundle the Worker that actually deploys
        run: bun --filter discord-bot worker:bundle --outdir /tmp/bot-worker

  # Squash merges make the PR title the commit subject release-please reads.
  pr-title:
    name: PR title is a conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # types release-please understands, optional (scope), optional ! for a
          # breaking change, then ": " and a non-empty description.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "ok: $TITLE"
            exit 0
          fi
          {
            echo "This PR's title is not a conventional commit, and on a squash-merge repo"
            echo "the title IS the commit subject that release-please reads."
            echo ""
            echo "  got:      $TITLE"
            echo "  expected: <type>(<optional scope>): <description>"
            echo "  types:    feat fix docs style refactor perf test build ci chore revert"
            echo ""
            echo "  e.g.  fix(deploy): require same-repo push provenance on the deploy gate"
            echo ""
            echo "A title that does not match still merges cleanly and silently produces no"
            echo "changelog entry and no version bump. See ADR-024."
          } >&2
          exit 1

  # The Ladle stories are component-lib's visual catalogue and the review
  # surface for the component-refresh loop. Nothing built them on a PR, so a
  # story that no longer compiled merged green and broke `bun run ladle`.
  build-ladle:
    needs: [changes]
    if: needs.changes.outputs.ladle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the Ladle stories
        run: bun --filter component-lib ladle:build

  build-su-assets:
    needs: [changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Bundle the Worker
        run: bun --filter su-assets worker:bundle --outdir /tmp/su-assets-worker

  # ---------------------------------------------------------------------------
  # The single required check. Fails if any job failed or was cancelled; a
  # path-filtered skip passes. EVERY job above must be in `needs:` —
  # tools/check-workflows.ts (aggregator) enforces it. CodeQL is required separately
  # (ci.md, "The aggregate gate").
  # ---------------------------------------------------------------------------
  quality-checks:
    name: CI Success
    if: always()
    needs:
      - changes
      - static-checks
      - coverage
      - build-srd
      - build-itun
      - build-discord-bot
      - build-su-assets
      - build-ladle
      - pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $RESULTS)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
