name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  pull-requests: read
  statuses: read

# Cancel superseded runs: pushing again to a PR (or main) aborts the previous
# in-flight run for that ref instead of letting both full matrices finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — decide which areas a change touches so we can skip heavy jobs
  # for unrelated PRs. The dependency graph is baked into each filter:
  #   salvageunion-reference + root config → affect EVERYTHING
  #   suref-react                          → affects suref-web + in-the-union-now
  # so an `itun`/`web` change is "itun/web OR suref-react OR reference OR root".
  # `code` = any source/config change (false only for docs-only PRs).
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      itun: ${{ steps.filter.outputs.itun }}
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - '.bun-version'
              - 'eslint.config.*'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
            itun:
              - *shared
              - 'apps/in-the-union-now/**'
              - 'packages/suref-react/**'
            web:
              - *shared
              - 'apps/suref-web/**'
              - 'packages/suref-react/**'
            bot:
              - *shared
              - 'apps/discord-bot/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'

  lint:
    # Always runs — format:check covers docs (markdown/yaml) too.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The package ships TypeScript source (no dist; audit item 16) — this
      # job only guards the one remaining generated artifact: the committed
      # JSON schemas. If they drift from the Zod generator output, fail so
      # stale schemas never ship (as a stale crawler-bays.schema.json once
      # did on main).
      - name: Regenerate JSON schemas
        run: bun run build:package

      - name: Verify generated schemas are up to date
        run: |
          if ! git diff --exit-code -- packages/salvageunion-reference/schemas; then
            echo "::error::Committed JSON schemas are stale. Run 'bun run build:package' and commit packages/salvageunion-reference/schemas/." >&2
            exit 1
          fi

  knip:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test
        run: bun run test

  validate:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  audit:
    # Dependency vulnerability scan against the resolved lockfile. Fails on
    # high/critical advisories so a vulnerable dependency blocks merge; lower
    # severities are reported by `bun audit` locally but do not gate CI.
    #
    # The lockfile resolves every high/critical advisory to a patched version
    # on its own — NO package.json `overrides` are required. The formerly
    # ignored advisory GHSA-gv7w-rqvm-qjhr no longer appears in the resolved
    # lockfile after the vite 8 upgrade, so no --ignore is needed. Any residual
    # esbuild advisory pulled by the vite-7-pinned suref-web subtree is `low`
    # severity and sits below this `--audit-level=high` gate.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit dependencies
        run: bun audit --audit-level=high

  build-suref-web:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build suref-web
        # Skip the headless-chromium og:image pass here — this job only verifies
        # the build compiles. The real og:images are generated in the Netlify
        # deploy (which provisions chromium); see scripts/og-screenshots.ts.
        run: bun --filter suref-web build
        env:
          OG_SCREENSHOTS_SKIP: '1'

  build-itun:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build in-the-union-now
        run: bun --filter in-the-union-now build

  build-discord-bot:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build discord-bot
        run: bun --filter @suref/discord-bot build

  # ---------------------------------------------------------------------------
  # Single aggregate gate. Always runs; fails if any job actually failed (a
  # path-filtered "skipped" job is fine). Branch protection should require just
  # this one check (`quality-checks`) so the per-area gating above never leaves
  # a required check stuck pending.
  # ---------------------------------------------------------------------------
  quality-checks:
    if: always()
    needs:
      - changes
      - lint
      - build-package
      - knip
      - typecheck
      - test
      - validate
      - audit
      - build-suref-web
      - build-itun
      - build-discord-bot
      # NOTE: browser e2e (ITUN + suref-web) and visual-regression no longer
      # gate PRs — they moved to a scheduled daily run against main
      # (.github/workflows/e2e-nightly.yml). This keeps the PR gate fast and
      # free of preview/browser flakiness; regressions are caught nightly.
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $results)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
