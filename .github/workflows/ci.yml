name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUN_VERSION: "1.3.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build package
        run: bun run build:package

      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/
          retention-days: 1

  knip:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Test
        run: bun run test

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  build:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build
        run: bun --filter suref-web build && bun --filter in-the-union-now build && bun --filter @suref/discord-bot build
