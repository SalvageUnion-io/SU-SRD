name: CI

# The comments here carry the reasoning behind every non-obvious choice. Read
# them before changing a trigger, a path filter, a `needs:` edge or the
# aggregate gate.

on:
  # No `branches:` filter: it matches the PR's BASE, so it would give stacked
  # PRs no checks at all — and `CI Success` is required.
  # CI runs on PRs only: the ruleset requires `CI Success` on a branch that is
  # up to date with `main`, so a merged tree has already passed.
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: read

# A new push supersedes the in-flight run of the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# EVERY job declares `timeout-minutes`; GitHub's default is six hours.
jobs:
  # ---------------------------------------------------------------------------
  # Which areas a change touches. `shared` affects everything; `docs` is prose
  # and agent config only.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # tools/check-workflows.ts (path-filters) holds this list and
            # tools/deploy-surfaces.ts SHARED_PATHS to each other.
            shared: &shared
              - 'packages/salvageunion-reference/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - 'biome.jsonc'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
              # the linker config
              - 'bunfig.toml'
              # root prose rendered by the site and asserted on by
              # src/components tests
              - 'ABOUT_JRVS.md'
              - 'LLM_STATEMENT.md'
              - 'SPECIAL_THANKS.md'
            # The site (the reference pages and the app), one workspace and
            # one build: build-web and perf both key on it.
            web:
              - *shared
              - 'apps/web/**'
              # schemas, link rules and wire types Convex and the client share
              - 'packages/game-domain/**'
              # the build jobs' Playwright configs and axe scan
              - 'packages/gates/**'
            # The two Worker-only apps, bundled together by bundle-workers.
            workers:
              - *shared
              - 'apps/discord-bot/**'
              - 'apps/su-assets/**'
              # the bot's wire types (`game-domain/botWire`, `import type`)
              - 'packages/game-domain/**'
              # the theme the bot's colours mirror (themeLockstep.test.ts)
              - 'apps/web/src/styles/theme.css'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              # tools/__tests__/claude-hooks.test.ts runs the hook scripts and
              # asserts the deny rules in settings.json
              - '.claude/hooks/**'
              - '.claude/settings.json'
              # zizmor.yml and dependabot.yml, read only by the actionlint check
              - '.github/*.yml'
            # Prose and agent config. Runs the repo-invariant checks (doc
            # drift, observability) but not the test suite or the typecheck —
            # nothing compiles or tests these files.
            docs:
              - 'docs/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'README.md'
              - 'SECURITY.md'
              - '.claude/**'
              - '.mcp.json'
            # What the dependency audit reads: a PR that moves neither cannot
            # change its verdict.
            deps:
              - 'bun.lock'
              - '**/package.json'

  static-checks:
    # Every run reports; each check gates itself by area.
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Every gate except the test suite and the site build (their own jobs
      # below), from the ONE registry in tools/check.ts — the same list
      # `bun run check` and pre-push run. Add a gate THERE, never as a step
      # here. The areas decide which checks a diff needs: always-on checks
      # (Biome, styling) run on every PR; repo invariants (doc drift, data, …)
      # on code OR docs; typecheck, knip, generated-file drift, workflows and
      # actionlint/zizmor on code; the audit on deps. Every check runs even
      # after one fails, and the log ends in a pass/fail table.
      - name: Run checks
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          DEPS: ${{ needs.changes.outputs.deps }}
        run: |
          areas=""
          if [ "$CODE" = "true" ]; then areas="code"; fi
          if [ "$DOCS" = "true" ]; then areas="${areas:+$areas,}docs"; fi
          if [ "$DEPS" = "true" ]; then areas="${areas:+$areas,}deps"; fi
          bun tools/check.ts --profile=ci --areas="$areas"

  # THE test gate: every workspace (tools/ included) instrumented and held to
  # its line-coverage floor, concurrently (tools/run-coverage.ts). There is no
  # second, uninstrumented run.
  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Tests with coverage floors
        run: bun run test:coverage

  # The build jobs need only `changes`: they take no artifact from the check
  # jobs, and `CI Success` already fails on any of them.
  # The site's one build (`bun run build`: the reference pages, then the app into
  # `dist/build/`, ADR-050), then both apps' PR-blocking browser tiers against
  # it. The app is compiled against a Convex URL, as production's is. The
  # URL is a throwaway backend carrying this PR's own functions, not
  # production: a PR's client must run against the backend it ships with, and
  # a PR gate makes no production calls.
  #
  # The build carries the test sign-in seam (`test-auth`), so Play's signed-in
  # flows gate merges (#1632). That ships nothing: deploy-cloudflare.yml builds
  # its own artifact against production ("ARTIFACTS ARE BUILT HERE, NOT TAKEN
  # FROM CI"), never this `dist`, and the seam's server half lives only on this
  # backend, which dies with the runner. The seam renders nothing, so the
  # signed-out scans see the UI players get; the bundle budgets carry its few
  # hundred bytes inside their ~20% headroom.
  build-web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # `build` does not typecheck: static-checks typechecks every workspace.
      - name: Start a throwaway Convex backend and build the site against it
        uses: ./.github/actions/convex-backend
        with:
          test-auth: 'true'

      - name: Check printed examples against the built site
        run: bun --filter web check:examples

      # The build emits the assets; this bundles the Worker `main` that ships.
      - name: Bundle the Worker that actually deploys
        run: bun --filter web worker:bundle --outdir /tmp/web-worker

      - name: Set up Playwright
        uses: ./.github/actions/playwright

      # The PR tier in one run: exactly the specs on the run line. Every other
      # spec (the gate specs not named here, the app's other signed-in specs)
      # runs only nightly, where e2e-nightly.yml runs the whole suite; the
      # performance budget runs below. A file filter is a pattern, so `smoke.e2e.ts` runs the
      # reference pages' and the app's smoke (`reference-smoke.e2e.ts`,
      # `app-smoke.e2e.ts`), and likewise `bundle-budget` and `a11y`;
      # `app-offline` and Play's are named whole (`play-` alone would also
      # match `display-verification.e2e.ts`). Add a spec to this line; do NOT
      # add a step or a job.
      # The a11y specs are WCAG 2.2 AA on the pages each lists, at desktop and
      # as a phone: they block on any violation. `app-offline.e2e.ts` proves the
      # app works offline, and the one install: opened at `/`, the reference
      # and the app both open offline.
      # The build carries the seam, so the signed-in tests in these specs run
      # signed in (`play-*`, the Play lines of `sibling-heights.e2e.ts`,
      # `nesting-depth.e2e.ts`'s wizards and sheet), and
      # E2E_EXPECT_AUTH_SEAM makes a lost seam fail the run rather than
      # skip them (`e2e/fixtures.ts`).
      - name: Run the PR-tier e2e specs
        working-directory: apps/web
        env:
          E2E_EXPECT_AUTH_SEAM: '1'
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts json-api.e2e.ts a11y.e2e.ts app-offline.e2e.ts sibling-heights.e2e.ts chip-strips.e2e.ts token-cutout.e2e.ts nesting-depth.e2e.ts roll-instrument.e2e.ts search-width.e2e.ts play-turn.e2e.ts play-solo.e2e.ts play-mediator.e2e.ts play-join.e2e.ts

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e-web
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/convex-backend.log" || true

  # The site's performance budget (`e2e/perf-budget.e2e.ts`): LCP, TBT and CLS on
  # a few pages under Lighthouse's mobile throttling. Its own job, beside
  # build-web rather than after it, so it adds its run time to CI's wall time
  # only where it outlasts build-web. It builds its own `dist`; downloading
  # build-web's would put it on the critical path. One worker per runner:
  # measured loads must not share the CPU, so the pages are split across two
  # runners instead (one page per test, so `--shard` splits by page).
  perf:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The one build, as build-web makes it: the app in it needs a backend.
      - name: Start a throwaway Convex backend and build the site against it
        uses: ./.github/actions/convex-backend

      - name: Set up Playwright
        uses: ./.github/actions/playwright

      - name: Run the performance budget
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
        run: bunx playwright test perf-budget.e2e.ts --workers=1 --shard="$SHARD/2" --reporter=list,github

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-perf-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

  # The Worker-only apps have no build but wrangler's bundle, which is what
  # deploys; their typecheck already runs in static-checks. One leg each.
  bundle-workers:
    needs: [changes]
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [discord-bot, su-assets]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Bundle the Worker that actually deploys
        env:
          APP: ${{ matrix.app }}
        run: bun --filter "$APP" worker:bundle --outdir "/tmp/$APP-worker"

  # ---------------------------------------------------------------------------
  # Every PR into `main` releases (release.yml), so it must bump the root
  # package.json version over main's: major, minor or patch. Skipped (a pass)
  # on PRs into any other branch.
  # ---------------------------------------------------------------------------
  version-bump:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR's merge commit and its first parent, main's tip.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # tools/release.ts imports nothing installed, so no `bun install`.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: 'false'

      - name: Require a version bump over main
        run: |
          base=$(git show HEAD^1:package.json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)')
          bun tools/release.ts --check-bump --base "$base"

  # ---------------------------------------------------------------------------
  # The single required check. Fails if any job failed or was cancelled; a
  # path-filtered skip passes. EVERY job above must be in `needs:` —
  # tools/check-workflows.ts (aggregator) enforces it. CodeQL and the PR title
  # are required separately (ARCHITECTURE.md#repo-settings).
  # ---------------------------------------------------------------------------
  quality-checks:
    name: CI Success
    if: always()
    needs:
      - changes
      - static-checks
      - coverage
      - build-web
      - perf
      - bundle-workers
      - version-bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $RESULTS)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
