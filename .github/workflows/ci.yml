name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUN_VERSION: "1.3.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build package
        run: bun run build:package

      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/
          retention-days: 1

  knip:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Test
        run: bun run test

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  build-suref-web:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build suref-web
        run: bun --filter suref-web build

  build-itun:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build in-the-union-now
        run: bun --filter in-the-union-now build

  build-discord-bot:
    needs: [lint, typecheck, test, validate, knip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Build discord-bot
        run: bun --filter @suref/discord-bot build

  e2e-itun:
    # End-to-end Playwright smoke against ITUN. Runs `bunx playwright test
    # smoke.e2e.ts` against a production-built preview server — proves the
    # built bundle boots and the dashboard renders for a real Chromium
    # session. Full flow specs (pilot/mech/crawler/wired/print) stay in the
    # repo and run via `bun run e2e:itun` locally; they will move into CI
    # once their salvageunion-reference data-hydration timing is stabilized
    # against the production bundle.
    needs: [build-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages/salvageunion-reference/dist/

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/in-the-union-now
        run: bunx playwright install --with-deps chromium

      # Scope the CI run to the smoke spec for now. The full flow specs
      # (pilot/mech/crawler/wired/print) pass locally but race the
      # salvageunion-reference data load when served from the production
      # bundle; they stay available for `bun run e2e:itun` locally and
      # will move into CI once stabilized.
      - name: Run E2E smoke tests
        working-directory: apps/in-the-union-now
        run: bunx playwright test smoke.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/in-the-union-now/playwright-report/
          retention-days: 7
