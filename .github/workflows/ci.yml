name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  pull-requests: read
  statuses: read

# Cancel superseded runs: pushing again to a PR (or main) aborts the previous
# in-flight run for that ref instead of letting both full matrices finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — decide which areas a change touches so we can skip heavy jobs
  # for unrelated PRs. The dependency graph is baked into each filter:
  #   salvageunion-reference + root config → affect EVERYTHING
  #   suref-react                          → affects suref-web + in-the-union-now
  # so an `itun`/`web` change is "itun/web OR suref-react OR reference OR root".
  # `code` = any source/config change (false only for docs-only PRs).
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      itun: ${{ steps.filter.outputs.itun }}
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      code: ${{ steps.filter.outputs.code }}
      srefReact: ${{ steps.filter.outputs.srefReact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - '.bun-version'
              - 'eslint.config.*'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
            itun:
              - *shared
              - 'apps/in-the-union-now/**'
              - 'packages/suref-react/**'
            web:
              - *shared
              - 'apps/suref-web/**'
              - 'packages/suref-react/**'
            bot:
              - *shared
              - 'apps/discord-bot/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
            # Narrower than itun/web on purpose: the visual-regression PR job
            # below only screenshots suref-react's own Ladle stories, so it
            # only needs to re-run when suref-react itself changes (not on
            # every reference-data or root-config touch that the broader
            # `itun`/`web` filters above chase). One known gap: a
            # salvageunion-reference data change CAN alter what a story
            # renders (e.g. renaming/removing the "Auto-Turret" ability the
            # ReferenceEntityGrants stories fixture on) without tripping this
            # filter — deliberate trade-off for the literal "only on
            # suref-react changes" scoping; flagged in the PR description.
            srefReact:
              - 'packages/suref-react/**'

  lint:
    # Always runs — format:check covers docs (markdown/yaml) too.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  build-package:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The package ships TypeScript source (no dist; audit item 16) — this
      # job guards the committed generated artifacts: the JSON schemas, the
      # registry-mechanism codegen (lib/generated/*.generated.ts, produced by
      # tools/generateRegistry.ts from lib/schemas/registry.ts), and the
      # marker-injected static-accessor block inside lib/index.ts. If any of
      # them drift from the generator output, fail so stale generated code
      # never ships (as a stale crawler-bays.schema.json once did on main).
      - name: Regenerate JSON schemas + registry codegen
        run: bun run build:package

      - name: Verify generated files are up to date
        run: |
          if ! git diff --exit-code -- packages/salvageunion-reference/schemas packages/salvageunion-reference/lib/generated packages/salvageunion-reference/lib/index.ts; then
            echo "::error::Committed generated files are stale. Run 'bun run build:package' and commit packages/salvageunion-reference/schemas/, packages/salvageunion-reference/lib/generated/, and packages/salvageunion-reference/lib/index.ts." >&2
            exit 1
          fi

  knip:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test
        run: bun run test

  validate:
    # `validate:all` now runs packages/salvageunion-reference/tools/validate.ts,
    # a unified runner that loads data/*.json once and runs all 8 checks
    # (ids/slugs/references/actions/action-backrefs/orphans/traits/schemas)
    # against that single in-memory pass, instead of chaining 8 separate
    # process invocations that each re-read and re-parse the data corpus.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  coverage:
    # Coverage visibility + ratchet (previously invisible — `test:coverage`
    # existed per-workspace but nothing in CI ran or read it).
    #
    # This is a SEPARATE job from `test` (deliberately re-running the suite a
    # second time, with `--coverage` instrumentation) rather than folding
    # coverage into the `test` job. An earlier coverage job (commit f520ffd1)
    # was removed for doing exactly that re-run while gating nothing — pure
    # duplicated cost. This job is the difference: tools/coverage-report.ts
    # enforces a per-workspace ratchet (coverage-baseline.json) and fails the
    # job on regression, so the duplicated run buys real regression coverage.
    # Keeping it separate also means a rare coverage-instrumentation hiccup
    # can only fail this job, never the primary `test` gate every build job
    # depends on.
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test with coverage
        run: bun run test:coverage

      - name: Aggregate coverage report + ratchet
        if: always()
        run: bun tools/coverage-report.ts

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
          if-no-files-found: warn

  audit:
    # Dependency vulnerability scan against the resolved lockfile. Fails on
    # high/critical advisories so a vulnerable dependency blocks merge; lower
    # severities are reported by `bun audit` locally but do not gate CI.
    #
    # The lockfile resolves every high/critical advisory to a patched version
    # on its own — NO package.json `overrides` are required. The formerly
    # ignored advisory GHSA-gv7w-rqvm-qjhr no longer appears in the resolved
    # lockfile after the vite 8 upgrade, so no --ignore is needed. Any residual
    # esbuild advisory pulled by the vite-7-pinned suref-web subtree is `low`
    # severity and sits below this `--audit-level=high` gate.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit dependencies
        run: bun audit --audit-level=high

  build-suref-web:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build suref-web
        # Skip the headless-chromium og:image pass here — this job only verifies
        # the build compiles. The real og:images are generated in the Netlify
        # deploy (which provisions chromium); see scripts/og-screenshots.ts.
        run: bun --filter suref-web build
        env:
          OG_SCREENSHOTS_SKIP: '1'

  build-itun:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build in-the-union-now
        run: bun --filter in-the-union-now build

  build-discord-bot:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build discord-bot
        run: bun --filter @suref/discord-bot build

  smoke-web:
    # PR-blocking smoke tier (previously e2e/visual only ran nightly, so a
    # broken route could merge to main and sit broken for up to a day). Runs
    # ONLY apps/suref-web/e2e/smoke.e2e.ts — the full suite stays nightly-only
    # (.github/workflows/e2e-nightly.yml) so the PR gate stays fast and free of
    # the flakiness that got browser e2e demoted from PR-blocking in the first
    # place. Uses the same hermetic `astro build` + `astro preview` pattern the
    # nightly job already proves works — no live Netlify deploy preview.
    needs: [changes, build-package, build-suref-web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/suref-web
        run: bunx playwright install --with-deps chromium

      - name: Run smoke test
        working-directory: apps/suref-web
        run: bunx playwright test smoke.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke-web
          path: apps/suref-web/playwright-report/
          retention-days: 7

  smoke-itun:
    # PR-blocking smoke tier — same rationale as smoke-web. Runs ONLY
    # apps/in-the-union-now/e2e/smoke.e2e.ts against a self-contained static
    # build (`vite preview`, no deploy preview), mirroring e2e-nightly.yml's
    # e2e-itun job.
    needs: [changes, build-package, build-itun]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/in-the-union-now
        run: bunx playwright install --with-deps chromium

      - name: Run smoke test
        working-directory: apps/in-the-union-now
        run: bunx playwright test smoke.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke-itun
          path: apps/in-the-union-now/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # PR-level visual-diff (issue #30 follow-up). Additive and deliberately NOT
  # part of the quality-checks gate below (continue-on-error, and absent from
  # its `needs` list) — same non-blocking posture as the nightly
  # `visual-regression` job in e2e-nightly.yml, just scoped to the PR's own
  # diff instead of a daily run against main. Compares against the committed
  # Linux baselines in packages/suref-react/visual/__screenshots__ (none are
  # committed yet — see PR description — so this currently just reports "no
  # baseline" until a maintainer runs the generate-visual-baselines workflow
  # and commits the result).
  # ---------------------------------------------------------------------------
  visual-regression-pr:
    needs: [changes]
    if: needs.changes.outputs.srefReact == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Build Ladle
        run: bun --filter suref-react ladle:build

      - name: Run visual regression
        working-directory: packages/suref-react
        run: bunx playwright test --config playwright.visual.config.ts

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-pr-report
          path: packages/suref-react/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Single aggregate gate. Always runs; fails if any job actually failed (a
  # path-filtered "skipped" job is fine). Branch protection should require just
  # this one check (`quality-checks`) so the per-area gating above never leaves
  # a required check stuck pending.
  # ---------------------------------------------------------------------------
  quality-checks:
    if: always()
    needs:
      - changes
      - lint
      - build-package
      - knip
      - typecheck
      - test
      - coverage
      - validate
      - audit
      - build-suref-web
      - build-itun
      - build-discord-bot
      - smoke-web
      - smoke-itun
      # NOTE: the FULL browser e2e suites (ITUN + suref-web) still only run
      # nightly, not per-PR — see .github/workflows/e2e-nightly.yml.
      # smoke-web/smoke-itun above cover only the PR-blocking smoke tier, so
      # the PR gate stays fast and free of full-suite preview/browser
      # flakiness; deeper regressions are still caught nightly.
      # visual-regression-pr (above) is deliberately excluded here too, for
      # the same reason plus one more: no Linux baselines are committed yet,
      # so it can only ever report "no baseline" today.
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $results)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
