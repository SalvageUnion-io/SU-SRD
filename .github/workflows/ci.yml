name: CI

# The comments here carry the reasoning behind every non-obvious choice. Read
# them before changing a trigger, a path filter, a `needs:` edge or the
# aggregate gate.

on:
  # No `branches:` filter: it matches the PR's BASE, so it would give stacked
  # PRs no checks at all — and `CI Success` is required.
  # CI runs on PRs only: the ruleset requires `CI Success` on a branch that is
  # up to date with `main`, so a merged tree has already passed.
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: read

# A new push supersedes the in-flight run of the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# EVERY job declares `timeout-minutes`; GitHub's default is six hours.
jobs:
  # ---------------------------------------------------------------------------
  # Which areas a change touches. `shared` affects everything; `docs` is prose
  # and agent config only.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      assets: ${{ steps.filter.outputs.assets }}
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              # a `workspace:*` dependency of all four apps; asserted from the
              # manifests by tools/check-workflows.ts (path-filters)
              - 'packages/observability/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - 'biome.jsonc'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
              # every workspace's test preloads and linker config
              - 'test/**'
              - 'bunfig.toml'
              # root prose rendered by srd + cantina and asserted on by
              # src/ui tests
              - 'ABOUT_JRVS.md'
              - 'LLM_STATEMENT.md'
              - 'SPECIAL_THANKS.md'
            # srd and the Cantina, one workspace and one build: build-web and
            # perf-srd both key on it.
            web:
              - *shared
              - 'apps/web/**'
              # schemas, link rules and wire types Convex and the client share
              - 'packages/cantina-domain/**'
              # the build jobs' Playwright configs and axe scan
              - 'packages/gates/**'
            bot:
              - *shared
              - 'apps/discord-bot/**'
              # the bot's wire types (`cantina-domain/botWire`, `import type`)
              - 'packages/cantina-domain/**'
              # the theme its colours mirror (themeLockstep.test.ts)
              - 'apps/web/src/ui/styles/theme.css'
            assets:
              - *shared
              - 'apps/su-assets/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              # tools/__tests__/claude-hooks.test.ts runs the hook scripts and
              # asserts the deny rules in settings.json
              - '.claude/hooks/**'
              - '.claude/settings.json'
              # zizmor.yml and dependabot.yml, read only by the actionlint check
              - '.github/*.yml'
            # Prose and agent config. Runs the repo-invariant checks (doc
            # drift, observability) but not the test suite or the typecheck —
            # nothing compiles or tests these files.
            docs:
              - 'docs/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'README.md'
              - 'SECURITY.md'
              - '.claude/**'
              - '.mcp.json'
            # What the dependency audit reads: a PR that moves neither cannot
            # change its verdict.
            deps:
              - 'bun.lock'
              - '**/package.json'

  static-checks:
    # Every run reports; each check gates itself by area.
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Every gate except the test suite and the srd build (their own jobs
      # below), from the ONE registry in tools/check.ts — the same list
      # `bun run check` and pre-push run. Add a gate THERE, never as a step
      # here. The areas decide which checks a diff needs: always-on checks
      # (Biome, styling) run on every PR; repo invariants (doc drift, data, …)
      # on code OR docs; typecheck, knip, generated-file drift, workflows and
      # actionlint/zizmor on code; the audit on deps. Every check runs even
      # after one fails, and the log ends in a pass/fail table.
      - name: Run checks
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          DEPS: ${{ needs.changes.outputs.deps }}
        run: |
          areas=""
          if [ "$CODE" = "true" ]; then areas="code"; fi
          if [ "$DOCS" = "true" ]; then areas="${areas:+$areas,}docs"; fi
          if [ "$DEPS" = "true" ]; then areas="${areas:+$areas,}deps"; fi
          bun tools/check.ts --profile=ci --areas="$areas"

  # THE test gate: every workspace (tools/ included) instrumented and held to
  # its line-coverage floor, concurrently (tools/run-coverage.ts). There is no
  # second, uninstrumented run.
  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Tests with coverage floors
        run: bun run test:coverage

  # The build jobs need only `changes`: they take no artifact from the check
  # jobs, and `CI Success` already fails on any of them.
  # The site's one build (`bun run build`: srd, then the Cantina into
  # `dist/build/`, ADR-050), then both apps' PR-blocking browser tiers against
  # it. The Cantina is compiled against a Convex URL, the variant production
  # ships, so the specs and the scans see the signed-out read-only UI players
  # get. The URL is a throwaway backend carrying this PR's own functions, not
  # production: a PR's client must run against the backend it ships with, and
  # a PR gate makes no production calls.
  build-web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # `build:untyped`, `build` without its typecheck: static-checks
      # typechecks every workspace already (the bot's job skips it likewise).
      - name: Start a throwaway Convex backend and build the site against it
        uses: ./.github/actions/convex-backend

      - name: Check printed examples against the built site
        run: bun --filter web check:examples

      # The build emits the assets; this bundles the Worker `main` that ships.
      - name: Bundle the Worker that actually deploys
        run: bun --filter web worker:bundle --outdir /tmp/srd-worker

      - name: Set up Playwright
        uses: ./.github/actions/playwright

      # srd's whole Playwright suite but the performance budget (perf-srd,
      # below): there is no nightly srd run. Add a spec to this line; do NOT
      # add a job.
      # `a11y.e2e.ts` is WCAG 2.2 AA on the pages it lists, at desktop and as a
      # phone: it blocks on any violation.
      - name: Run srd's smoke + bundle-budget + JSON API + a11y specs
        working-directory: apps/web
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts json-api.e2e.ts a11y.e2e.ts

      # Add a spec to this line; do NOT add a job.
      # `a11y.e2e.ts` is srd's scan, for the Cantina: the routes it lists, signed out,
      # at desktop and as a phone. The signed-in pages are
      # `a11y-signed-in.e2e.ts`'s, in e2e-nightly.yml: it needs the test seam.
      - name: Run the Cantina's smoke + bundle-budget + a11y specs
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: bunx playwright test -c playwright.cantina.config.ts smoke.e2e.ts bundle-budget.e2e.ts a11y.e2e.ts

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e-web
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: docker logs convex-e2e || true

  # srd's performance budget (`e2e/perf-budget.e2e.ts`): LCP, TBT and CLS on
  # a few pages under Lighthouse's mobile throttling. Its own job, beside
  # build-web rather than after it, so it adds its run time to CI's wall time
  # only where it outlasts build-web. It builds its own `dist`; downloading
  # build-web's would put it on the critical path. One worker per runner:
  # measured loads must not share the CPU, so the pages are split across two
  # runners instead (one page per test, so `--shard` splits by page).
  perf-srd:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The one build, as build-web makes it: the Cantina in it needs a backend.
      - name: Start a throwaway Convex backend and build the site against it
        uses: ./.github/actions/convex-backend

      - name: Set up Playwright
        uses: ./.github/actions/playwright

      - name: Run the performance budget
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
        run: bunx playwright test perf-budget.e2e.ts --workers=1 --shard="$SHARD/2" --reporter=list,github

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-perf-srd-${{ matrix.shard }}
          path: apps/web/playwright-report/srd/
          retention-days: 7

  build-discord-bot:
    needs: [changes]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Its `build` is typecheck + this bundle; the typecheck already runs in
      # static-checks, so only the bundle here.
      - name: Bundle the Worker that actually deploys
        run: bun --filter discord-bot worker:bundle --outdir /tmp/bot-worker

  build-su-assets:
    needs: [changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Bundle the Worker
        run: bun --filter su-assets worker:bundle --outdir /tmp/su-assets-worker

  # ---------------------------------------------------------------------------
  # Every PR into `main` releases (release.yml), so it must bump the root
  # package.json version over main's: major, minor or patch. Skipped (a pass)
  # on PRs into any other branch.
  # ---------------------------------------------------------------------------
  version-bump:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR's merge commit and its first parent, main's tip.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # tools/release.ts imports nothing installed, so no `bun install`.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Require a version bump over main
        run: |
          base=$(git show HEAD^1:package.json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)')
          bun tools/release.ts --check-bump --base "$base"

  # ---------------------------------------------------------------------------
  # The single required check. Fails if any job failed or was cancelled; a
  # path-filtered skip passes. EVERY job above must be in `needs:` —
  # tools/check-workflows.ts (aggregator) enforces it. CodeQL and the PR title
  # are required separately (ARCHITECTURE.md#repo-settings).
  # ---------------------------------------------------------------------------
  quality-checks:
    name: CI Success
    if: always()
    needs:
      - changes
      - static-checks
      - coverage
      - build-web
      - perf-srd
      - build-discord-bot
      - build-su-assets
      - version-bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $RESULTS)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
