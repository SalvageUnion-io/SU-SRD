name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Run on the merge queue's temporary branches so the required `quality-checks`
  # gate reports on queued PRs; without this the merge queue hangs forever
  # waiting for a check that never fires.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  statuses: read

# Cancel superseded runs: pushing again to a PR (or main) aborts the previous
# in-flight run for that ref instead of letting both full matrices finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — decide which areas a change touches so we can skip heavy jobs
  # for unrelated PRs. The dependency graph is baked into each filter:
  #   salvageunion-reference + root config → affect EVERYTHING
  #   component-lib                          → affects srd + itun
  # so an `itun`/`web` change is "itun/web OR component-lib OR reference OR root".
  # `code` = any source/config change (false only for docs-only PRs).
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      itun: ${{ steps.filter.outputs.itun || steps.all.outputs.all }}
      web: ${{ steps.filter.outputs.web || steps.all.outputs.all }}
      bot: ${{ steps.filter.outputs.bot || steps.all.outputs.all }}
      code: ${{ steps.filter.outputs.code || steps.all.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # merge_group events have no diff base for path filtering, and the queue
      # is the final gate before main — so force every area on and run the full
      # suite. (`'false' || ''` → 'false' keeps normal PR/push filtering intact.)
      - name: Force-all on merge queue
        id: all
        if: github.event_name == 'merge_group'
        run: echo "all=true" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            shared: &shared
              - 'packages/salvageunion-reference/**'
              - 'package.json'
              - 'bun.lock'
              - 'knip.json'
              - 'tsconfig*.json'
              - '.bun-version'
              - 'biome.jsonc'
              - 'lefthook.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
              # Root test preloads (test/happydom.ts, test/testing-library.ts)
              # are pulled in by every workspace bunfig, the root bunfig.toml
              # sets the linker mode + root preload, and patches/** rewrites
              # installed dependencies — a change to any of them affects every
              # app's tests and build, so they belong in `shared` (same
              # treatment as package.json / bun.lock). coverage-baseline.json is
              # the ratchet the coverage job reads. Without these, a PR touching
              # only them matched no filter at all and every heavy job skipped
              # while `quality-checks` still reported green.
              - 'test/**'
              - 'bunfig.toml'
              - 'patches/**'
              - 'coverage-baseline.json'
            itun:
              - *shared
              - 'apps/itun/**'
              - 'packages/component-lib/**'
            web:
              - *shared
              - 'apps/srd/**'
              - 'packages/component-lib/**'
            bot:
              - *shared
              - 'apps/discord-bot/**'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              # tools/check-architecture.ts and tools/check-doc-drift.ts (run
              # via `validate:all`, gated on this filter) need to run on the
              # very PRs that touch their own script or the docs they guard —
              # otherwise a docs-only or tools-only PR would skip `validate`
              # entirely and the doc-drift check would never catch drift in
              # the doc it was added to prevent drifting. Scoped to `code`
              # (not `shared`) so it doesn't also trigger the itun/web/bot
              # app builds — those still gate on their own dir changes.
              - 'tools/**'
              - 'docs/**'

  lint:
    # Always runs — format:check covers docs (markdown/yaml) too, and the two
    # static design guards below are unconditional by design.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # The design-token and styling-ownership guards sit at a hard ZERO
      # baseline (tools/design-tokens-baseline.json,
      # tools/styling-ownership-baseline.json) after a full burn-down. They used
      # to run ONLY in lefthook's `pre-push` hook, which is bypassable with
      # `git push --no-verify`, never runs for a GitHub web edit, and does not
      # exist at all for anyone who has not installed the hooks — so the only
      # mechanical backstop for those baselines was opt-in. Both are sub-0.2s
      # static scans with no path filter, so running them on every event costs
      # nothing and this job is already in `quality-checks`' needs list.
      - name: Design token check
        run: bun run check:tokens

      - name: Styling ownership check
        run: bun run check:styling

  build-package:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The package ships TypeScript source (no dist; audit item 16) — this
      # job guards the committed generated artifacts: the JSON schemas, the
      # registry-mechanism codegen (lib/generated/*.generated.ts, produced by
      # tools/generateRegistry.ts from lib/schemas/registry.ts), and the
      # marker-injected static-accessor block inside lib/index.ts. If any of
      # them drift from the generator output, fail so stale generated code
      # never ships (as a stale crawler-bays.schema.json once did on main).
      - name: Regenerate JSON schemas + registry codegen
        run: bun run build:package

      - name: Verify generated files are up to date
        run: |
          if ! git diff --exit-code -- packages/salvageunion-reference/schemas packages/salvageunion-reference/lib/generated packages/salvageunion-reference/lib/index.ts packages/salvageunion-reference/etc; then
            echo "::error::Committed generated files are stale. Run 'bun run build:package' and commit packages/salvageunion-reference/schemas/, packages/salvageunion-reference/lib/generated/, packages/salvageunion-reference/lib/index.ts, and packages/salvageunion-reference/etc/." >&2
            exit 1
          fi

  knip:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Knip
        run: bun run knip

  typecheck:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test
        run: bun run test

  validate:
    # `validate:all` now runs packages/salvageunion-reference/tools/validate.ts,
    # a unified runner that loads data/*.json once and runs all 8 checks
    # (ids/slugs/references/actions/action-backrefs/orphans/traits/schemas)
    # against that single in-memory pass, instead of chaining 8 separate
    # process invocations that each re-read and re-parse the data corpus.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate data
        run: bun run validate:all

  coverage:
    # Coverage visibility + ratchet (previously invisible — `test:coverage`
    # existed per-workspace but nothing in CI ran or read it).
    #
    # This is a SEPARATE job from `test` (deliberately re-running the suite a
    # second time, with `--coverage` instrumentation) rather than folding
    # coverage into the `test` job. An earlier coverage job (commit f520ffd1)
    # was removed for doing exactly that re-run while gating nothing — pure
    # duplicated cost. This job is the difference: tools/coverage-report.ts
    # enforces a per-workspace ratchet (coverage-baseline.json) and fails the
    # job on regression, so the duplicated run buys real regression coverage.
    # Keeping it separate also means a rare coverage-instrumentation hiccup
    # can only fail this job, never the primary `test` gate every build job
    # depends on.
    needs: [changes, build-package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test with coverage
        run: bun run test:coverage

      - name: Aggregate coverage report + ratchet
        if: always()
        run: bun tools/coverage-report.ts

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
          if-no-files-found: warn

  audit:
    # Dependency vulnerability scan against the resolved lockfile. Fails on
    # high/critical advisories so a vulnerable dependency blocks merge; lower
    # severities are reported by `bun audit` locally but do not gate CI.
    #
    # HOW ADVISORIES GET CLEARED HERE. Most resolve on their own when the
    # lockfile moves. The rest are held above the vulnerable range by the
    # `overrides` block in the root package.json — those entries are SECURITY
    # FLOORS, and the block is load-bearing: delete it, re-resolve, and two high
    # advisories come straight back — `sharp` (GHSA-f88m-g3jw-g9cj, reached via
    # workspace:srd -> astro) and `undici` (GHSA-vxpw-j846-p89q, via discord.js).
    # The other floors do not bind on a fresh resolve today; they are kept as
    # cheap insurance against a parent range drifting back down.
    #
    # No `--ignore` is needed: the formerly ignored GHSA-gv7w-rqvm-qjhr left the
    # resolved lockfile with the vite 8 upgrade, and the residual esbuild
    # advisory from the vite-7-pinned srd subtree is `low`, below this
    # `--audit-level=high` gate.
    #
    # WHEN THIS JOB FAILS ON A TRANSITIVE DEP, the fix is `bun update <pkg>`
    # plus the regenerated bun.lock. The floors are caret ranges so that works.
    # Do NOT pin a floor to an exact version: an exact override pins the package
    # *down* as well as up, so when the next advisory is fixed one patch above
    # it, the override itself becomes the thing holding the vulnerable version
    # in place and no `bun update` can clear it. `brace-expansion` alone was
    # hand-bumped that way twice — 5.0.7 -> 5.0.8 (#565) and 5.0.8 -> 5.0.9
    # (#673) — each time after the exact pin had blocked every open PR.
    # Raise the floor, never freeze it.
    #
    # `sharp` is the one deliberate exception: it is ALSO a real pinned
    # devDependency in the root and apps/srd, so its override is kept exact and
    # in lockstep with those pins rather than floated. It is still a security
    # floor (see the advisory above) — do not drop it. The cost of that choice
    # is that a future sharp advisory needs all three pins bumped by hand.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Audit dependencies
        run: bun audit --audit-level=high

  build-srd:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build srd
        run: bun --filter srd build

  build-itun:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build itun
        run: bun --filter itun build

      # The TanStack Router plugin regenerates src/routeTree.gen.ts as part of
      # the build. It is a COMMITTED artifact, so if the build emits something
      # different from what is checked in, every contributor gets a spuriously
      # dirty working tree and the committed file slowly stops describing the
      # real route graph. That had already happened — the checked-in file was
      # stale by an entire plugin version (import ordering) and nothing caught
      # it, because the only generated-file drift gate covers the reference
      # package. The build ran here anyway, so this check is ~free.
      - name: Check routeTree.gen.ts is not stale
        run: |
          if ! git diff --exit-code -- apps/itun/src/routeTree.gen.ts; then
            echo "::error::apps/itun/src/routeTree.gen.ts is stale — the itun build regenerated it." \
              "Run 'bun --filter itun build' and commit the result."
            exit 1
          fi

  build-discord-bot:
    needs: [changes, build-package, lint, typecheck, test, validate, knip, audit]
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build discord-bot
        run: bun --filter discord-bot build

  e2e-web:
    # PR-blocking browser tier for srd (previously e2e/visual only ran nightly,
    # so a broken route could merge to main and sit broken for up to a day).
    # Runs exactly two specs — apps/srd/e2e/smoke.e2e.ts (routes render) and
    # apps/srd/e2e/bundle-budget.e2e.ts (per-route data loading stays inside its
    # byte budget; see src/lib/schemaPreloadDeps.ts and src/lib/searchIndexBuild.ts).
    # The full suite stays nightly-only (.github/workflows/e2e-nightly.yml) so
    # the PR gate stays fast and free of the flakiness that got browser e2e
    # demoted from PR-blocking in the first place. Uses the same hermetic
    # `astro build` + `astro preview` pattern the nightly job already proves
    # works — no live Netlify deploy preview.
    #
    # These two specs used to be two separate jobs (smoke-web / bundle-budget-web)
    # so a budget regression would read as its own clearly-named failure. They
    # are one job now because that split cost a WHOLE EXTRA `astro build`:
    # playwright.config.ts's `webServer` rebuilds the app under CI, so srd was
    # built three times per PR (build-srd + one per e2e job). Failure attribution
    # is preserved by Playwright's `github` reporter, which annotates by spec
    # file and test title, so the budget failure is still named — it just names
    # the spec instead of the job. If you add a third PR-blocking spec, add it to
    # the run line below; do NOT add a third job.
    needs: [changes, build-package, build-srd]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/srd
        run: bunx playwright install --with-deps chromium

      - name: Run smoke + bundle-budget specs
        working-directory: apps/srd
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-web
          path: apps/srd/playwright-report/
          retention-days: 7

  e2e-itun:
    # PR-blocking browser tier for ITUN — same rationale and same two-spec shape
    # as e2e-web, against a self-contained static build (`vite preview`, no
    # deploy preview), mirroring e2e-nightly.yml's e2e-itun job.
    # apps/itun/e2e/bundle-budget.e2e.ts asserts per-route total JS stays under
    # a byte budget and that no single chunk balloons back to a monolithic entry
    # bundle (the guard for `autoCodeSplitting` in apps/itun/vite.config.ts).
    #
    # Merging the former smoke-itun / bundle-budget-itun pair matters more here
    # than on srd: apps/itun/package.json's `build` is `tsc --noEmit && vite build`
    # and playwright.config.ts's `webServer` runs it, so each extra e2e job cost
    # a full extra typecheck of itun on top of the extra build.
    needs: [changes, build-package, build-itun]
    if: needs.changes.outputs.itun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        working-directory: apps/itun
        run: bunx playwright install --with-deps chromium

      - name: Run smoke + bundle-budget specs
        working-directory: apps/itun
        run: bunx playwright test smoke.e2e.ts bundle-budget.e2e.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-itun
          path: apps/itun/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Single aggregate gate. Always runs; fails if any job actually failed (a
  # path-filtered "skipped" job is fine). Branch protection should require just
  # this one check (`quality-checks`) so the per-area gating above never leaves
  # a required check stuck pending.
  # ---------------------------------------------------------------------------
  quality-checks:
    if: always()
    needs:
      - changes
      - lint
      - build-package
      - knip
      - typecheck
      - test
      - coverage
      - validate
      - audit
      - build-srd
      - build-itun
      - build-discord-bot
      - e2e-web
      - e2e-itun
      # NOTE: the FULL browser e2e suites (ITUN + srd) still only run
      # nightly, not per-PR — see .github/workflows/e2e-nightly.yml.
      # e2e-web/e2e-itun above cover only the PR-blocking tier (the smoke and
      # bundle-budget specs), so the PR gate stays fast and free of full-suite
      # preview/browser flakiness; deeper regressions are still caught nightly.
      #
      # EVERY job above must be listed here. This is the single required check
      # for branch protection, so a job missing from this list is a job that
      # can fail without blocking merge.
      #
      # `needs:` reaches only inside this workflow, so this gate CANNOT cover
      # .github/workflows/codeql.yml. CodeQL's `analyze` job runs on the same
      # pull_request trigger and appears in no aggregate, which makes every SAST
      # finding advisory: a CodeQL failure does not block a merge today.
      #
      # ACTION REQUIRED — two steps, IN THIS ORDER. Reversing them wedges the
      # merge queue on every PR:
      #
      #   1. Add `merge_group:` to codeql.yml's `on:` block. It currently
      #      triggers on push/pull_request/schedule only. Requiring a context
      #      that never fires on the queue's temporary branches is the exact
      #      failure the `merge_group:` trigger at the top of THIS file was
      #      added to prevent — the queue would wait forever.
      #   2. Then add `CodeQL / Analyze (javascript-typescript)` as a SECOND
      #      required status context alongside `quality-checks` in the branch
      #      ruleset for `main`. Confirm the exact context string first — it is
      #      the workflow name plus the job's `name:` — with:
      #        gh api repos/{owner}/{repo}/commits/main/check-runs --jq '.check_runs[].name'
      #
      # Unlike the jobs above, CodeQL runs unfiltered (no path filter), so once
      # it fires on the queue it can be required without stranding docs-only
      # PRs in "pending".
      #
      # Do NOT instead add a step here that polls the CodeQL check-run via `gh`:
      # it would race the other workflow, and a poll that times out or 404s
      # reports green — worse than the advisory state it replaced.
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass (results: $results)"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
