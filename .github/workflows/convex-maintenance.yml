# Run a named one-off Convex maintenance function against PRODUCTION, by hand.
#
# WHY THIS EXISTS. Repairs like `maintenance:repairContainers` are internal
# actions: nothing in the app calls them, and running them needs production
# credentials that live only in this repo's Actions secrets
# (`CONVEX_DEPLOY_KEY`, the same key `deploy-cloudflare.yml` pushes with).
# Without this workflow the only way to run one is a maintainer's own machine
# with `bunx convex run --prod`, so a repair a PR asked for could sit unrun.
#
# SAFETY:
#   * `workflow_dispatch` only — never on a schedule or a push. Dispatching
#     needs write access to the repo, and forks cannot trigger it.
#   * `main` only, as an ACCIDENT guard. A dispatch runs the workflow file from
#     the dispatched ref, so someone with write access could edit this `if:` on
#     a branch — but they could equally push any workflow that reads the
#     repo-level secret. The real controls are write access and `main`'s
#     ruleset; a GitHub Environment restricted to `main` would be the hard
#     boundary for this workflow and `deploy-cloudflare.yml` alike.
#   * An allowlist. `task` is a `choice` input AND the step re-checks it with a
#     `case`, so adding a function to run here is a reviewed change to this
#     file, never a free-text argument.
#   * PRODUCTION, explicitly. `--prod` is passed, and the key must be a
#     production deploy key (`prod:`) or a project key (`project:`). Without
#     `--prod` a project key sends `convex run` to the DEV deployment, while
#     `convex deploy` still targets prod — so this would have gone green
#     against the wrong database.
#   * The key is exposed to the one step that uses it.
#
# Every function listed must be idempotent: a re-run must be safe, because a
# dispatch can be repeated by hand or retried after a partial failure.

name: Convex maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance function to run against production (idempotent repairs only)'
        required: true
        type: choice
        options:
          - repairContainers

permissions:
  contents: read

# One at a time: two repairs paging the same tables concurrently is wasted
# work at best.
concurrency:
  group: convex-maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run maintenance:${{ inputs.task }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run the maintenance function
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "$TASK" in
            repairContainers) ;;
            *)
              echo "FATAL: '$TASK' is not on this workflow's allowlist." >&2
              exit 1
              ;;
          esac
          case "$CONVEX_DEPLOY_KEY" in
            prod:* | project:*) ;;
            "")
              echo "FATAL: no CONVEX_DEPLOY_KEY secret; nothing was run." >&2
              exit 1
              ;;
            *)
              echo "FATAL: CONVEX_DEPLOY_KEY is not a production deploy key or a project key; refusing to run." >&2
              exit 1
              ;;
          esac
          echo "Running maintenance:$TASK against production"
          bunx convex run "maintenance:$TASK" '{}' --prod
