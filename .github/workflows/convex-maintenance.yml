# Run a named one-off Convex maintenance function against PRODUCTION, by hand.
#
# WHY THIS EXISTS. Backfills like `maintenance:backfillGameSummaries` are
# internal actions: nothing in the app calls them, and running them needs
# production credentials that live only in this repo's Actions secrets
# (`CONVEX_DEPLOY_KEY`, the same key `deploy-cloudflare.yml` pushes with). Before
# this workflow the only way to run one was a maintainer's own machine with
# `bunx convex run --prod`, so a backfill a PR asked for could sit unrun.
#
# SAFETY, in order of importance:
#   * `workflow_dispatch` only — never on a schedule or a push.
#   * `main` only. A dispatch from any other ref is refused before the key is
#     read, so a branch cannot run code of its own with production credentials.
#   * An allowlist. `task` is a `choice` input AND the step re-checks it with a
#     `case`, so adding a function to run here is a reviewed change to this
#     file, never a free-text argument.
#   * The key is exposed to the one step that uses it.
#
# Every function listed must be idempotent: a re-run must be safe, because a
# dispatch can be repeated by hand or retried after a partial failure.

name: Convex maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance function to run against production (idempotent backfills only)'
        required: true
        type: choice
        options:
          - backfillGameSummaries
          - backfillBodyAppIds

permissions:
  contents: read

# One at a time: two backfills paging the same tables concurrently is wasted
# work at best.
concurrency:
  group: convex-maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Run maintenance:${{ inputs.task }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run the maintenance function
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "$TASK" in
            backfillGameSummaries | backfillBodyAppIds) ;;
            *)
              echo "FATAL: '$TASK' is not on this workflow's allowlist." >&2
              exit 1
              ;;
          esac
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "FATAL: no CONVEX_DEPLOY_KEY secret; nothing was run." >&2
            exit 1
          fi
          echo "Running maintenance:$TASK against production"
          bunx convex run "maintenance:$TASK" '{}'
