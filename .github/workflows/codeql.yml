name: CodeQL

# SAST over the shipped JavaScript/TypeScript: every push to main, every PR, and
# weekly for newly published queries. `Analyze (javascript-typescript)` passes
# once the analysis uploads, whatever it found: blocking a merge on a finding is
# the ruleset's `code_scanning` rule, not this file
# (docs/ARCHITECTURE.md#ci-repository-settings). Tests and e2e specs are not analysed, and the suite is
# `security-extended`: quality findings are Biome's and tsc's job.
on:
  push:
    branches: ['main']
  # Unfiltered for the same reason as ci.yml: `branches:` matches the PR's BASE
  # branch, so it gave no run at all to a PR stacked on another PR — and
  # `Analyze (javascript-typescript)` is its OWN required status on main, so
  # that left those PRs permanently unmergeable rather than merely unscanned.
  pull_request:
  # Kept DORMANT: the `main` ruleset has no merge queue
  # (ARCHITECTURE.md#ci-repository-settings). It stays because the ORDER matters if a queue is ever enabled:
  # the queue's temporary `gh-readonly-queue/**` branches fire NEITHER
  # `push: [main]` NOR `pull_request`, so requiring a context that never reports
  # on them leaves the queue waiting for a check that cannot arrive. This
  # trigger must be live on `main` BEFORE the ruleset is changed — same
  # reasoning as ci.yml's.
  merge_group:
  schedule:
    # Mondays at 05:30 UTC, offset from the top of the hour to avoid the
    # scheduling stampede.
    - cron: '30 5 * * 1'

# Cancel superseded runs, mirroring ci.yml. This became load-bearing when the
# `pull_request` base filter came off above: CodeQL now fires on every layer of
# a stack, and one `gh stack sync` force-pushes all of them at once. Without
# this, an N-layer stack starts N analyses per sync and leaves every earlier
# in-flight analysis running to its timeout, which the old main-only filter
# had bounded by accident.
#
# NO `paths-ignore`, deliberately, even for docs-only PRs. `Analyze
# (javascript-typescript)` is its OWN required status on main, and a workflow
# skipped by a path filter never reports — so the PR would sit on "Expected —
# waiting for status" forever. Paying for a docs-only analysis is cheaper than
# an unmergeable docs PR.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# CodeQL needs its own permissions block — the ci.yml block does not apply here.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Bounds a hang to a red check instead of GitHub's six-hour default. Raise
    # it if a real analysis ever approaches it; do not remove it.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          # Single identifier covers both JS and TS.
          languages: javascript-typescript
          # Interpreted languages need no compilation — skip the build phase.
          build-mode: none
          queries: security-extended
          # What is analysed, not when the workflow runs (the trigger must stay
          # unfiltered, above): generated files are drift-checked machine
          # output, and test code never ships.
          config: |
            paths-ignore:
              - '**/*.generated.ts'
              - '**/routeTree.gen.ts'
              - '**/__tests__/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/e2e/**'
              - 'test/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: '/language:javascript-typescript'
