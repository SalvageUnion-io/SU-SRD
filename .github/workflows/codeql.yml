name: CodeQL

# Static analysis / SAST (issue #29). Scans the JavaScript/TypeScript sources on
# every push to main, every PR into main, and weekly (to catch newly-disclosed
# query-pack findings on code that hasn't changed).
on:
  push:
    branches: ['main']
  # Unfiltered for the same reason as ci.yml: `branches:` matches the PR's BASE
  # branch, so it gave no run at all to a PR stacked on another PR — and
  # `Analyze (javascript-typescript)` is its OWN required status on main, so
  # that left those PRs permanently unmergeable rather than merely unscanned.
  pull_request:
  # Kept DORMANT: there is currently no merge queue on `main` (the live ruleset
  # has `deletion`, `non_fast_forward`, `required_linear_history` and
  # `required_status_checks`, and no `merge_queue`). This comment used to assert
  # the repo "merges through a merge queue", which was wrong and sat in a file a
  # CI change gets read from.
  #
  # It stays because the ORDER matters if a queue is ever enabled: the queue's
  # temporary `gh-readonly-queue/**` branches fire NEITHER `push: [main]` NOR
  # `pull_request`, so requiring a context that never reports on them leaves the
  # queue waiting for a check that cannot arrive. This trigger must be live on
  # `main` BEFORE the ruleset is changed — same reasoning as ci.yml's.
  merge_group:
  schedule:
    # Mondays at 05:30 UTC — same cadence as Dependabot, offset from the
    # top of the hour to avoid the scheduling stampede.
    - cron: '30 5 * * 1'

# Cancel superseded runs, mirroring ci.yml. This became load-bearing when the
# `pull_request` base filter came off above: CodeQL now fires on every layer of
# a stack, and one `gh stack sync` force-pushes all of them at once. Without
# this, an N-layer stack starts N analyses per sync and leaves every earlier
# in-flight analysis running to its `timeout-minutes: 360`, which the old
# main-only filter had bounded by accident.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# CodeQL needs its own permissions block — the ci.yml block does not apply here.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          # Single identifier covers both JS and TS.
          languages: javascript-typescript
          # Interpreted languages need no compilation — skip the build phase.
          build-mode: none
          queries: security-and-quality
          # Don't scan generated artifacts — the reference package's API-surface
          # snapshot (a large declaration rollup), the registry codegen, and the
          # TanStack routeTree. They are machine-emitted and drift-checked, not
          # hand-authored source, so CodeQL findings there are noise.
          config: |
            paths-ignore:
              - packages/salvageunion-reference/etc
              - '**/*.generated.ts'
              - '**/routeTree.gen.ts'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: '/language:javascript-typescript'
