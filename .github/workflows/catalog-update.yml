# Dependency updates for the root `workspaces.catalog`.
#
# WHY THIS EXISTS: Dependabot cannot read Bun's `catalog:` protocol. Two issues
# are open against dependabot-core and both are unresolved —
#   #12522 "Dependabot removes catalog/catalogs field with bun"  (open Jun 2025)
#   #14320 "Bun catalogs are not properly checked for updates"   (open Mar 2026)
# — so without this workflow, moving 19 shared deps into the catalog would
# SILENTLY stop them being updated. .github/dependabot.yml still owns everything
# that is not catalogued (per-workspace deps, GitHub Actions).
#
# DELETE THIS FILE the day dependabot-core supports `catalog:` — the whole point
# is coverage Dependabot cannot yet give, not a preference for this tool.
#
# ---------------------------------------------------------------------------
# THE ACTION IS PINNED TO A COMMIT SHA, DELIBERATELY.
#
# brandhaug/catalog-update-action is a young, low-adoption project (created
# 2026-02-27; 0 stars, 0 forks at time of writing; MIT). It is a COMPOSITE
# action, so everything it does runs here, in this repo's runner, with the
# permissions granted below. A moving `@v1` tag would therefore be unattended
# code execution on every scheduled run — the same argument that keeps plugin
# `autoUpdate` off elsewhere. The SHA below is `v1` / `catalog-update-action-
# v0.10.0` (they point at the same commit). Re-pin deliberately, after reading
# the diff; never widen this back to a tag.
# ---------------------------------------------------------------------------
name: Catalog Update

on:
  schedule:
    # Mondays, an hour after Dependabot's weekly run, so the two batches of
    # dependency PRs land together and get reviewed in one sitting.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview updates without opening PRs'
        type: boolean
        default: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # Bounded like every job in ci.yml and e2e-nightly.yml — GitHub's default is
    # 360 minutes, and an unattended weekly job is the least likely place anyone
    # would notice one hanging.
    timeout-minutes: 15
    permissions:
      # The minimum the action needs: commit a branch, open a PR against it.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The updater diffs against the base branch, so it needs real history.
          fetch-depth: 0

      # No `setup-bun` step BEFORE this one: the action is composite and runs
      # `oven-sh/setup-bun@v2` itself before regenerating bun.lock, unpinned, so
      # anything installed first would just be overridden. The lockfile is
      # therefore rewritten by whatever Bun is current rather than by this
      # repo's .bun-version.
      #
      # That is not hypothetical any more. It is the most likely explanation for
      # a `bun.lock` at lockfileVersion 2 while `.bun-version` pinned 1.4.0 —
      # which made the repo unbootstrappable anywhere the pinned toolchain was
      # not already present, including a fresh agent container, where
      # `bun install --frozen-lockfile` hard-fails with "Unknown lockfile
      # version" and every `bun run` script, both git hooks and the /triage
      # skill go inert.
      #
      # The step after this one is the fix: prove the PINNED Bun can still read
      # whatever this action produced, before a PR carrying it can be opened.
      - name: Update catalog dependencies
        uses: brandhaug/catalog-update-action@6c6e67170395d9012c38a3dea0fea85df5feb344 # v0.10.0
        with:
          config: '.catalog-updaterc.json'
          dry-run: ${{ inputs.dry-run || 'false' }}
          # NOTE: this uses the default GITHUB_TOKEN, so the PRs it opens will
          # NOT trigger ci.yml — GitHub suppresses workflow runs for events
          # raised by GITHUB_TOKEN, to prevent recursion.
          #
          # That fails CLOSED here rather than open: `CI Success` is a
          # required status on main, so a catalog PR with no CI run simply
          # cannot be merged. To get checks running, either close and reopen the
          # PR, or give the action a GitHub App token (see the action's README)
          # — which is a credential decision, not something to wire in silently.

      # The lockfile this action just rewrote must still be readable by the Bun
      # this repo pins. `oven-sh/setup-bun@v2` inside the composite installs
      # whatever is current, and a newer Bun can emit a lockfileVersion the
      # pinned one cannot parse — at which point `bun install --frozen-lockfile`
      # fails everywhere, including in CI and in fresh contributor and agent
      # containers, for a change nobody reviewed.
      #
      # `--frozen-lockfile` is the right probe: it does no resolution, so it
      # asserts exactly one property — the pinned Bun can read this file — and
      # cannot itself rewrite anything. Runs on dry-run too, where it is a
      # no-op against the unchanged lockfile and costs seconds.
      - name: Setup Bun (pinned)
        uses: ./.github/actions/setup-bun

      - name: The pinned Bun must still be able to read the lockfile
        run: |
          set -euo pipefail
          echo "Pinned Bun: $(bun --version)   .bun-version: $(cat .bun-version)"
          if ! bun install --frozen-lockfile; then
            echo "" >&2
            echo "FATAL: the regenerated bun.lock cannot be read by Bun $(cat .bun-version)." >&2
            echo "The catalog action installs its own unpinned Bun, which has emitted a" >&2
            echo "lockfile format the repo's pinned toolchain does not understand." >&2
            echo "Do NOT merge a PR from this run — it would break install for everyone." >&2
            exit 1
          fi
