name: PR gallery

# Screenshots of the PR's own srd and ITUN builds — every page in
# packages/gates/lib/galleryPages.ts at desktop and phone, each srd page's link
# preview, and ITUN signed in — uploaded as the `pr-gallery-<n>` artifact.
# `pr-gallery-pages.yml` publishes the artifact to GitHub Pages at
# /<owner>.github.io/<repo>/<n>/ once this run completes.
#
# READ-ONLY on purpose: this runs the PR's code, so it holds no write token and
# no secret. ITUN is built against a THROWAWAY self-hosted Convex backend with
# the test sign-in (the same setup as e2e-nightly.yml's `e2e-itun`), so the
# gallery can sign a fresh account up and edit characters without touching the
# staging or production backend. Publishing, which needs `pages: write`, runs
# in the separate `workflow_run` workflow, from main's code.
#
# THE PREVIEW TOUR is the same gallery shot from main after every successful
# production deploy (the `workflow_run` trigger), uploaded as `preview-tour`;
# `pr-gallery-pages.yml` publishes it at /<owner>.github.io/<repo>/tour/. Only
# a push deploy counts: a dispatched rollback deploys an older commit than the
# one this would check out, so the last tour stands rather than mislabel one.
#
# Not a required check: a red gallery never blocks a merge.
#
# zizmor's dangerous-triggers is suppressed: the `workflow_run` leg fires only
# for a same-repository push to main, checks out that commit, and holds the
# same read-only token and no secret as the PR leg.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy (Cloudflare)]
    types: [completed]

permissions: {}

concurrency:
  group: pr-gallery-${{ github.event.pull_request.number || 'tour' }}
  cancel-in-progress: true

jobs:
  shoot:
    name: Shoot the PR gallery
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployed commit on the tour leg; the PR's merge commit otherwise.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Start a throwaway Convex backend and build itun against it
        id: convex
        uses: ./.github/actions/convex-backend
        with:
          test-auth: 'true'

      - name: Build srd
        run: bun --filter srd build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (Chromium)
        run: bunx playwright install chromium

      # srd is static files: a plain server answers `/route/` with its
      # index.html. ITUN is a single-page app: `vite preview` falls back to
      # index.html for its routes. `vite preview` loads apps/itun/vite.config.ts,
      # which refuses to start without VITE_CONVEX_URL (the build already
      # carries it; the config only checks it is set), so pass the same URL.
      - name: Serve both builds
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
        run: |
          (cd apps/srd/dist && python3 -m http.server 4321 --bind 127.0.0.1 > /tmp/srd.log 2>&1 &)
          (cd apps/itun && bunx vite preview --port 5173 --strictPort > /tmp/itun.log 2>&1 &)
          for url in http://127.0.0.1:4321/ http://localhost:5173/build/; do
            for _ in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 1; done
            curl -sf -o /dev/null "$url" || {
              echo "::error::$url never answered"
              echo "--- /tmp/srd.log"; cat /tmp/srd.log
              echo "--- /tmp/itun.log"; cat /tmp/itun.log
              exit 1
            }
          done

      # A tour passes no --pr: its gallery.json carries `pr: null`, which is
      # how gallery-pages.ts tells the tour from a PR's gallery.
      - name: Shoot the gallery
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: >-
          bun run gallery --srd http://127.0.0.1:4321 --itun http://localhost:5173/build
          --signed-in ${PR_NUMBER:+--pr "$PR_NUMBER"} --sha "$HEAD_SHA" --out gallery

      # The tour keeps 90 days: Pages republishes the newest one on every
      # rebuild, so a stretch with no deploy must not expire it.
      - name: Upload the gallery
        if: ${{ !cancelled() && hashFiles('gallery/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.pull_request.number && format('pr-gallery-{0}', github.event.pull_request.number) || 'preview-tour' }}
          path: gallery
          retention-days: ${{ github.event.pull_request.number && 30 || 90 }}

      - name: Link the gallery from the run summary
        if: ${{ !cancelled() && hashFiles('gallery/index.html') != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ -n "$PR_NUMBER" ]; then
            title="PR gallery" path="$PR_NUMBER" artifact="pr-gallery-$PR_NUMBER"
          else
            title="Preview tour" path="tour" artifact="preview-tour"
          fi
          {
            echo "### $title"
            echo ""
            echo "Published by **PR gallery pages** once this run completes:"
            echo "https://${owner}.github.io/${REPO}/${path}/"
            echo ""
            echo "The \`${artifact}\` artifact above holds the same files."
          } >> "$GITHUB_STEP_SUMMARY"
