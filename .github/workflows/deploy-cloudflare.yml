name: Deploy (Cloudflare)

# Builds and deploys the web surfaces and the bot to Cloudflare Workers (ADR-033).
#
# WHY THE BUILD RUNS HERE AND NOT IN WORKERS BUILDS (ADR-033 §4). srd's build
# provisions a headless Chromium to render ~850 per-entity OG images, which is a
# poor fit for Cloudflare's build environment. Rather than split the build across
# two systems — one surface here, two there — everything builds in Actions and
# deploys with `wrangler`. One build path, and one place path-filtering lives.
#
# THE GATE IS THE RULESET. A push to `main` is a merged PR, and the `main`
# ruleset (strict, no bypass actors) merges only a branch that is up to date
# with `main` and passed `CI Success`, so the tree this deploys has already
# passed CI as that PR (docs/ARCHITECTURE.md#ci-repository-settings).
#
# ---------------------------------------------------------------------------
# SHAPE: plan -> build-* -> push-convex -> deploy-* -> smoke -> record (CI-12)
# ---------------------------------------------------------------------------
#
#   plan       provenance, the deploy set, every credential guard, and a dry-run
#              bundle of every Worker. Holds no artifact; fails before anything
#              is built.
#   build-srd  / build-itun   one job per surface that HAS a build, in
#              parallel. Each uploads the exact `dist` it produced. Neither
#              pushes anything anywhere.
#   og-srd     renders srd's OG images into build-srd's `dist`. Best-effort, so
#              only `deploy-srd` waits for it.
#   push-convex  the Convex backend push, only once EVERY build is green, and
#              before any traffic moves.
#   deploy-*   one job per surface, in parallel, and NONE starts until EVERY
#              build job has finished green and the backend push (when itun
#              ships) succeeded. Each ships the artifact its build job
#              uploaded — nothing is rebuilt between build and deploy.
#   smoke      the production smoke list, once, after every deploy.
#   record     moves `deployed/cloudflare`, only after smoke passed.
#
# This used to be ONE serial 30-minute job: srd built, OG-rendered and deployed
# before itun started building, so an itun build failure left srd on the new
# commit and itun on the old — a partial deploy nobody chose. Now every build
# finishes before any traffic moves, and the two long builds overlap.
# `tools/check-workflows.ts` (deploy-order) asserts that ordering, so a future
# edit cannot quietly let one deploy job run ahead of a build.
#
# WHY THE ARTIFACTS ARE BUILT HERE AND NOT TAKEN FROM CI'S RUN. The audit's
# first suggestion was to deploy the `dist` CI already built for the PR.
# Neither CI build is the production artifact:
#   - srd: CI builds with no Sentry DSN, and production must ship the DSN,
#     source maps and the OG images, none of which CI produces.
#   - itun: CI builds against a throwaway Convex backend carrying the PR's own
#     functions. Production must be compiled against the production
#     deployment's URL (`ITUN_CONVEX_URL` below, checked against Convex's
#     canonical URL before the push), and with the Sentry DSN.
# And CI path-filters per PR while this workflow deploys per LAST RECORDED
# DEPLOY (CI-01), so a surface can need deploying on a commit where CI skipped
# its build — a CI-artifact path would need this build path as a fallback
# anyway. So the build happens once, here, and the deploy ships exactly it.
#
# `tools/check-workflows.ts` (convex-guard) asserts this file still refuses a
# production deploy with no CONVEX_DEPLOY_KEY, and that the job pushing the
# backend depends on the job carrying that guard. Do not rename this file
# without updating that tool.

on:
  # Every merge. Only a same-repo push can reach `main`, and the `production`
  # Environment admits `main` alone.
  push:
    branches: [main]
  # Manual re-deploy, for when a deploy fails on something unrelated to the code
  # (a Cloudflare incident, a rotated token) and the commit is already green.
  #
  # `sha` is the ROLLBACK PATH, and it exists because there was none: dispatch
  # took no inputs and checked out `github.sha`, so recovering from a bad deploy
  # meant a revert PR through full CI — five minutes at best, and it re-runs all
  # four deploys anyway. Now: dispatch with the last known-good commit.
  #
  # Validated as an ancestor of `main` before anything is built (see the guard
  # below), so this cannot become the "any branch straight to production" hole
  # the `github.ref` clause was added to close.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (must be an ancestor of main). Defaults to the tip of main.'
        required: false
        type: string
      # Ignore the last-deploy record and ship every surface. For recovering
      # from something the diff cannot see: a surface changed out of band in
      # the Cloudflare dashboard, or a record that is suspected to be wrong.
      force_all:
        description: 'Deploy every surface, ignoring what changed since the last recorded deploy.'
        required: false
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a half-uploaded asset
# manifest is worse than a queued deploy.
#
# GitHub keeps at most ONE pending run per group, so when three merges land
# close together the middle deploy is dropped from the queue. That is safe ONLY
# because the deploy set below is computed against the last RECORDED deploy,
# not against `HEAD^`: the run that survives diffs across every commit the
# dropped run would have shipped. Diffing `HEAD^..HEAD` here would silently
# skip any surface touched only by the dropped commit (CI-01).
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The production Convex deployment's client URL, which itun is compiled
  # against. Public — it is in every shipped bundle — and documented in
  # docs/ARCHITECTURE.md#accounts-and-games-operations. It is a constant rather than whatever
  # `convex deploy --cmd` hands the build, because that command PUSHES the
  # backend, and the push must wait until every build is green (see
  # `push-convex`). `push-convex` asserts it equals the canonical URL the
  # deploy key resolves to before it pushes, so a moved deployment fails the
  # run before anything ships instead of shipping a client aimed elsewhere.
  ITUN_CONVEX_URL: https://exuberant-porpoise-183.convex.cloud
  # Sentry's client keys and org slug. Public by construction: each DSN is
  # inlined into a bundle anyone can download, and the slug is in every Sentry
  # URL (docs/ARCHITECTURE.md#sentry). The one Sentry secret is
  # SENTRY_AUTH_TOKEN, which can write to the org.
  SRD_SENTRY_DSN: https://543122dc077d63448e70d33b0a120283@o4511811110764544.ingest.de.sentry.io/4511811268902992
  ITUN_SENTRY_DSN: https://bc1ea4e8e45b338d4b5d8ac5ee1016ae@o4511811110764544.ingest.de.sentry.io/4511811273097296
  SENTRY_ORG: susrd

jobs:
  # ===========================================================================
  # plan — decide, guard and pre-flight. Nothing here is built or shipped.
  # ===========================================================================
  plan:
    # A dispatch checks out the tip of whatever ref was selected, and every
    # branch cut from main carries this file, so only `main` may be dispatched
    # (a push is `main` by its trigger). Every later job `needs` this one,
    # directly or through a build job, so this one expression gates the whole
    # workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      # The commit's time in Unix seconds: itun's build stamp, and the build
      # floor `push-convex` writes into the backend (see that job).
      stamp: ${{ steps.target.outputs.stamp }}
      # `true` when HEAD is older than the recorded deploy on a push (a re-run
      # of an older merge's deploy): a newer commit already shipped. Nothing
      # builds or deploys, and `record` must not move the tag back.
      stale: ${{ steps.surfaces.outputs.stale }}
      assets: ${{ steps.surfaces.outputs.assets }}
      srd: ${{ steps.surfaces.outputs.srd }}
      itun: ${{ steps.surfaces.outputs.itun }}
      bot: ${{ steps.surfaces.outputs.bot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing in this job pushes, and the tree it checks out runs
          # `bun install` before any secret step — so no token is left in
          # .git/config for that code to find.
          persist-credentials: false
          # A dispatched `sha` (the rollback path), else the pushed commit.
          ref: ${{ inputs.sha || github.sha }}
          # Ancestry cannot be checked in a shallow clone, and the deploy-set
          # diff below needs the last deployed commit.
          fetch-depth: 0

      # The ONE place the deployed commit is named. Every later job checks out
      # exactly this sha, the build jobs stamp it into both apps and the
      # `record` job writes it to the deploy record, so a dispatched `sha` is
      # reported as itself rather than as the tip of main.
      - name: Resolve the commit being deployed
        id: target
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # A dispatched `sha` must be an ancestor of main. Without this the input
      # would reintroduce exactly what the `refs/heads/main` clause exists to
      # prevent: an arbitrary commit, with no CI having passed, deployed
      # straight to production by anyone with write access.
      - name: The dispatched commit must be an ancestor of main
        if: inputs.sha != ''
        # Through `env:`, never `${{ }}` inside the script: an expression is
        # spliced into the shell source before bash parses it, so a crafted
        # input would run as code in the job that holds the deploy secrets.
        env:
          DISPATCHED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$DISPATCHED_SHA" origin/main; then
            echo "FATAL: $DISPATCHED_SHA is not an ancestor of origin/main." >&2
            echo "Only a commit that has been on main — and therefore through CI — may be deployed." >&2
            exit 1
          fi
          echo "OK: $DISPATCHED_SHA is on main."

      # Which surfaces differ from what is live.
      #
      # ci.yml path-filters every heavy job; without this, a docs-only merge
      # still installed Chromium, rendered ~2,000 OG images and ran four
      # `wrangler deploy`s.
      #
      # The base is the LAST SUCCESSFUL DEPLOY — the `deployed/cloudflare` tag
      # that the `record` job below moves after every green run — never
      # `HEAD^`, which silently skipped any surface touched only by a commit
      # whose deploy never ran (audit CI-01). The logic, its reasoning and its
      # tests live in tools/deploy-surfaces.ts; it fails SAFE (no record, a
      # shared path or `force_all` deploys everything).
      #
      # It also refuses to go BACKWARDS on a push. A re-run of an older merge's
      # deploy can start after a newer one has already shipped; diffing
      # newer->older would ship the older tree over the newer one. Such a run
      # is `stale`: nothing deploys and the record stays put. Only a dispatch
      # (the rollback path) passes `--allow-backwards`.
      - name: Decide which surfaces to deploy
        id: surfaces
        run: >-
          bun tools/deploy-surfaces.ts
          ${{ inputs.force_all && '--force-all' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && '--allow-backwards' || '' }}

      # Bundle every Worker before anything is built, let alone shipped.
      #
      # `--dry-run` needs no credential and takes seconds, so a Worker SCRIPT
      # that will not bundle fails the run here, before the two long builds
      # spend twenty minutes producing artifacts nothing can ship.
      - name: Bundle every Worker before building anything
        if: steps.surfaces.outputs.stale != 'true'
        run: |
          set -euo pipefail
          # itun's Worker declares `assets.directory: ./dist`, and wrangler
          # refuses to bundle when that directory is missing — which it is here,
          # because nothing has been built yet.
          #
          # That combination once broke every deploy: `✘ The directory specified
          # by the "assets.directory" field in your configuration file does not
          # exist`. The guard was added ahead of the build it depends on, so it
          # failed closed on a healthy tree — at the one moment nobody was
          # reading deploy logs, because CI on the PR had been green.
          #
          # An empty placeholder is the right shape rather than a workaround.
          # What this step exists to catch is a Worker SCRIPT that will not
          # bundle; the static assets are the separate artifact `build-itun`
          # produces. This job's workspace is discarded, so the placeholder
          # never reaches production.
          mkdir -p apps/itun/dist
          for app in su-assets itun discord-bot; do
            echo "--- bundling $app"
            bun --filter "$app" worker:bundle --outdir "/tmp/predeploy-$app"
          done
          echo "All Worker bundles produced. srd declares no main (Static Assets only)."

      # ---------------------------------------------------------------------
      # The guards. Before anything is built.
      # ---------------------------------------------------------------------
      #
      # An absent CONVEX_DEPLOY_KEY must be fatal, loudly, before any artifact
      # exists, for a measured reason: production ran a four-day
      # stale backend from 2026-08-06 to 2026-08-10 because an absent key
      # silently took a Solo-build branch. The site served the current commit,
      # the backend was four days behind, every soft-link write failed, and
      # nothing was red.
      #
      # A deploy that cannot push the backend must not ship the client that
      # expects it.
      - name: Refuse to deploy without a Convex deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "FATAL: production deploy with no CONVEX_DEPLOY_KEY." >&2
            echo "Refusing to ship a Solo client against an un-pushed Convex backend." >&2
            echo "Set it in Settings > Environments > production > Environment secrets." >&2
            exit 1
          fi

      - name: Refuse to deploy without a Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: no CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      # A DSN gets events to Sentry; source maps make them readable. Both apps'
      # Vite builds take `sentrySourcemaps()` from
      # `packages/observability/src/vite.ts`, which gates BOTH the plugin and
      # `build.sourcemap` on `SENTRY_AUTH_TOKEN`, so with the secret absent the
      # build silently emits no maps and every production event is a minified
      # stack. It FAILS rather than warns, in line with ADR-033 §7.
      - name: Refuse to build a browser app with no Sentry source-map upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "FATAL: SENTRY_AUTH_TOKEN is not set — itun and srd would ship with no source maps," >&2
            echo "       making every production Sentry event a minified stack." >&2
            echo "Set it in Settings > Environments > production > Environment secrets." >&2
            exit 1
          fi

  # ===========================================================================
  # Builds — one job per surface that has one, in parallel. Each uploads the
  # exact `dist` it produced; its deploy job ships that artifact, unrebuilt.
  # ===========================================================================
  #
  # su-assets and the bot have no build: wrangler bundles their Worker source
  # at deploy time, and `plan` has already proved both bundles.

  # srd — static. Its OG images are `og-srd`'s job, below.
  build-srd:
    needs: plan
    if: needs.plan.outputs.stale != 'true' && needs.plan.outputs.srd == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          # The changelog page is `main`'s history (ADR-041); a shallow clone
          # would render one commit of it.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build srd
        env:
          VITE_COMMIT_REF: ${{ needs.plan.outputs.sha }}
          VITE_SENTRY_DSN: ${{ env.SRD_SENTRY_DSN }}
          # Source-map upload (packages/observability/src/vite.ts). SENTRY_ORG
          # is the workflow env above; a project slug is public, like the org.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: srd
        run: bun --filter srd build

      # `import.meta.env` is inlined at build, so a bundle with no EU DSN in it
      # had the SDK tree-shaken out and would ship blind.
      - name: Refuse an srd bundle with no inlined Sentry DSN
        run: |
          if ! grep -rqE --include='*.js' 'https://[0-9a-f]{16,}@[a-z0-9.-]+\.ingest\.de\.sentry\.io/' apps/srd/dist; then
            echo "FATAL: no EU Sentry DSN is inlined in apps/srd/dist — srd would ship with error tracking off." >&2
            exit 1
          fi

      # `include-hidden-files`: the artifact is what ships, byte for byte, so
      # it must not silently drop a dotfile the build emitted.
      - name: Upload the srd build
        uses: actions/upload-artifact@v7
        with:
          name: srd-build
          path: apps/srd/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # srd's OG images, rendered into build-srd's `dist` and re-uploaded as the
  # artifact `deploy-srd` ships. The render never fails (a missing browser or a
  # wedged page keeps the default og:image), so nothing but `deploy-srd` waits.
  og-srd:
    needs: [plan, build-srd]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The same key as ci.yml's, so either workflow's save serves both.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bun --filter srd og:install-browser

      # The script re-renders only entities whose data changed since the cached
      # manifest; it cannot see a rendering change. So the key's first half
      # hashes everything that renders a card, and only a cache from an
      # identical renderer is restored.
      - name: Key the OG cache
        id: og-key
        env:
          RENDER: >-
            ${{ hashFiles('bun.lock', 'packages/component-lib/src/**',
            'packages/component-lib/public/**', 'packages/salvageunion-reference/lib/**',
            'packages/salvageunion-reference/schemas/**', 'apps/srd/src/**', 'apps/srd/ssg/**',
            'apps/srd/scripts/**', 'apps/srd/public/**') }}
          DATA: ${{ hashFiles('packages/salvageunion-reference/data/**') }}
        run: |
          echo "render=$RENDER" >> "$GITHUB_OUTPUT"
          echo "data=$DATA" >> "$GITHUB_OUTPUT"

      - name: Cache the OG renders
        uses: actions/cache@v6
        with:
          path: apps/srd/node_modules/.cache/srd-og
          key: srd-og-${{ steps.og-key.outputs.render }}-${{ steps.og-key.outputs.data }}
          restore-keys: srd-og-${{ steps.og-key.outputs.render }}-

      - name: Download the srd build
        uses: actions/download-artifact@v8
        with:
          name: srd-build
          path: apps/srd/dist

      - name: Render srd OG images
        working-directory: apps/srd
        env:
          OG_SCREENSHOTS: '1'
          OG_SCREENSHOTS_BUDGET_MS: '300000'
        run: bun scripts/og-screenshots.ts

      - name: Upload the srd artifact
        uses: actions/upload-artifact@v7
        with:
          name: srd-dist
          path: apps/srd/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # itun — builds against the production Convex URL. Pushes nothing.
  build-itun:
    needs: plan
    if: needs.plan.outputs.stale != 'true' && needs.plan.outputs.itun == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          # The changelog page is `main`'s history (ADR-041); a shallow clone
          # would render one commit of it.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The backend is NOT pushed here. `convex deploy --cmd` runs the command
      # first and pushes after it, so a push in this job would be stopped only
      # by itun's own build — a failed srd build would still leave the new
      # backend live under the old client until the next green deploy. That
      # is unsafe whenever a commit removes a public function together with
      # its last call site: the old client still calls it. So this job only
      # builds, and `push-convex` pushes once every build is green.
      - name: Build itun
        working-directory: apps/itun
        env:
          VITE_CONVEX_URL: ${{ env.ITUN_CONVEX_URL }}
          VITE_COMMIT_REF: ${{ needs.plan.outputs.sha }}
          VITE_BUILD_STAMP: ${{ needs.plan.outputs.stamp }}
          VITE_SENTRY_DSN: ${{ env.ITUN_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: itun
        run: bun run build

      # `import.meta.env` is inlined at build, so a bundle with no EU DSN in it
      # had the SDK tree-shaken out and would ship blind.
      - name: Refuse an itun bundle with no inlined Sentry DSN
        run: |
          if ! grep -rqE --include='*.js' 'https://[0-9a-f]{16,}@[a-z0-9.-]+\.ingest\.de\.sentry\.io/' apps/itun/dist; then
            echo "FATAL: no EU Sentry DSN is inlined in apps/itun/dist — itun would ship with error tracking off." >&2
            exit 1
          fi

      - name: Upload the itun artifact
        uses: actions/upload-artifact@v7
        with:
          name: itun-dist
          path: apps/itun/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # The Convex push — after EVERY build is green, before ANY surface ships.
  # ===========================================================================
  #
  # Order is the whole point. The backend must never be BEHIND the served
  # client (that is what broke players in 2026-08), so it is pushed before
  # `deploy-itun` can run. And it must not be pushed by a run that ends up
  # shipping nothing, so it waits for both builds — an srd build failure now
  # stops the push exactly as it stops every deploy. Between this job and
  # `deploy-itun` the backend leads the served client for a minute or two,
  # which the backend must tolerate anyway: every open tab keeps running the
  # previous client for as long as it stays open.
  #
  # `--cmd` runs BEFORE the push, with the canonical URL for the deploy key in
  # CANONICAL_CONVEX_URL, so it is used as a guard: if production has moved
  # to a deployment other than the one `build-itun` compiled against, the
  # command fails, `convex deploy` stops before pushing, and nothing ships.
  push-convex:
    needs: [plan, build-srd, build-itun]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.stale != 'true' && needs.plan.outputs.itun == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The build floor (apps/itun/convex/buildFloor.ts): the same commit time
      # `build-itun` stamped into the bundle. Written into the pushed functions
      # rather than set as a deployment variable so it moves atomically with
      # them: a push that removes a function an older client still calls also
      # tells that client, through its `build.floor` subscription, to stop
      # writing and reload once `deploy-itun` serves the new shell.
      - name: Write the build floor
        working-directory: apps/itun
        env:
          BUILD_STAMP: ${{ needs.plan.outputs.stamp }}
        run: |
          case "$BUILD_STAMP" in
            '' | *[!0-9]*) echo "FATAL: plan reported no usable build stamp (got '$BUILD_STAMP')." >&2; exit 1 ;;
          esac
          echo "export const BUILD_FLOOR = $BUILD_STAMP" > convex/buildFloor.ts

      - name: Push Convex (after confirming the URL itun was built against)
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          # Run by `convex deploy` itself, in its own shell, with
          # CANONICAL_CONVEX_URL set — so it lives here as data rather than as
          # a quoted string the step's shell would have to leave unexpanded.
          URL_GUARD: >-
            [ "$CANONICAL_CONVEX_URL" = "$ITUN_CONVEX_URL" ] || {
            echo "FATAL: the deploy key resolves to $CANONICAL_CONVEX_URL but itun was built
            against $ITUN_CONVEX_URL. Update ITUN_CONVEX_URL in deploy-cloudflare.yml and
            docs/ARCHITECTURE.md." >&2; exit 1; }
        run: bunx convex deploy --cmd-url-env-var-name CANONICAL_CONVEX_URL --cmd "$URL_GUARD"

  # ===========================================================================
  # Deploys — one job per surface, in parallel, after EVERY build is green and
  # the backend push (if itun ships) succeeded.
  # ===========================================================================
  #
  # Each deploy job `needs` both build jobs and the push, not just its own:
  # a failed itun build must stop srd shipping too, or the run leaves
  # production half on the new commit. A job that was SKIPPED (its surface did
  # not change) is not a failure, which is why these use `!cancelled() &&
  # !failure()` rather than the implicit `success()` — the implicit form checks
  # every ancestor and would skip every deploy whenever any surface was
  # unchanged.
  #
  # wrangler is one root devDependency, so every `bun run deploy` below runs
  # the version bun.lock resolved — audited and behind the 3-day release-age
  # gate — rather than a `bunx wrangler@x.y.z` fetched outside the lockfile.
  # Bumping it moves all four together; keep `compatibility_date` in the four
  # wrangler.jsonc files at or below the workerd it bundles.
  #
  # The three scripted Workers (su-assets, itun, discord-bot) deploy with
  # `--var SENTRY_RELEASE:<sha>`: @sentry/cloudflare reads it from env as the
  # release, so Worker events carry the same SHA as the browser bundles and
  # their sourcemaps. srd is assets-only and runs no Worker code.

  # su-assets — no build step; the Worker is its own source.
  deploy-su-assets:
    needs: [plan, build-srd, build-itun, push-convex]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.stale != 'true' && needs.plan.outputs.assets == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Deploy su-assets
        working-directory: apps/su-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        run: bun run deploy -- --var "SENTRY_RELEASE:$DEPLOYED_SHA"

  deploy-srd:
    needs: [plan, build-srd, build-itun, push-convex, og-srd]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.stale != 'true' && needs.plan.outputs.srd == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download the srd artifact
        uses: actions/download-artifact@v8
        with:
          name: srd-dist
          path: apps/srd/dist

      - name: Deploy srd
        working-directory: apps/srd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

  deploy-itun:
    needs: [plan, build-srd, build-itun, push-convex]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.stale != 'true' && needs.plan.outputs.itun == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The Worker script is bundled by wrangler from this checkout; the static
      # assets it serves are the artifact `build-itun` compiled against the
      # backend `push-convex` pushed.
      - name: Download the itun artifact
        uses: actions/download-artifact@v8
        with:
          name: itun-dist
          path: apps/itun/dist

      - name: Deploy itun
        working-directory: apps/itun
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        run: bun run deploy -- --var "SENTRY_RELEASE:$DEPLOYED_SHA"

  # discord-bot
  #
  # Discord's Interactions Endpoint URL points at this Worker, so every merge
  # that touches the bot ships it here; there is no other deploy path.
  #
  # No build step — wrangler bundles `src/http/worker.ts` directly.
  #
  # Secrets (DISCORD_TOKEN and friends) are wrangler secrets set out of band
  # and are NOT touched by a deploy, so this cannot clobber them.
  deploy-discord-bot:
    needs: [plan, build-srd, build-itun, push-convex]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.stale != 'true' && needs.plan.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Deploy discord-bot
        working-directory: apps/discord-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        run: bun run deploy -- --var "SENTRY_RELEASE:$DEPLOYED_SHA"

  # ===========================================================================
  # Post-deploy smoke. Cheap, and it is the only thing that knows whether what
  # shipped actually answers.
  # ===========================================================================
  #
  # Deliberately includes the rotated-chunk 404: `not_found_handling` is one
  # line of config away from silently reintroducing #759, where a missing
  # hashed chunk answered `200 text/html` and the `immutable` header pinned
  # that HTML into the HTTP cache for a year.
  # The list lives in tools/smoke-production.sh so e2e-nightly.yml can run
  # the same checks on a schedule, catching a regression that happens
  # between deploys (a DNS record, a Redirect Rule, a rotated bot token).
  smoke:
    needs: [plan, deploy-su-assets, deploy-srd, deploy-itun, deploy-discord-bot]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # From the WORKFLOW's commit, not the deployed tree. A rollback dispatch
      # deploys an older `sha` that may predate the script; running it from
      # that tree would exit 127 AFTER the deploy, skip `record`, and leave
      # `deployed/cloudflare` naming a commit production no longer serves.
      # The script needs nothing but curl, so only it is checked out.
      - name: Checkout the smoke list
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/smoke-production.sh
          sparse-checkout-cone-mode: false

      - name: Smoke the deployed surfaces
        run: bash tools/smoke-production.sh

  # ---------------------------------------------------------------------------
  # The deploy record — what the next run diffs against.
  # ---------------------------------------------------------------------------
  #
  # Moves the lightweight tag `deployed/cloudflare` to the commit that just
  # shipped. Only after every deploy AND the smoke job succeeded: a run that
  # failed anywhere leaves the record where it was, so the next run re-deploys
  # every surface this one may have left half-done.
  #
  # A separate job so that `contents: write` is held by six lines of REST calls
  # and nothing else — never by a job that checks out and runs the tree. If
  # this job fails the deploy itself stands; the next run just diffs from an
  # older record and over-deploys, which is the safe direction.
  record:
    needs: [plan, smoke]
    # A stale run (an older merge's deploy re-run after a newer one shipped)
    # shipped nothing, and moving the record to it would make the NEXT run diff
    # from the older commit. Only a dispatch may move the record backwards.
    #
    # The explicit status functions are load-bearing. A bare `if:` gets an
    # implicit `success()`, which at job level checks EVERY ancestor — and a
    # skipped build-*/deploy-* job (an unchanged surface) makes it false. The
    # record then moved only when all four surfaces shipped, so a newer
    # srd-only deploy left it behind, and an older commit's later run was
    # not "stale" and shipped its srd over the newer one: a silent
    # rollback with every job green. `smoke` must have actually passed.
    if: ${{ !cancelled() && !failure() && needs.smoke.result == 'success' && needs.plan.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the deployed/cloudflare tag to the deployed commit
        uses: actions/github-script@v9
        env:
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const sha = process.env.DEPLOYED_SHA ?? ''
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`plan job reported no usable commit sha (got '${sha}')`)
              return
            }
            const { owner, repo } = context.repo
            const ref = 'tags/deployed/cloudflare'
            try {
              // force: a rollback DISPATCH legitimately moves the record
              // BACKWARDS. A push never reaches here going backwards:
              // deploy-surfaces marks that run stale and this job is skipped.
              await github.rest.git.updateRef({ owner, repo, ref, sha, force: true })
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha })
            }
            core.info(`deployed/cloudflare -> ${sha}`)
