name: Deploy (Cloudflare)

# Builds and deploys the three web surfaces to Cloudflare Workers (ADR-033).
#
# WHY THE BUILD RUNS HERE AND NOT IN WORKERS BUILDS (ADR-033 §4). srd's build
# provisions a headless Chromium to render ~850 per-entity OG images, which is a
# poor fit for Cloudflare's build environment. Rather than split the build across
# two systems — one surface here, two there — all three build in Actions and
# deploy with `wrangler`. One build path, one place path-filtering lives, and the
# existing CI gates sit in front of every deploy.
#
# THE GATE IS NOT DECORATIVE. `workflow_run` fires on the CI workflow's
# COMPLETION, not its success, so `conclusion == 'success'` is checked
# explicitly. Without it a red CI run would deploy — which is the opposite of
# what putting CI in front is for.
#
# `tools/check-convex-parity.ts` asserts this file still refuses a production
# deploy with no CONVEX_DEPLOY_KEY. It named this path before the file existed,
# deliberately, so there was never a window in which nothing asserted the
# property. Do not rename this file without updating that tool.

on:
  # zizmor: ignore[dangerous-triggers] — the job-level `if:` below is the
  # mitigation zizmor asks for: it requires a same-repo `push` to `main`, so a
  # fork or PR run can never reach the checkout or the credentials.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual re-deploy, for when a deploy fails on something unrelated to the code
  # (a Cloudflare incident, a rotated token) and the commit is already green.
  #
  # `sha` is the ROLLBACK PATH, and it exists because there was none: dispatch
  # took no inputs and checked out `github.sha`, so recovering from a bad deploy
  # meant a revert PR through full CI — five minutes at best, and it re-runs all
  # four deploys anyway. Now: dispatch with the last known-good commit.
  #
  # Validated as an ancestor of `main` before anything is built (see the guard
  # below), so this cannot become the "any branch straight to production" hole
  # the `github.ref` clause was added to close.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (must be an ancestor of main). Defaults to the tip of main.'
        required: false
        type: string
      # Ignore the last-deploy record and ship every surface. For recovering
      # from something the diff cannot see: a surface changed out of band in
      # the Cloudflare dashboard, or a record that is suspected to be wrong.
      force_all:
        description: 'Deploy every surface, ignoring what changed since the last recorded deploy.'
        required: false
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a half-uploaded asset
# manifest is worse than a queued deploy.
#
# GitHub keeps at most ONE pending run per group, so when three CI runs finish
# close together the middle deploy is dropped from the queue. That is safe ONLY
# because the deploy set below is computed against the last RECORDED deploy,
# not against `HEAD^`: the run that survives diffs across every commit the
# dropped run would have shipped. Diffing `HEAD^..HEAD` here would silently
# skip any surface touched only by the dropped commit (CI-01).
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # `workflow_run` gives us the triggering run's conclusion; a manual dispatch
    # has no triggering run, so it is allowed through on its own.
    #
    # The `github.ref` clause is what stops that from being a hole. A dispatch
    # checks out `github.sha` — the tip of WHATEVER ref was selected — and every
    # branch cut from main carries this file, so without it any branch could be
    # dispatched straight to production with no CI having passed. It needs repo
    # write access, so this was a footgun rather than an external threat, but it
    # is precisely the "green gate suffices" assumption in decision D3 being
    # bypassed rather than satisfied.
    #
    # THE `workflow_run` HALF NEEDS THE SAME TREATMENT, AND FOR A WORSE REASON.
    # `branches: [main]` on the trigger reads like a provenance check and is not
    # one: it matches the TRIGGERING run's `head_branch`, which for a PR is the
    # unqualified head ref — the fork's own branch name. A fork branch named
    # `main` satisfies it. Nothing else in the old expression looked at where the
    # code came from, and the step below is `uses: ./.github/actions/setup-bun`
    # — a composite action read FROM THE CHECKED-OUT TREE — which runs
    # `bun install` against that tree's `package.json` before any secret step.
    # That is arbitrary code execution ahead of CLOUDFLARE_API_TOKEN,
    # CONVEX_DEPLOY_KEY and SENTRY_AUTH_TOKEN. The four "refuse to deploy
    # without…" guards below check that a credential is PRESENT, never where the
    # code asking for it came from.
    #
    # This is GitHub's documented pwn-request shape (see their `secure-use`
    # guidance on `workflow_run` + untrusted checkout). The repo is public and
    # forkable, so the only thing standing in front of it was the default
    # first-time-contributor approval prompt — which a maintainer clicks to SEE
    # CI, not to authorise a production deploy.
    #
    # `head_repository.full_name` is the provenance check. `event == 'push'` is
    # the second half: CI runs on both `push` (main only) and `pull_request`, so
    # without it a same-repo branch PR would still qualify. Deploys should follow
    # pushes to main and nothing else.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      # `true` when HEAD is older than the recorded deploy on a `workflow_run`
      # — a newer commit's CI finished first and already shipped. The `record`
      # job must not move the tag back in that case.
      stale: ${{ steps.surfaces.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing in this job pushes, and the tree it checks out runs
          # `bun install` before any secret step — so no token is left in
          # .git/config for that code to find.
          persist-credentials: false
          # workflow_run checks out the DEFAULT branch by default, not the commit
          # that was tested. Deploying a different commit than the one CI passed
          # would make the gate meaningless.
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          # Ancestry cannot be checked in a shallow clone, and the deploy-set
          # diff below needs the last deployed commit.
          fetch-depth: 0

      # The ONE place the deployed commit is named. The build steps stamp it
      # into both apps and the `record` job writes it to the deploy record, so
      # a dispatched `sha` is reported as itself rather than as the tip of
      # main — which is what `head_sha || github.sha` used to report for it.
      - name: Resolve the commit being deployed
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # A dispatched `sha` must be an ancestor of main. Without this the input
      # would reintroduce exactly what the `github.ref == 'refs/heads/main'`
      # clause exists to prevent: an arbitrary commit, with no CI having passed,
      # deployed straight to production by anyone with write access.
      - name: The dispatched commit must be an ancestor of main
        if: inputs.sha != ''
        # Through `env:`, never `${{ }}` inside the script: an expression is
        # spliced into the shell source before bash parses it, so a crafted
        # input would run as code in the job that holds the deploy secrets.
        env:
          DISPATCHED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$DISPATCHED_SHA" origin/main; then
            echo "FATAL: $DISPATCHED_SHA is not an ancestor of origin/main." >&2
            echo "Only a commit that has been on main — and therefore through CI — may be deployed." >&2
            exit 1
          fi
          echo "OK: $DISPATCHED_SHA is on main."

      # Which surfaces differ from what is live.
      #
      # ci.yml path-filters every heavy job; without this, a docs-only merge
      # still installed Chromium, rendered ~2,000 OG images and ran four
      # `wrangler deploy`s.
      #
      # The base is the LAST SUCCESSFUL DEPLOY — the `deployed/cloudflare` tag
      # that the `record` job below moves after every green run — never
      # `HEAD^`, which silently skipped any surface touched only by a commit
      # whose deploy never ran (audit CI-01). The logic, its reasoning and its
      # tests live in tools/deploy-surfaces.ts; it fails SAFE (no record, a
      # shared path or `force_all` deploys everything).
      #
      # It also refuses to go BACKWARDS on a `workflow_run`. ci.yml runs every
      # commit on main to completion, so an older commit's CI can finish after
      # a newer one has already deployed; diffing newer->older would ship the
      # older tree over the newer one. Such a run is `stale`: nothing deploys
      # and the record stays put. Only a dispatch (the rollback path) passes
      # `--allow-backwards`.
      - name: Decide which surfaces to deploy
        id: surfaces
        run: >-
          bun tools/deploy-surfaces.ts
          ${{ inputs.force_all && '--force-all' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && '--allow-backwards' || '' }}

      # Bundle ALL FOUR before ANY of them ships.
      #
      # The four deploys are sequential with no compensating action, so a
      # bundling failure on the third left the first two on the new commit and
      # the last two on the old — a partial deploy nobody chose. Producing every
      # bundle first turns that class of failure into an abort before any
      # traffic moves, which is the property `wrangler versions upload` would
      # buy, without changing how deployment itself works.
      #
      # `--dry-run` needs no credential, so this also runs before the credential
      # guards below have any effect.
      - name: Bundle every Worker before deploying any
        if: steps.surfaces.outputs.stale != 'true'
        run: |
          set -euo pipefail
          # itun's Worker declares `assets.directory: ./dist`, and wrangler
          # refuses to bundle when that directory is missing — which it is here,
          # because this step deliberately runs BEFORE anything is built.
          #
          # That combination broke every deploy between this step landing and
          # this line: `✘ The directory specified by the "assets.directory"
          # field in your configuration file does not exist`. The guard was
          # added ahead of the build it depends on, so it failed closed on a
          # healthy tree — and it failed at the one moment nobody was reading
          # deploy logs, because CI on the PR had been green.
          #
          # An empty placeholder is the right shape rather than a workaround.
          # What this step exists to catch is a Worker SCRIPT that will not
          # bundle; the static assets are a separate artifact that `Push Convex
          # and build itun` produces and `Deploy itun` uploads, and they are not
          # part of the bundle being validated. Building the app here to satisfy
          # a config check would cost the whole build twice and defeat the point
          # of a cheap pre-flight.
          #
          # The real build writes into this directory later, so the placeholder
          # never reaches production.
          mkdir -p apps/itun/dist
          for app in su-assets itun discord-bot; do
            echo "--- bundling $app"
            bun --filter "$app" worker:bundle --outdir "/tmp/predeploy-$app"
          done
          echo "All Worker bundles produced. srd declares no main (Static Assets only)."

      # ---------------------------------------------------------------------
      # The guard. FIRST, before anything is built.
      # ---------------------------------------------------------------------
      #
      # An absent CONVEX_DEPLOY_KEY must be fatal, loudly, before any artifact
      # exists, for a measured reason: production ran a four-day
      # stale backend from 2026-08-06 to 2026-08-10 because an absent key
      # silently took a Solo-build branch. The site served the current commit,
      # the backend was four days behind, every soft-link write failed, and
      # nothing was red.
      #
      # A deploy that cannot push the backend must not ship the client that
      # expects it.
      - name: Refuse to deploy without a Convex deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "FATAL: production deploy with no CONVEX_DEPLOY_KEY." >&2
            echo "Refusing to ship a Solo client against an un-pushed Convex backend." >&2
            echo "Set it in Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Refuse to deploy without a Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: no CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      # Sentry is env-gated at BUILD time: with no DSN the guard folds to false,
      # Vite tree-shakes the SDK out entirely, and the app looks *identical* to a
      # working one while reporting zero errors. `check-observability.ts` exists
      # because both apps once sat in production that way.
      #
      # They are repository VARIABLES rather than secrets on purpose: a DSN is
      # public by construction, sitting in a bundle anyone can download. Storing
      # a public value as a secret hides which values genuinely need protecting.
      #
      # Both apps read `VITE_SENTRY_DSN` at build time, but they report to
      # different Sentry projects, so srd's DSN lives in its own repository
      # variable, `SRD_SENTRY_DSN`. `PUBLIC_SENTRY_DSN` is the variable's former
      # name (srd's old Astro-era env prefix) and is read only as a fallback until
      # the variable is renamed in the repository settings; drop the `||` then.
      - name: Refuse to build a browser app with no Sentry DSN
        env:
          SRD_SENTRY_DSN: ${{ vars.SRD_SENTRY_DSN || vars.PUBLIC_SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          missing=0
          if [ -z "$SRD_SENTRY_DSN" ]; then
            echo "FATAL: SRD_SENTRY_DSN is not set — srd would ship with error tracking silently off." >&2
            missing=1
          fi
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "FATAL: VITE_SENTRY_DSN is not set — itun would ship with error tracking silently off." >&2
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Set them in Settings > Secrets and variables > Actions > Variables." >&2
            exit 1
          fi

      # The OTHER half of Sentry, and it was missing for the whole cutover.
      #
      # A DSN gets events to Sentry. Source maps make them readable. Both browser
      # apps ship a minified bundle, so without an upload every production issue
      # is a stack of mangled frames pointing at `assets/<entry>-<hash>.js` — an
      # event that exists, is counted, and cannot be acted on.
      #
      # `apps/itun/vite.config.ts` and `apps/srd/ssg/vite.config.ts` gate BOTH
      # the plugin and `build.sourcemap` on `SENTRY_AUTH_TOKEN`, so with the
      # secret absent the build silently emits no maps and uploads nothing. The
      # itun build step passes all three variables and they resolved to empty on
      # every deploy since P7: the repository has exactly four secrets and none
      # of them is a Sentry one. srd had no upload at all until the 2026-09-25
      # audit (AP-20); it now takes the same token and org.
      #
      # It FAILS rather than warns, deliberately and in line with ADR-033 §7. A
      # warning is what the previous state effectively was, and it went unread
      # for the length of the cutover.
      - name: Refuse to build a browser app with no Sentry source-map upload
        env:
          # ONE secret and TWO variables, split the same way the DSNs above are
          # and for the same stated reason: storing a public value as a secret
          # hides which values genuinely need protecting.
          #
          #   SENTRY_ORG / SENTRY_PROJECT  slugs. They appear in every Sentry URL
          #                                for this project and in the committed
          #                                docs. Variables.
          #   SENTRY_AUTH_TOKEN            can write to the org. Secret.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          missing=0
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "FATAL: $name is not set — itun and srd would ship with no source maps," >&2
              echo "       making every production Sentry event a minified stack." >&2
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Settings > Secrets and variables > Actions:" >&2
            echo "  SENTRY_AUTH_TOKEN -> Secrets (it can write to the Sentry org)" >&2
            echo "  SENTRY_ORG, SENTRY_PROJECT -> Variables (public slugs)" >&2
            exit 1
          fi

      # ---------------------------------------------------------------------
      # su-assets — no build step; the Worker is its own source.
      # ---------------------------------------------------------------------
      # wrangler is a catalogued devDependency of all four Worker apps, so every
      # `bun run deploy` below runs the version bun.lock resolved — audited,
      # behind the 3-day release-age gate and bumped by the catalog updater —
      # rather than a `bunx wrangler@x.y.z` fetched outside the lockfile.
      # Bumping it moves all four together; keep `compatibility_date` in the
      # four wrangler.jsonc files at or below the workerd it bundles.
      - name: Deploy su-assets
        if: steps.surfaces.outputs.assets == 'true'
        working-directory: apps/su-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      # ---------------------------------------------------------------------
      # srd — static, but the OG pass needs a browser.
      # ---------------------------------------------------------------------
      #
      # The OG screenshot pass never fails the build: a missing browser or a
      # wedged render logs and leaves those pages on the default og:image,
      # capped by OG_SCREENSHOTS_BUDGET_MS. The worst case is "some previews are
      # generic", never a failed deploy. `og:generate` (build + screenshots in
      # one script) is deliberately NOT used here — see the steps below.
      - name: Install Chromium for the srd OG pass
        if: steps.surfaces.outputs.srd == 'true'
        run: bun --filter srd og:install-browser

      # Build and OG pass are separate steps rather than one `og:generate`, so
      # each carries only its own environment: the build takes the commit ref and
      # the Sentry DSN, the screenshot pass takes its budget. It also keeps the
      # best-effort half independently skippable from the half that must succeed.
      - name: Build srd
        if: steps.surfaces.outputs.srd == 'true'
        env:
          VITE_COMMIT_REF: ${{ steps.target.outputs.sha }}
          VITE_SENTRY_DSN: ${{ vars.SRD_SENTRY_DSN || vars.PUBLIC_SENTRY_DSN }}
          # ROLLBACK SHIM — remove once `deployed/cloudflare` is past the commit
          # that renamed srd's env prefix. A `sha` dispatch runs THIS workflow
          # file against an OLDER tree, and srd before the rename read
          # `import.meta.env.PUBLIC_*` under `envPrefix: 'PUBLIC_'`; with only
          # the VITE_ names set, a rollback would inline the DSN as `undefined`
          # and ship srd with Sentry tree-shaken out while the DSN guard above
          # still passed. The current tree has the default `VITE_` prefix, so
          # these are never exposed to its bundle.
          PUBLIC_COMMIT_REF: ${{ steps.target.outputs.sha }}
          PUBLIC_SENTRY_DSN: ${{ vars.SRD_SENTRY_DSN || vars.PUBLIC_SENTRY_DSN }}
          # Source-map upload (apps/srd/ssg/vite.config.ts). Same token and org
          # as itun; the PROJECT is srd's own, and is written literally rather
          # than read from `vars.SENTRY_PROJECT`, which names itun's. A project
          # slug is public (it is in every Sentry URL and in
          # docs/architecture/agent-tooling.md), so it needs no variable.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: srd
        run: bun --filter srd build

      # The srd output snapshot is deliberately NOT re-run here, and the reason
      # is that it cannot pass in this job — not that it is inconvenient.
      #
      # The snapshot is blessed against a build with NO Sentry DSN, which is what
      # `bun run gate` produces locally and what CI's `build-srd` job runs on
      # every PR. This job builds WITH srd's `VITE_SENTRY_DSN`, because production
      # must ship Sentry. Measured — the DSN changes the emitted chunk set:
      #
      #   with a DSN:     assets/prod-[hash].js, assets/rolldown-runtime-[hash].js
      #   without a DSN:  assets/preload-helper-[hash].js
      #
      # and the snapshot asserts the emitted file set in both directions, so it
      # failed on exactly those three paths with the page content identical.
      #
      # Neither repair works. Blessing the DSN build breaks `build-srd` and every
      # contributor's local `bun run gate`, since nobody outside Actions has the
      # DSN. Dropping the DSN here reintroduces the silent Sentry-less production
      # build this workflow was fixed to prevent.
      #
      # So the gate stays where its precondition holds — CI, on every PR — and
      # this job verifies the DEPLOYED artifact instead, via the smoke step at
      # the end. That is the honest division: a content gate on the reproducible
      # build, a behaviour check on the thing actually serving.
      #
      # If you are tempted to re-add it, there is a second trap waiting: it must
      # also run BEFORE the OG pass, which emits 2,011 `.og.png` files the
      # snapshot has never contained. That one is not fixable by blessing either
      # — `apps/srd/CLAUDE.md` excludes binary assets on purpose, because their
      # names are content-addressed and digesting them would make the gate churn
      # on every dependency bump until somebody switched it off.

      # Additive and non-fatal by design: a missing browser or a
      # wedged render leaves those pages on the default og:image.
      - name: Render srd OG images
        if: steps.surfaces.outputs.srd == 'true'
        working-directory: apps/srd
        env:
          OG_SCREENSHOTS: '1'
          OG_SCREENSHOTS_BUDGET_MS: '300000'
        run: bun scripts/og-screenshots.ts

      - name: Deploy srd
        if: steps.surfaces.outputs.srd == 'true'
        working-directory: apps/srd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      # ---------------------------------------------------------------------
      # itun — pushes the Convex backend FIRST, then builds against it.
      # ---------------------------------------------------------------------
      #
      # Order is the whole point. `convex deploy --cmd` pushes schema and
      # functions, then runs the build with VITE_CONVEX_URL set to the
      # deployment it just pushed to. A client compiled against a URL whose
      # schema had not been deployed yet would fail at runtime rather than at
      # build time — which is exactly how the 2026-08 incident presented.
      - name: Push Convex and build itun
        if: steps.surfaces.outputs.itun == 'true'
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_COMMIT_REF: ${{ steps.target.outputs.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bunx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd "bun run build"

      - name: Deploy itun
        if: steps.surfaces.outputs.itun == 'true'
        working-directory: apps/itun
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      # ---------------------------------------------------------------------
      # discord-bot
      # ---------------------------------------------------------------------
      #
      # Discord's Interactions Endpoint URL points at this Worker, so every merge
      # that touches the bot ships it here; there is no other deploy path.
      #
      # No build step — wrangler bundles `src/http/worker.ts` directly.
      #
      # Secrets (DISCORD_TOKEN and friends) are wrangler secrets set out of band
      # and are NOT touched by a deploy, so this cannot clobber them.
      - name: Deploy discord-bot
        if: steps.surfaces.outputs.bot == 'true'
        working-directory: apps/discord-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      # ---------------------------------------------------------------------
      # Post-deploy smoke. Cheap, and it is the only thing that knows whether
      # what shipped actually answers.
      # ---------------------------------------------------------------------
      #
      # Deliberately includes the rotated-chunk 404: `not_found_handling` is one
      # line of config away from silently reintroducing #759, where a missing
      # hashed chunk answered `200 text/html` and the `immutable` header pinned
      # that HTML into the HTTP cache for a year.
      # The list lives in tools/smoke-production.sh so e2e-nightly.yml can run
      # the same checks on a schedule, catching a regression that happens
      # between deploys (a DNS record, a Redirect Rule, a rotated bot token).
      #
      # Run from the WORKFLOW's commit, not the checked-out tree. A rollback
      # dispatch checks out an older `sha` that may predate the script; running
      # it from that tree would exit 127 AFTER the deploy, skip `record`, and
      # leave `deployed/cloudflare` naming a commit production no longer serves.
      # `fetch-depth: 0` above means the workflow's commit is already local; the
      # fetch covers a dispatch from a ref the checkout did not include.
      - name: Smoke the deployed surfaces
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:tools/smoke-production.sh" > "$RUNNER_TEMP/smoke-production.sh"
          bash "$RUNNER_TEMP/smoke-production.sh"

  # ---------------------------------------------------------------------------
  # The deploy record — what the next run diffs against.
  # ---------------------------------------------------------------------------
  #
  # Moves the lightweight tag `deployed/cloudflare` to the commit that just
  # shipped. Only after `deploy` succeeded, smoke test included: a run that
  # failed anywhere leaves the record where it was, so the next run re-deploys
  # every surface this one may have left half-done.
  #
  # A separate job so that `contents: write` is held by six lines of REST calls
  # and nothing else — never by the job that checks out and runs the tree. If
  # this job fails the deploy itself stands; the next run just diffs from an
  # older record and over-deploys, which is the safe direction.
  record:
    needs: deploy
    # A stale run (an older commit whose CI finished after a newer deploy)
    # shipped nothing, and moving the record to it would make the NEXT run diff
    # from the older commit. Only a dispatch may move the record backwards.
    if: needs.deploy.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the deployed/cloudflare tag to the deployed commit
        uses: actions/github-script@v9
        env:
          DEPLOYED_SHA: ${{ needs.deploy.outputs.sha }}
        with:
          script: |
            const sha = process.env.DEPLOYED_SHA ?? ''
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`deploy job reported no usable commit sha (got '${sha}')`)
              return
            }
            const { owner, repo } = context.repo
            const ref = 'tags/deployed/cloudflare'
            try {
              // force: a rollback DISPATCH legitimately moves the record
              // BACKWARDS. A `workflow_run` never reaches here going backwards:
              // deploy-surfaces marks that run stale and this job is skipped.
              await github.rest.git.updateRef({ owner, repo, ref, sha, force: true })
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha })
            }
            core.info(`deployed/cloudflare -> ${sha}`)
