name: Deploy (Cloudflare)

# Builds and deploys the three web surfaces to Cloudflare Workers (ADR-033).
#
# WHY THE BUILD RUNS HERE AND NOT IN WORKERS BUILDS (ADR-033 §4). srd's build
# provisions a headless Chromium to render ~850 per-entity OG images, which is a
# poor fit for Cloudflare's build environment. Rather than split the build across
# two systems — one surface here, two there — all three build in Actions and
# deploy with `wrangler`. One build path, one place path-filtering lives, and the
# existing CI gates sit in front of every deploy.
#
# THE GATE IS NOT DECORATIVE. `workflow_run` fires on the CI workflow's
# COMPLETION, not its success, so `conclusion == 'success'` is checked
# explicitly. Without it a red CI run would deploy — which is the opposite of
# what putting CI in front is for.
#
# `tools/check-convex-parity.ts` asserts this file still refuses a production
# deploy with no CONVEX_DEPLOY_KEY. It named this path before the file existed,
# deliberately, so there was never a window in which nothing asserted the
# property. Do not rename this file without updating that tool.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual re-deploy, for when a deploy fails on something unrelated to the code
  # (a Cloudflare incident, a rotated token) and the commit is already green.
  workflow_dispatch:

# One deploy at a time, and never cancel one in flight: a half-uploaded asset
# manifest is worse than a queued deploy.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # `workflow_run` gives us the triggering run's conclusion; a manual dispatch
    # has no triggering run, so it is allowed through on its own.
    #
    # The `github.ref` clause is what stops that from being a hole. A dispatch
    # checks out `github.sha` — the tip of WHATEVER ref was selected — and every
    # branch cut from main carries this file, so without it any branch could be
    # dispatched straight to production with no CI having passed. It needs repo
    # write access, so this was a footgun rather than an external threat, but it
    # is precisely the "green gate suffices" assumption in decision D3 being
    # bypassed rather than satisfied.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run checks out the DEFAULT branch by default, not the commit
          # that was tested. Deploying a different commit than the one CI passed
          # would make the gate meaningless.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # ---------------------------------------------------------------------
      # The guard. FIRST, before anything is built.
      # ---------------------------------------------------------------------
      #
      # An absent CONVEX_DEPLOY_KEY must be fatal, loudly, before any artifact
      # exists. This is the Actions form of the guard `apps/itun/netlify.toml`
      # carried, and it exists for a measured reason: production ran a four-day
      # stale backend from 2026-08-06 to 2026-08-10 because an absent key
      # silently took a Solo-build branch. The site served the current commit,
      # the backend was four days behind, every soft-link write failed, and
      # nothing was red.
      #
      # A deploy that cannot push the backend must not ship the client that
      # expects it.
      - name: Refuse to deploy without a Convex deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "FATAL: production deploy with no CONVEX_DEPLOY_KEY." >&2
            echo "Refusing to ship a Solo client against an un-pushed Convex backend." >&2
            echo "Set it in Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Refuse to deploy without a Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: no CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      # Sentry is env-gated at BUILD time: with no DSN the guard folds to false,
      # Vite tree-shakes the SDK out entirely, and the app looks *identical* to a
      # working one while reporting zero errors. `check-observability.ts` exists
      # because both apps once sat in production that way.
      #
      # Moving the build from Netlify to Actions is exactly when that can happen
      # again, and it nearly did: the DSNs lived as Netlify SITE env vars and are
      # not in this repo, so the first Cloudflare builds shipped with the SDK
      # tree-shaken out. Measured, not guessed — production's bundle carried the
      # DSN and the Workers build carried no Sentry reference at all.
      #
      # They are repository VARIABLES rather than secrets on purpose: a DSN is
      # public by construction, sitting in a bundle anyone can download. Storing
      # a public value as a secret hides which values genuinely need protecting.
      - name: Refuse to build a browser app with no Sentry DSN
        env:
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          missing=0
          if [ -z "$PUBLIC_SENTRY_DSN" ]; then
            echo "FATAL: PUBLIC_SENTRY_DSN is not set — srd would ship with error tracking silently off." >&2
            missing=1
          fi
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "FATAL: VITE_SENTRY_DSN is not set — itun would ship with error tracking silently off." >&2
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Set them in Settings > Secrets and variables > Actions > Variables." >&2
            exit 1
          fi

      # The OTHER half of Sentry, and it was missing for the whole cutover.
      #
      # A DSN gets events to Sentry. Source maps make them readable. itun ships a
      # minified bundle, so without an upload every production issue is a stack
      # of mangled frames pointing at `assets/index-<hash>.js` — an event that
      # exists, is counted, and cannot be acted on.
      #
      # `apps/itun/vite.config.ts` gates BOTH the plugin and `build.sourcemap` on
      # `SENTRY_AUTH_TOKEN`, so with the secret absent the build silently emits
      # no maps and uploads nothing. The step below it passes all three variables
      # and they resolved to empty on every deploy since P7: the repository has
      # exactly four secrets and none of them is a Sentry one.
      #
      # This is a migration regression, not an old gap. Netlify held the build
      # credentials as SITE env vars (the cutover doc says so: "Netlify holds its
      # own build credentials and this repository holds no deploy credentials at
      # all"), and moving builds into Actions ported the deploy half and not this
      # one. The stale "should not fail the Netlify build" comment still sitting
      # in vite.config.ts is the fingerprint.
      #
      # It FAILS rather than warns, deliberately and in line with ADR-033 §7. A
      # warning is what the previous state effectively was, and it went unread
      # for the length of the cutover.
      - name: Refuse to build itun with no Sentry source-map upload
        env:
          # ONE secret and TWO variables, split the same way the DSNs above are
          # and for the same stated reason: storing a public value as a secret
          # hides which values genuinely need protecting.
          #
          #   SENTRY_ORG / SENTRY_PROJECT  slugs. They appear in every Sentry URL
          #                                for this project and in the committed
          #                                docs. Variables.
          #   SENTRY_AUTH_TOKEN            can write to the org. Secret.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          missing=0
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "FATAL: $name is not set — itun would ship with no source maps," >&2
              echo "       making every production Sentry event a minified stack." >&2
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Settings > Secrets and variables > Actions:" >&2
            echo "  SENTRY_AUTH_TOKEN -> Secrets (it can write to the Sentry org)" >&2
            echo "  SENTRY_ORG, SENTRY_PROJECT -> Variables (public slugs)" >&2
            exit 1
          fi

      # ---------------------------------------------------------------------
      # su-assets — no build step; the Worker is its own source.
      # ---------------------------------------------------------------------
      - name: Deploy su-assets
        working-directory: apps/su-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.108.0 deploy

      # ---------------------------------------------------------------------
      # srd — static, but the OG pass needs a browser.
      # ---------------------------------------------------------------------
      #
      # The OG screenshot pass never fails the build: a missing browser or a
      # wedged render logs and leaves those pages on the default og:image,
      # capped by OG_SCREENSHOTS_BUDGET_MS. The worst case is "some previews are
      # generic", never a failed deploy. `og:generate` (build + screenshots in
      # one script) is deliberately NOT used here — see the steps below.
      - name: Install Chromium for the srd OG pass
        run: bun --filter srd og:install-browser

      # Build and OG pass are separate steps rather than one `og:generate`, so
      # each carries only its own environment: the build takes the commit ref and
      # the Sentry DSN, the screenshot pass takes its budget. It also keeps the
      # best-effort half independently skippable from the half that must succeed.
      - name: Build srd
        env:
          PUBLIC_COMMIT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
        run: bun --filter srd build

      # The srd output snapshot is deliberately NOT re-run here, and the reason
      # is that it cannot pass in this job — not that it is inconvenient.
      #
      # The snapshot is blessed against a build with NO Sentry DSN, which is what
      # `bun run gate` produces locally and what CI's `build-srd` job runs on
      # every PR. This job builds WITH `PUBLIC_SENTRY_DSN`, because production
      # must ship Sentry. Measured — the DSN changes the emitted chunk set:
      #
      #   with a DSN:     assets/prod-[hash].js, assets/rolldown-runtime-[hash].js
      #   without a DSN:  assets/preload-helper-[hash].js
      #
      # and the snapshot asserts the emitted file set in both directions, so it
      # failed on exactly those three paths with the page content identical.
      #
      # Neither repair works. Blessing the DSN build breaks `build-srd` and every
      # contributor's local `bun run gate`, since nobody outside Actions has the
      # DSN. Dropping the DSN here reintroduces the silent Sentry-less production
      # build this workflow was fixed to prevent.
      #
      # So the gate stays where its precondition holds — CI, on every PR — and
      # this job verifies the DEPLOYED artifact instead, via the smoke step at
      # the end. That is the honest division: a content gate on the reproducible
      # build, a behaviour check on the thing actually serving.
      #
      # If you are tempted to re-add it, there is a second trap waiting: it must
      # also run BEFORE the OG pass, which emits 2,011 `.og.png` files the
      # snapshot has never contained. That one is not fixable by blessing either
      # — `apps/srd/CLAUDE.md` excludes binary assets on purpose, because their
      # names are content-addressed and digesting them would make the gate churn
      # on every dependency bump until somebody switched it off.

      # Additive and non-fatal by design: a missing browser or a
      # wedged render leaves those pages on the default og:image.
      - name: Render srd OG images
        working-directory: apps/srd
        env:
          OG_SCREENSHOTS: '1'
          OG_SCREENSHOTS_BUDGET_MS: '300000'
        run: bun scripts/og-screenshots.ts

      - name: Deploy srd
        working-directory: apps/srd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.108.0 deploy

      # ---------------------------------------------------------------------
      # itun — pushes the Convex backend FIRST, then builds against it.
      # ---------------------------------------------------------------------
      #
      # Order is the whole point. `convex deploy --cmd` pushes schema and
      # functions, then runs the build with VITE_CONVEX_URL set to the
      # deployment it just pushed to. A client compiled against a URL whose
      # schema had not been deployed yet would fail at runtime rather than at
      # build time — which is exactly how the 2026-08 incident presented.
      - name: Push Convex and build itun
        working-directory: apps/itun
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_COMMIT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bunx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd "bun run build"

      - name: Deploy itun
        working-directory: apps/itun
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.108.0 deploy

      # ---------------------------------------------------------------------
      # discord-bot — the Worker, not the Render gateway process.
      # ---------------------------------------------------------------------
      #
      # Deploying this does NOT move the bot. Discord routes to a Worker only
      # once the Interactions Endpoint URL is set on the application, which is a
      # P7 step done by hand — so this is safe to run on every merge, and has to
      # be, because Render is being retired and this is the only path left.
      #
      # It was deployed by hand during P5, which was fine for a measurement and
      # is not fine as a steady state: a bot whose only deploy path is somebody
      # remembering to run wrangler is a bot that silently stops tracking main.
      #
      # No build step — wrangler bundles `src/http/worker.ts` directly. The
      # `build` script in this workspace targets the Node/gateway entry that
      # Render runs, and that is what goes away, not this.
      #
      # Secrets (DISCORD_TOKEN and friends) are wrangler secrets set out of band
      # and are NOT touched by a deploy, so this cannot clobber them.
      - name: Deploy discord-bot
        working-directory: apps/discord-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.108.0 deploy

      # ---------------------------------------------------------------------
      # Post-deploy smoke. Cheap, and it is the only thing that knows whether
      # what shipped actually answers.
      # ---------------------------------------------------------------------
      #
      # Deliberately includes the rotated-chunk 404: `not_found_handling` is one
      # line of config away from silently reintroducing #759, where a missing
      # hashed chunk answered `200 text/html` and the `immutable` header pinned
      # that HTML into the HTTP cache for a year.
      - name: Smoke the deployed surfaces
        run: |
          set -euo pipefail
          fail=0
          check() {
            local url="$1" want="$2" label="$3"
            local got
            got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$got" = "$want" ]; then
              echo "  ok   $label ($got)"
            else
              echo "  FAIL $label — wanted $want, got $got" >&2
              fail=1
            fi
          }
          # The PRODUCTION hostnames, not workers.dev.
          #
          # Every check here used to target `*.alxjrvs.workers.dev`. That was
          # correct before P7 — those URLs were the only way to reach these
          # Workers — and became the wrong target the moment the nameservers
          # flipped. A broken route binding, a DNS record that did not get
          # created, or a custom domain detached from its Worker all pass a
          # workers.dev smoke test while production is down.
          #
          # One workers.dev check is kept below, deliberately: if the custom
          # domains fail and it passes, the Worker deployed fine and the routing
          # layer is what broke, which is a different fix.
          check https://salvageunion.io/ 200 "srd home"
          check https://salvageunion.io/nope-does-not-exist/ 404 "srd 404"
          check https://www.salvageunion.io/ 301 "srd www redirect"
          check https://intheunionnow.com/ 200 "itun shell"
          check https://intheunionnow.com/assets/index-DEADBEEF.js 404 "itun rotated chunk 404 (#759)"
          check https://assets.salvageunion.io/chassis/mule.webp 200 "artwork"
          # BODY, not status. The broken state returned 200 too — Cloudflare's
          # zone-level managed robots.txt, which carries no `Disallow` at all —
          # so a status check here would pass on exactly the regression it is
          # meant to catch: the licensed-artwork origin silently going from
          # closed to open to every crawler.
          robots=$(curl -fsS --max-time 15 https://assets.salvageunion.io/robots.txt || true)
          if printf '%s' "$robots" | grep -q '^Disallow: /$'; then
            echo "  ok   artwork origin disallows crawlers"
          else
            echo "  FAIL artwork origin robots.txt has no 'Disallow: /'" >&2
            fail=1
          fi
          # The one workers.dev check, isolating "did the Worker deploy" from
          # "did routing survive". See the note above.
          check https://su-srd.alxjrvs.workers.dev/ 200 "srd reachable on workers.dev"
          # /health answers 200 only when Discord itself accepted the bot token
          # (it calls /users/@me rather than checking a variable is non-empty),
          # 503 when the token is rejected or absent, 502 when Discord is
          # unreachable. A bad token is otherwise invisible until the first real
          # interaction — which, given the bot cutover is atomic across every
          # server, is the worst possible moment to find out.
          check https://su-discord-bot.alxjrvs.workers.dev/health 200 "bot token accepted by Discord"
          exit "$fail"
