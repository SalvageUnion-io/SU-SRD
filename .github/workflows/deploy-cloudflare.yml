name: Deploy (Cloudflare)

# Builds and deploys the site, the artwork Worker and the bot to Cloudflare Workers (ADR-033).
#
# WHY THE BUILD RUNS HERE AND NOT IN WORKERS BUILDS (ADR-033 §4). The site's build
# provisions a headless Chromium to render ~850 per-entity OG images, which is a
# poor fit for Cloudflare's build environment. Rather than split the build across
# two systems — one surface here, two there — everything builds in Actions and
# deploys with `wrangler`. One build path, and one place path-filtering lives.
#
# THE GATE IS THE RULESET. A push to `main` is a merged PR, and the `main`
# ruleset (strict, no bypass actors) merges only a branch that is up to date
# with `main` and passed `CI Success`, so the tree this deploys has already
# passed CI as that PR (docs/ARCHITECTURE.md#deploy).
#
# ---------------------------------------------------------------------------
# SHAPE: plan -> build-* -> deploy -> smoke -> record
# ---------------------------------------------------------------------------
#
#   plan       provenance, the deploy set and every credential guard. Holds no
#              artifact; fails before anything is built. Each Worker's bundle
#              was already proved by its CI build job on the merged PR.
#   build-web  the site's one build (the reference pages, then the app
#              into `dist/build/`, ADR-050) (.github/actions/build-site).
#              It uploads the exact `dist`
#              it produced and pushes nothing anywhere. It also renders the
#              OG images into that `dist`, best-effort: a failed render keeps
#              the default og:image.
#   deploy     a matrix leg per surface in the deploy set, in parallel. NO
#              leg starts until EVERY build job has finished green. The site's leg
#              ships the artifact its build job uploaded — nothing is rebuilt
#              between build and deploy.
#   smoke      the production smoke list, once, after every leg that ran.
#   record     moves `deployed/cloudflare`, only after smoke passed.
#
# The build finishes before any traffic moves, so a failed build cannot leave
# one app on the new commit and the other on the old — a partial deploy nobody
# chose.
#
# ARTIFACTS ARE BUILT HERE, NOT TAKEN FROM CI. CI's build has no release
# SHA or OG images, and may carry the test sign-in seam; and CI path-filters per PR while this deploys
# per last recorded deploy, so a surface can need shipping on a commit where CI
# skipped its build.
#
# `tools/check-workflows.ts` (deploy-order) asserts that ordering (reading
# through the local composite actions a job uses). Do not rename this file
# without updating that tool.

on:
  # Every merge. Only a same-repo push can reach `main`, and the `production`
  # Environment admits `main` alone.
  push:
    branches: [main]
  # Manual re-deploy, for when a deploy fails on something unrelated to the code
  # (a Cloudflare incident, a rotated token) and the commit is already green.
  #
  # `sha` is the ROLLBACK PATH: dispatch with the last known-good commit.
  # Validated as an ancestor of `main` before anything is built (see the guard
  # below), so it cannot become an "any branch straight to production" hole.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (must be an ancestor of main). Defaults to the tip of main.'
        required: false
        type: string
      # Ignore the last-deploy record and ship every surface. For recovering
      # from something the diff cannot see: a surface changed out of band in
      # the Cloudflare dashboard, or a record that is suspected to be wrong.
      force_all:
        description: 'Deploy every surface, ignoring what changed since the last recorded deploy.'
        required: false
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a half-uploaded asset
# manifest is worse than a queued deploy.
#
# GitHub keeps at most ONE pending run per group, so when three merges land
# close together the middle deploy is dropped from the queue. That is safe ONLY
# because the deploy set below is computed against the last RECORDED deploy,
# not against `HEAD^`: the run that survives diffs across every commit the
# dropped run would have shipped. Diffing `HEAD^..HEAD` here would silently
# skip any surface touched only by the dropped commit.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  # plan — decide, guard and pre-flight. Nothing here is built or shipped.
  # ===========================================================================
  plan:
    # A dispatch checks out the tip of whatever ref was selected, and every
    # branch cut from main carries this file, so only `main` may be dispatched
    # (a push is `main` by its trigger). Every later job `needs` this one,
    # directly or through a build job, so this one expression gates the whole
    # workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Environment's secrets, for the guards below, without recording a
    # deployment: nothing ships from this job.
    environment:
      name: production
      deployment: false
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      # `true` when HEAD is older than the recorded deploy on a push (a re-run
      # of an older merge's deploy): a newer commit already shipped. Nothing
      # builds or deploys, and `record` must not move the tag back.
      stale: ${{ steps.surfaces.outputs.stale }}
      # A JSON array of the app directories to ship, `[]` on a stale run:
      # the `deploy` matrix.
      deploy: ${{ steps.surfaces.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and the tree it checks out runs
          # `bun install` before any secret step — so no token is left in
          # .git/config for that code to find.
          persist-credentials: false
          # A dispatched `sha` (the rollback path), else the pushed commit.
          ref: ${{ inputs.sha || github.sha }}
          # Ancestry cannot be checked in a shallow clone, and the deploy-set
          # diff below needs the last deployed commit.
          fetch-depth: 0

      # The ONE place the deployed commit is named. Every later job checks out
      # exactly this sha, the build jobs stamp it into both apps and the
      # `record` job writes it to the deploy record, so a dispatched `sha` is
      # reported as itself rather than as the tip of main.
      - name: Resolve the commit being deployed
        id: target
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # A dispatched `sha` must be an ancestor of main. Without this the input
      # would reintroduce exactly what the `refs/heads/main` clause exists to
      # prevent: an arbitrary commit, with no CI having passed, deployed
      # straight to production by anyone with write access.
      - name: The dispatched commit must be an ancestor of main
        if: inputs.sha != ''
        # Through `env:`, never `${{ }}` inside the script: an expression is
        # spliced into the shell source before bash parses it, so a crafted
        # input would run as code in the job that holds the deploy secrets.
        env:
          DISPATCHED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$DISPATCHED_SHA" origin/main; then
            echo "FATAL: $DISPATCHED_SHA is not an ancestor of origin/main." >&2
            echo "Only a commit that has been on main — and therefore through CI — may be deployed." >&2
            exit 1
          fi
          echo "OK: $DISPATCHED_SHA is on main."

      # Which surfaces differ from what is live.
      #
      # The base is the LAST SUCCESSFUL DEPLOY — the `deployed/cloudflare` tag
      # that the `record` job below moves after every green run — never
      # `HEAD^`, which silently skips any surface touched only by a commit
      # whose deploy never ran. The logic, its reasoning and its
      # tests live in tools/deploy-surfaces.ts; it fails SAFE (no record, a
      # shared path or `force_all` deploys everything).
      #
      # It also refuses to go BACKWARDS on a push. A re-run of an older merge's
      # deploy can start after a newer one has already shipped; diffing
      # newer->older would ship the older tree over the newer one. Such a run
      # is `stale`: nothing deploys and the record stays put. Only a dispatch
      # (the rollback path) passes `--allow-backwards`.
      - name: Decide which surfaces to deploy
        id: surfaces
        run: >-
          bun tools/deploy-surfaces.ts
          ${{ inputs.force_all && '--force-all' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && '--allow-backwards' || '' }}

      # ---------------------------------------------------------------------
      # The guards. Before anything is built.
      # ---------------------------------------------------------------------
      #
      - name: Refuse to deploy without a Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: no CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      # The bot leg registers the slash commands after its Worker ships (see
      # `deploy`), with the bot token. Without it the Worker would ship command
      # handlers Discord never offers, so a run that ships the bot needs the
      # token before anything is built. The bot's Worker holds its own copy as a
      # wrangler secret; this one is the GitHub Environment's.
      - name: Refuse to deploy the bot without a Discord bot token
        if: contains(fromJSON(steps.surfaces.outputs.deploy), 'discord-bot')
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "FATAL: the bot ships in this run but DISCORD_TOKEN is not set," >&2
            echo "       so its slash commands could not be registered." >&2
            echo "Set it in Settings > Environments > production > Environment secrets." >&2
            exit 1
          fi

  # ===========================================================================
  # Builds — one job per surface that has one, in parallel. Each uploads the
  # exact `dist` it produced; its deploy job ships that artifact, unrebuilt.
  # ===========================================================================
  #
  # The bot has no build: wrangler bundles its Worker source
  # at deploy time, as CI's bundle-workers does.

  # The site — the static reference pages, with their OG images rendered into
  # the same `dist`, and the app in its `dist/build/`.
  build-web:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.deploy), 'web')
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          # The changelog page is `main`'s history (ADR-041); a shallow clone
          # would render one commit of it.
          fetch-depth: 0

      # The OG render runs inside it rather than in a job of its own, which
      # paid a second checkout, install and artifact round trip on the
      # deploy's critical path. Best-effort: a failed render (or browser
      # install) keeps the default og:image and never stops the deploy.
      - name: Build the site, render its OG images and upload it
        uses: ./.github/actions/build-site
        with:
          commit-ref: ${{ needs.plan.outputs.sha }}
          retention-days: '7'

  # ===========================================================================
  # The deploy — one leg per surface in the deploy set, in parallel, after
  # EVERY build is green.
  # ===========================================================================
  #
  # One matrix over the deploy set; the site's own step (its artifact) and
  # the bot's (its slash commands) are gated on `matrix.app`.
  #
  # Every leg `needs` every build, not just what it ships: a failed
  # build must stop the bot shipping too, or the run leaves production half on
  # the new commit. A job that was SKIPPED (its
  # surface did not change) is not a failure, which is why this uses
  # `!cancelled() && !failure()` rather than the implicit `success()` — the
  # implicit form checks every ancestor and would skip the deploy whenever any
  # surface was unchanged. An empty list skips the job (a matrix over an empty
  # array is an error, not a no-op), and so does a `plan` that did not
  # succeed, whose outputs are not JSON at all.
  #
  # `fail-fast: false`: one leg failing must not cancel another mid-upload, for
  # the same reason the concurrency group never cancels a deploy.
  #
  # wrangler is one root devDependency, so every `bun run deploy` runs the
  # version bun.lock resolved — audited and behind the 3-day release-age gate —
  # rather than a `bunx wrangler@x.y.z` fetched outside the lockfile. Bumping it
  # moves both together; keep `compatibility_date` in the two
  # wrangler.jsonc files at or below the workerd it bundles.
  #
  # wrangler bundles every Worker script here, and uploads its source maps
  # for Workers Issues (`upload_source_maps`); the bot has no other build. Discord's
  # Interactions Endpoint URL points at the bot's Worker, so this is the bot's
  # only deploy path; its secrets (DISCORD_TOKEN and friends) are wrangler
  # secrets set out of band, and a deploy does not touch them. The bot leg
  # also registers the slash commands, with the Environment's DISCORD_TOKEN.
  #
  # The site binds the bot's `Relay` entrypoint (`BOT`, apps/web/wrangler.jsonc).
  # While the two legs race, a roll or Stop Sign posted in that minute fails
  # and is logged, as when the bot is down; nothing else waits on it.
  deploy:
    needs: [plan, build-web]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.deploy != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.deploy) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download the site artifact
        if: matrix.app == 'web'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web

      # The shared database before the Worker that reads it: create it on the
      # first run, then every migration it has not had (tools/d1-migrate.ts).
      - name: Migrate the shared database
        if: matrix.app == 'web'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun tools/d1-migrate.ts su-shared

      - name: Deploy
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      # Every bot deploy, once its Worker is live, so Discord never offers a
      # command the Worker cannot answer. A bulk overwrite (commands/index.ts),
      # so it is idempotent and a removed command disappears; global commands
      # can take up to an hour to show in every client. The application id is
      # public and read from wrangler.jsonc, the one place it is written.
      - name: Register the slash commands
        if: matrix.app == 'discord-bot'
        working-directory: apps/discord-bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail
          DISCORD_CLIENT_ID=$(grep -oE '"DISCORD_APPLICATION_ID": *"[0-9]+"' wrangler.jsonc | grep -oE '[0-9]+')
          export DISCORD_CLIENT_ID
          bun run deploy-commands:global

  # ===========================================================================
  # Post-deploy smoke. Cheap, and it is the only thing that knows whether what
  # shipped actually answers.
  # ===========================================================================
  #
  # Deliberately includes the rotated-chunk 404: su-srd's Worker (for the SRD,
  # and for the app under `/build`) stops a missing hashed chunk
  # answering `200 text/html`, which the `immutable` header would pin into the
  # HTTP cache for a year.
  # The list lives in tools/smoke-production.sh so e2e-nightly.yml can run
  # the same checks on a schedule, catching a regression that happens
  # between deploys (a DNS record, a Redirect Rule, a rotated bot token).
  smoke:
    needs: [plan, deploy]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # From the WORKFLOW's commit, not the deployed tree. A rollback dispatch
      # deploys an older `sha` that may predate the script; running it from
      # that tree would exit 127 AFTER the deploy, skip `record`, and leave
      # `deployed/cloudflare` naming a commit production no longer serves.
      # The script needs nothing but curl, so only it is checked out.
      - name: Checkout the smoke list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/smoke-production.sh
          sparse-checkout-cone-mode: false

      - name: Smoke the deployed surfaces
        run: bash tools/smoke-production.sh

  # ---------------------------------------------------------------------------
  # The deploy record — what the next run diffs against.
  # ---------------------------------------------------------------------------
  #
  # Moves the lightweight tag `deployed/cloudflare` to the commit that just
  # shipped. Only after every deploy AND the smoke job succeeded: a run that
  # failed anywhere leaves the record where it was, so the next run re-deploys
  # every surface this one may have left half-done.
  #
  # A separate job so that `contents: write` is held by six lines of REST calls
  # and nothing else — never by a job that checks out and runs the tree. If
  # this job fails the deploy itself stands; the next run just diffs from an
  # older record and over-deploys, which is the safe direction.
  record:
    needs: [plan, smoke]
    # A stale run (an older merge's deploy re-run after a newer one shipped)
    # shipped nothing, and moving the record to it would make the NEXT run diff
    # from the older commit. Only a dispatch may move the record backwards.
    #
    # The explicit status functions are load-bearing. A bare `if:` gets an
    # implicit `success()`, which at job level checks EVERY ancestor — and a
    # skipped build job or deploy (an unchanged surface) makes it false, so a
    # partial deploy would leave the record behind and a later run of an older
    # commit would not be "stale": a silent rollback with every job green.
    # `smoke` must have actually passed.
    if: ${{ !cancelled() && !failure() && needs.smoke.result == 'success' && needs.plan.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the deployed/cloudflare tag to the deployed commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const sha = process.env.DEPLOYED_SHA ?? ''
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`plan job reported no usable commit sha (got '${sha}')`)
              return
            }
            const { owner, repo } = context.repo
            const ref = 'tags/deployed/cloudflare'
            try {
              // force: a rollback DISPATCH legitimately moves the record
              // BACKWARDS. A push never reaches here going backwards:
              // deploy-surfaces marks that run stale and this job is skipped.
              await github.rest.git.updateRef({ owner, repo, ref, sha, force: true })
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha })
            }
            core.info(`deployed/cloudflare -> ${sha}`)
